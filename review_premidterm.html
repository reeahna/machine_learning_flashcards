  {id:"lec6_05",lecture:"Lecture 6",topic:"Learning Curves",type:"mc",label:"Multiple Choice",
   q:"A learning curve shows a large gap between the training error (very low) and validation error (much higher). What does this indicate?",
   opts:["Underfitting — both curves should be lower","Overfitting — the model performs much better on training data than validation data","A well-fitted model","The model needs a lower learning rate"],
   ans:1,exp:"A large gap between training error (low) and validation error (high) is the hallmark of overfitting. The model has memorized the training data but fails to generalize. Adding more training data would help close this gap."},
  {id:"lec6_06",lecture:"Lecture 6",topic:"Learning Curves",type:"ms",label:"Multi-Select",
   q:"Which of the following are true about learning curves? Select all that apply.",
   opts:["They plot training and validation error vs. training set size","An underfitting model shows both curves plateauing high and close together","An overfitting model shows a large gap between training and validation error","If a model is overfitting, adding more training data would eventually help close the gap","Learning curves can only be used for linear models"],
   ans:[0,1,2,3],exp:"All of A, B, C, D are true. Learning curves show error vs. set size (A), underfitting shows both curves high and close (B), overfitting shows a gap (C), and adding data closes the gap for overfitting models (D). They work for any model type (E is false)."},
  {id:"lec6_07",lecture:"Lecture 6",topic:"Ridge Regression",type:"mc",label:"Multiple Choice",
   q:"What is Ridge Regression?",
   opts:["A regularized version of Linear Regression that adds half the square of the ℓ₂ norm of the weights to the cost function","A regularized version that adds the ℓ₁ norm of the weights to the cost function","A technique that removes features with small weights","A polynomial regression method with constrained degree"],
   ans:0,exp:"Ridge Regression (Tikhonov regularization) adds a regularization term (½α Σθⱼ²) — half the square of the ℓ₂ norm — to the cost function. This forces the algorithm to keep model weights small."},
  {id:"lec6_08",lecture:"Lecture 6",topic:"Ridge Regression",type:"eq",label:"Equation",
   q:"What is the Ridge Regression cost function?",
   opts:["J(θ) = MSE(θ) + α × (1/2) Σⱼ₌₁ⁿ θⱼ²","J(θ) = MSE(θ) + α Σⱼ₌₁ⁿ |θⱼ|","J(θ) = MSE(θ) + r × α Σ|θⱼ| + (1−r)/2 × α Σθⱼ²","J(θ) = MSE(θ) − α Σⱼ₌₁ⁿ θⱼ²"],
   ans:0,exp:"Ridge cost = MSE(θ) + α × (1/2) Σθⱼ². Option B is Lasso (ℓ₁). Option C is Elastic Net. Note: the sum starts from j=1 (the bias θ₀ is NOT regularized)."},
  {id:"lec6_09",lecture:"Lecture 6",topic:"Ridge Regression",type:"mc",label:"Multiple Choice",
   q:"In Ridge Regression, what happens when the regularization hyperparameter α is very large?",
   opts:["The model weights grow very large","All weights end up very close to zero, resulting in a flat line through the data mean","The model becomes equivalent to ordinary linear regression","The model always perfectly fits the training data"],
   ans:1,exp:"When α is very large in Ridge Regression, the regularization term dominates and all weights end up very close to zero. The result is essentially a flat line going through the data's mean — extreme underfitting."},
  {id:"lec6_10",lecture:"Lecture 6",topic:"Ridge Regression",type:"tf",label:"True / False",
   q:"True or False: In Ridge Regression, the bias term θ₀ is also regularized (included in the regularization sum).",
   opts:["True","False"],
   ans:1,exp:"False. The regularization sum in Ridge (and Lasso) starts from j=1, not j=0. The bias term θ₀ is NOT regularized — only the feature weights θ₁ through θₙ are."},
  {id:"lec6_11",lecture:"Lecture 6",topic:"Lasso Regression",type:"mc",label:"Multiple Choice",
   q:"What is Lasso Regression and what makes it different from Ridge?",
   opts:["Lasso uses the ℓ₂ norm; Ridge uses the ℓ₁ norm","Lasso uses the ℓ₁ norm (absolute values); Ridge uses ℓ₂ norm (squared values). Lasso tends to reduce useless feature weights all the way to zero.","They are identical except Lasso is faster to compute","Lasso does not use a regularization hyperparameter"],
   ans:1,exp:"Lasso uses the ℓ₁ norm (absolute values of weights) rather than Ridge's ℓ₂ norm (squared values). Lasso's key property: it tends to reduce the weights of useless features completely to zero, effectively performing automatic feature selection."},
  {id:"lec6_12",lecture:"Lecture 6",topic:"Lasso Regression",type:"eq",label:"Equation",
   q:"What is the Lasso Regression cost function?",
   opts:["J(θ) = MSE(θ) + α × (1/2) Σθⱼ²","J(θ) = MSE(θ) + α Σⱼ₌₁ⁿ |θⱼ|","J(θ) = MSE(θ) + r × α Σ|θⱼ| + (1−r)/2 × α Σθⱼ²","J(θ) = MSE(θ) × α Σ|θⱼ|"],
   ans:1,exp:"Lasso cost = MSE(θ) + α Σ|θⱼ| (the ℓ₁ norm — absolute values of weights). Option A is Ridge (½ α Σθⱼ²). Option C is Elastic Net."},
  {id:"lec6_13",lecture:"Lecture 6",topic:"Lasso Regression",type:"tf",label:"True / False",
   q:"True or False: Lasso Regression can effectively perform automatic feature selection by reducing the weights of unimportant features to exactly zero.",
   opts:["True","False"],
   ans:0,exp:"True. This is Lasso's key advantage over Ridge. Because Lasso uses the ℓ₁ norm, it tends to completely zero out weights for irrelevant features, effectively removing them from the model and performing automatic feature selection."},
  {id:"lec6_14",lecture:"Lecture 6",topic:"Elastic Net",type:"mc",label:"Multiple Choice",
   q:"What is Elastic Net?",
   opts:["A model that uses elastic activation functions","A middle ground between Ridge and Lasso that mixes both regularization terms, controlled by a mix ratio r","A form of early stopping applied during training","A variant of Lasso that also regularizes the bias term"],
   ans:1,exp:"Elastic Net mixes Ridge and Lasso regularization terms with a mix ratio r. When r=0, it is equivalent to Ridge. When r=1, it is equivalent to Lasso. This makes it more flexible than either alone."},
  {id:"lec6_15",lecture:"Lecture 6",topic:"Elastic Net",type:"mc",label:"Multiple Choice",
   q:"When does Elastic Net become equivalent to Ridge Regression?",
   opts:["When r = 1","When r = 0","When α = 0","When α = 1"],
   ans:1,exp:"When the mix ratio r = 0, Elastic Net becomes equivalent to Ridge Regression (only the ℓ₂ term remains). When r = 1, it becomes equivalent to Lasso (only the ℓ₁ term remains)."},
  {id:"lec6_16",lecture:"Lecture 6",topic:"Regularization Choice",type:"mc",label:"Multiple Choice",
   q:"According to your slides, which regularization method is the recommended default?",
   opts:["Plain Linear Regression (no regularization)","Lasso Regression","Elastic Net","Ridge Regression"],
   ans:3,exp:"Your slides recommend Ridge Regression as a good default. It is almost always preferable to have at least some regularization, so plain Linear Regression should generally be avoided."},
  {id:"lec6_17",lecture:"Lecture 6",topic:"Regularization Choice",type:"mc",label:"Multiple Choice",
   q:"When should you prefer Lasso or Elastic Net over Ridge?",
   opts:["When you have many training instances","When you suspect only a few features are useful (they tend to zero out useless feature weights)","When the learning rate is too large","When the model is underfitting"],
   ans:1,exp:"Prefer Lasso or Elastic Net when you suspect only a few features are actually useful. Both tend to reduce useless features' weights to zero, performing automatic feature selection. Ridge keeps all features with small but non-zero weights."},
  {id:"lec6_18",lecture:"Lecture 6",topic:"Regularization Choice",type:"mc",label:"Multiple Choice",
   q:"When should you prefer Elastic Net over Lasso?",
   opts:["When you have very few features","When the number of features exceeds the number of training instances, or when features are strongly correlated","When you want the most sparse model possible","When Ridge is already performing well"],
   ans:1,exp:"Prefer Elastic Net over Lasso when the number of features is greater than the number of training instances OR when several features are strongly correlated — Lasso may behave erratically in these cases."},
  {id:"lec6_19",lecture:"Lecture 6",topic:"Regularization Choice",type:"ms",label:"Multi-Select",
   q:"Which of the following statements about regularization choices are correct according to your slides? Select all that apply.",
   opts:["It is almost always preferable to have at least some regularization","Ridge is a good default regularization method","Lasso and Elastic Net are preferred when only a few features are useful","Elastic Net is preferred over Lasso when features are strongly correlated or features > instances","Plain Linear Regression (no regularization) is almost never a good choice"],
   ans:[0,1,2,3,4],exp:"All five statements are explicitly stated in your slides. It is almost always better to have regularization (A). Ridge is the default (B). Lasso/Elastic Net for sparse features (C). Elastic Net over Lasso for correlated/high-dimensional data (D). Avoid plain linear regression (E)."},
  {id:"lec6_20",lecture:"Lecture 6",topic:"Early Stopping",type:"mc",label:"Multiple Choice",
   q:"What is early stopping?",
   opts:["Stopping training after a fixed number of iterations regardless of performance","Stopping training as soon as the validation error reaches a minimum","Stopping training when the training error reaches zero","Reducing the learning rate when training error stops decreasing"],
   ans:1,exp:"Early stopping means stopping the training process as soon as the validation error reaches a minimum. This prevents the model from continuing to overfit the training data after finding the best generalization point."},
  {id:"lec6_21",lecture:"Lecture 6",topic:"Early Stopping",type:"tf",label:"True / False",
   q:"True or False: Early stopping is a form of regularization.",
   opts:["True","False"],
   ans:0,exp:"True. Your slides explicitly describe early stopping as 'a very different way to regularize iterative learning algorithms.' It prevents overfitting by stopping training before the model overfits, making it a regularization technique."},
  {id:"lec6_22",lecture:"Lecture 6",topic:"Early Stopping",type:"mc",label:"Multiple Choice",
   q:"When using Stochastic or Mini-batch GD with early stopping, why can't you simply stop as soon as the validation error starts rising?",
   opts:["Because the learning rate is too high at that point","Because the curves are not smooth — validation error may temporarily rise before continuing to drop. You should stop after the error has stayed above the minimum for some time, then roll back.","Because early stopping only works with Batch GD","Because the training error must also be monitored simultaneously"],
   ans:1,exp:"With SGD and Mini-batch GD, the validation error curve is not smooth — it bounces around. A brief rise doesn't necessarily mean the minimum has passed. The solution is to stop only after the validation error has been above the minimum for some time, then roll back parameters to the minimum point."},
  {id:"lec6_23",lecture:"Lecture 6",topic:"Ridge Regression",type:"ms",label:"Multi-Select",
   q:"Which of the following are true about Ridge Regression? Select all that apply.",
   opts:["It adds the ℓ₂ norm of the weights to the cost function","It tends to set useless feature weights exactly to zero","It forces the learning algorithm to keep model weights small","The hyperparameter α controls the strength of regularization","It is also called Tikhonov regularization"],
   ans:[0,2,3,4],exp:"Ridge adds the ℓ₂ norm (A), keeps weights small (C), α controls strength (D), also called Tikhonov regularization (E). The property of setting weights exactly to zero belongs to LASSO, not Ridge (B is false — Ridge only shrinks weights toward zero, not to exactly zero)."},
  {id:"lec6_24",lecture:"Lecture 6",topic:"Polynomial Regression",type:"ms",label:"Multi-Select",
   q:"Which of the following are true about Polynomial Regression? Select all that apply.",
   opts:["It can fit non-linear data","It is a non-linear model because it uses polynomial features","It is still a linear model — linear in the parameters","High-degree polynomial regression is prone to overfitting","Low-degree polynomial regression can underfit if the data is complex"],
   ans:[0,2,3,4],exp:"Polynomial Regression fits non-linear data (A), but it is still a LINEAR model because it is linear in the parameters (C — B is false). High-degree polynomials overfit (D) and low-degree models can underfit complex data (E)."},
  {id:"lec6_25",lecture:"Lecture 6",topic:"Lasso Regression",type:"ms",label:"Multi-Select",
   q:"Which of the following are true about Lasso Regression? Select all that apply.",
   opts:["It uses the ℓ₁ norm of the weight vector","It tends to reduce useless feature weights to exactly zero","It performs automatic feature selection","It may behave erratically when features > instances or features are highly correlated","It uses the ℓ₂ norm of the weight vector"],
   ans:[0,1,2,3],exp:"Lasso uses ℓ₁ norm (A), reduces useless weights to zero (B), performs feature selection (C), and can be erratic with correlated/high-dimensional data (D). Option E (ℓ₂ norm) describes Ridge, not Lasso."},
  {id:"lec6_26",lecture:"Lecture 6",topic:"Learning Curves",type:"ms",label:"Multi-Select",
   q:"Which of the following describe an overfitting model's learning curves? Select all that apply.",
   opts:["There is a large gap between training error and validation error","Training error is much lower than validation error","Both curves plateau at a high value close together","Adding more training data would help reduce the gap","The model performs significantly better on training data than validation data"],
   ans:[0,1,3,4],exp:"Overfitting: large gap (A), training error much lower than validation error (B), adding data helps close the gap (D), model performs better on training data (E). Both curves high and close together (C) describes underfitting, not overfitting."},
  {id:"lec6_27",lecture:"Lecture 6",topic:"Regularization Choice",type:"mc",label:"Multiple Choice",
   q:"Which norm does Ridge use, and which does Lasso use?",
   opts:["Ridge uses ℓ₁ norm; Lasso uses ℓ₂ norm","Ridge uses ℓ₂ norm; Lasso uses ℓ₁ norm","Both use ℓ₂ norm","Both use ℓ₁ norm"],
   ans:1,exp:"Ridge uses the ℓ₂ norm (squared weights: Σθⱼ²). Lasso uses the ℓ₁ norm (absolute values: Σ|θⱼ|). This difference in norm is what causes Lasso to zero out weights while Ridge only shrinks them."},
  {id:"lec6_28",lecture:"Lecture 6",topic:"Ridge Regression",type:"mc",label:"Multiple Choice",
   q:"According to your slides, when using Polynomial Regression, if your model is overfitting you should consider...",
   opts:["Increasing the polynomial degree","Reducing the polynomial degree or adding regularization","Removing the regularization term","Increasing the learning rate"],
   ans:1,exp:"If a polynomial model is overfitting, you should reduce the polynomial degree (simplify the model) or add regularization (Ridge, Lasso, or Elastic Net). Your slides explicitly show how regularization constrains polynomial models to reduce overfitting."},
  {id:"lec7_01",lecture:"Lecture 7",topic:"Logistic Regression Basics",type:"mc",label:"Multiple Choice",
   q:"What is Logistic Regression commonly used for?",
   opts:["Predicting a continuous output value","Estimating the probability that an instance belongs to a particular class (binary classification)","Clustering unlabeled data into groups","Reducing the dimensionality of a dataset"],
   ans:1,exp:"Logistic Regression is commonly used to estimate the probability that an instance belongs to a particular class — e.g., what is the probability this email is spam? If the estimated probability ≥ 50%, the model predicts positive class (1); otherwise negative class (0)."},
  {id:"lec7_02",lecture:"Lecture 7",topic:"Logistic Regression Basics",type:"tf",label:"True / False",
   q:"True or False: Logistic Regression is a binary classifier.",
   opts:["True","False"],
   ans:0,exp:"True. Logistic Regression outputs a probability estimate and then predicts class 1 if p̂ ≥ 0.5 and class 0 if p̂ < 0.5. This makes it a binary classifier."},
  {id:"lec7_03",lecture:"Lecture 7",topic:"Logistic Regression Basics",type:"mc",label:"Multiple Choice",
   q:"How does Logistic Regression differ from Linear Regression in its computation?",
   opts:["Logistic Regression uses a different cost function but outputs the weighted sum directly","Logistic Regression computes the same weighted sum of features but then passes it through the logistic (sigmoid) function instead of outputting it directly","Logistic Regression uses matrix decomposition while Linear Regression uses Gradient Descent","They are identical except Logistic Regression minimizes cross-entropy instead of MSE"],
   ans:1,exp:"Like Linear Regression, Logistic Regression computes a weighted sum (xᵀθ). But instead of outputting this directly, it passes it through the sigmoid/logistic function σ(xᵀθ), which squashes the output to a value between 0 and 1 (a probability)."},
  {id:"lec7_04",lecture:"Lecture 7",topic:"Sigmoid Function",type:"eq",label:"Equation",
   q:"What is the sigmoid (logistic) function?",
   opts:["σ(t) = 1 / (1 + e⁻ᵗ)","σ(t) = eᵗ / (Σ eˢ)","σ(t) = max(0, t)","σ(t) = t / (1 + |t|)"],
   ans:0,exp:"The sigmoid function is σ(t) = 1 / (1 + e⁻ᵗ). It produces an S-shaped curve that outputs values between 0 and 1. When t = 0, σ(0) = 0.5. As t → +∞, σ → 1. As t → −∞, σ → 0."},
  {id:"lec7_05",lecture:"Lecture 7",topic:"Sigmoid Function",type:"mc",label:"Multiple Choice",
   q:"What is the output range of the sigmoid function?",
   opts:["−∞ to +∞","0 to ∞","0 to 1 (exclusive)","−1 to 1"],
   ans:2,exp:"The sigmoid function always outputs a value strictly between 0 and 1. This is what makes it suitable for representing a probability — every output can be interpreted as the probability of belonging to the positive class."},
  {id:"lec7_06",lecture:"Lecture 7",topic:"Sigmoid Function",type:"mc",label:"Multiple Choice",
   q:"What is the logit (log-odds) in Logistic Regression?",
   opts:["The final predicted class label (0 or 1)","The score t = xᵀθ that is passed through the sigmoid function; also the log of the odds ratio","The logarithm of the cost function","The gradient of the cost function with respect to θ"],
   ans:1,exp:"The logit (also called log-odds) is the score t = xᵀθ. The term 'logit' comes from the logit function logit(p) = log(p/(1−p)), which is the inverse of the logistic/sigmoid function. The logit represents the log of the ratio of the probability of positive vs. negative class."},
  {id:"lec7_07",lecture:"Lecture 7",topic:"Sigmoid Function",type:"eq",label:"Equation",
   q:"What is the complete probability estimate formula for Logistic Regression?",
   opts:["p̂ = σ(xᵀθ) = 1 / (1 + exp(−xᵀθ))","p̂ = xᵀθ","p̂ = exp(xᵀθ) / Σ exp(xᵀθ)","p̂ = max(0, xᵀθ)"],
   ans:0,exp:"The probability estimate is p̂ = σ(xᵀθ) = 1 / (1 + exp(−xᵀθ)). This combines the linear model (xᵀθ) with the sigmoid function to produce a probability output between 0 and 1."},
  {id:"lec7_08",lecture:"Lecture 7",topic:"Sigmoid Function",type:"ms",label:"Multi-Select",
   q:"Which of the following are true about the sigmoid function? Select all that apply.",
   opts:["Its output is always between 0 and 1","It is also called the logistic function","It is S-shaped","It outputs exactly 0.5 when its input is 0","It is the same as the softmax function"],
   ans:[0,1,2,3],exp:"The sigmoid outputs values between 0 and 1 (A), is also called the logistic function (B), is S-shaped (C), and equals 0.5 when input is 0 (D). The softmax function is a generalization of sigmoid for multiple classes but is not the same thing (E is false)."},
  {id:"lec7_09",lecture:"Lecture 7",topic:"Decision Boundary",type:"mc",label:"Multiple Choice",
   q:"What is the decision boundary in Logistic Regression?",
   opts:["The point where the cost function reaches its minimum","The set of points where p̂ = 0.5 (i.e. xᵀθ = 0), which is a linear boundary","The threshold where the model switches from using GD to the Normal Equation","The point where training error equals validation error"],
   ans:1,exp:"The decision boundary is where p̂ = 0.5, which occurs when xᵀθ = 0. This is a linear boundary — a line in 2D, a hyperplane in higher dimensions. This is why Logistic Regression creates linear decision boundaries despite being used for classification."},
  {id:"lec7_10",lecture:"Lecture 7",topic:"Decision Boundary",type:"tf",label:"True / False",
   q:"True or False: Logistic Regression creates a linear decision boundary.",
   opts:["True","False"],
   ans:0,exp:"True. Despite its name and use for classification, Logistic Regression creates a linear decision boundary (a hyperplane defined by xᵀθ = 0). Your slides confirm this — the decision boundaries between classes are linear."},
  {id:"lec7_11",lecture:"Lecture 7",topic:"Cost Function",type:"mc",label:"Multiple Choice",
   q:"What is the cost function for Logistic Regression called?",
   opts:["Mean Squared Error (MSE)","Root Mean Square Error (RMSE)","Log loss (binary cross-entropy / negative log-likelihood)","Hinge loss"],
   ans:2,exp:"The cost function for Logistic Regression is called log loss (also called binary cross-entropy or negative log-likelihood). It is derived from maximum likelihood estimation and penalizes the model when it estimates low probability for the correct class."},
  {id:"lec7_12",lecture:"Lecture 7",topic:"Cost Function",type:"eq",label:"Equation",
   q:"What is the log loss (cost function) for Logistic Regression?",
   opts:["J(θ) = −(1/m) Σ [y⁽ⁱ⁾ log(p̂⁽ⁱ⁾) + (1−y⁽ⁱ⁾) log(1−p̂⁽ⁱ⁾)]","J(θ) = (1/m) Σ (p̂⁽ⁱ⁾ − y⁽ⁱ⁾)²","J(θ) = (1/m) Σ |p̂⁽ⁱ⁾ − y⁽ⁱ⁾|","J(θ) = Σ max(0, 1 − y⁽ⁱ⁾ × p̂⁽ⁱ⁾)"],
   ans:0,exp:"Log loss = −(1/m) Σ [y log(p̂) + (1−y) log(1−p̂)]. When y=1, cost = −log(p̂) — large if p̂ is close to 0. When y=0, cost = −log(1−p̂) — large if p̂ is close to 1. Option B is MSE, Option D is hinge loss (SVM)."},
  {id:"lec7_13",lecture:"Lecture 7",topic:"Cost Function",type:"ms",label:"Multi-Select",
   q:"Which of the following are true about the Logistic Regression cost function? Select all that apply.",
   opts:["There is no closed-form solution (no equivalent to the Normal Equation)","The cost function is convex","Gradient Descent is guaranteed to find the global minimum","The cost function is called log loss or binary cross-entropy","The cost function is Mean Squared Error (MSE)"],
   ans:[0,1,2,3],exp:"There is NO Normal Equation for Logistic Regression (A). The cost function IS convex (B), so GD finds the global minimum (C). It is called log loss or binary cross-entropy (D). It is NOT MSE — that's for linear regression (E is false)."},
  {id:"lec7_14",lecture:"Lecture 7",topic:"Cost Function",type:"tf",label:"True / False",
   q:"True or False: There is a closed-form equation (like the Normal Equation) for computing the optimal θ in Logistic Regression.",
   opts:["True","False"],
   ans:1,exp:"False. Your slides explicitly state: 'there is no known closed-form equation to compute the value of θ that minimizes this cost function (there is no equivalent of the Normal Equation).' You must use Gradient Descent or another optimization algorithm."},
  {id:"lec7_15",lecture:"Lecture 7",topic:"Cost Function",type:"mc",label:"Multiple Choice",
   q:"Why does the log loss penalize a model that estimates close to 0 probability for a positive instance?",
   opts:["Because the cost function adds the absolute error for each instance","Because −log(p̂) grows very large as p̂ approaches 0, so estimating near-0 probability for a positive instance incurs a huge cost","Because the MSE increases when the prediction is wrong","Because the cost function compares probabilities using the Euclidean norm"],
   ans:1,exp:"The cost for a positive instance (y=1) is −log(p̂). As p̂ → 0, −log(p̂) → ∞. So if the model confidently predicts 'not positive' for an actually positive instance, the cost becomes extremely large. Conversely, if p̂ → 1, −log(p̂) → 0 (no cost)."},
  {id:"lec7_16",lecture:"Lecture 7",topic:"Maximum Likelihood",type:"mc",label:"Multiple Choice",
   q:"What is the maximum likelihood perspective for Logistic Regression?",
   opts:["It maximizes the MSE to find the best parameters","The likelihood L = p̂ʸ(1−p̂)^(1−y) is maximized, which is equivalent to minimizing the negative log-likelihood (cross-entropy loss)","It maximizes the margin between classes","It minimizes the number of misclassified instances"],
   ans:1,exp:"From a maximum likelihood perspective, the likelihood of observing label y given predicted probability p̂ is L = p̂ʸ(1−p̂)^(1−y). Maximizing the likelihood over all training instances (or equivalently minimizing the negative log-likelihood) gives exactly the cross-entropy (log loss) cost function."},
  {id:"lec7_17",lecture:"Lecture 7",topic:"Maximum Likelihood",type:"tf",label:"True / False",
   q:"True or False: Minimizing the negative log-likelihood for Logistic Regression is equivalent to minimizing the cross-entropy loss.",
   opts:["True","False"],
   ans:0,exp:"True. Your slides show this derivation: the negative log-likelihood −log(L) = −Σ[yᵢ log(p̂ᵢ) + (1−yᵢ) log(1−p̂ᵢ)], which is exactly the cross-entropy loss function for binary classification."},
  {id:"lec7_18",lecture:"Lecture 7",topic:"Maximum Likelihood",type:"mc",label:"Multiple Choice",
   q:"According to your slides, what is the connection between MSE loss in linear regression and maximum likelihood?",
   opts:["MSE is the cross-entropy for regression problems","The MSE loss function is directly analogous to one of the terms in the negative log-likelihood for linear regression (assuming Gaussian noise)","MSE and log-likelihood are completely unrelated","MSE maximizes the likelihood while log loss minimizes it"],
   ans:1,exp:"Your slides show that when you assume Gaussian noise in linear regression and take the negative log-likelihood, the MSE loss function appears directly as one of the terms. This connects MSE to maximum likelihood estimation."},
  {id:"lec7_19",lecture:"Lecture 7",topic:"Sigmoid Function",type:"mc",label:"Multiple Choice",
   q:"According to your slides, what is the 'logit' also called?",
   opts:["The sigmoid output","The log-odds (log of the ratio of positive to negative class probability)","The regularization hyperparameter","The decision threshold"],
   ans:1,exp:"The logit is also called log-odds, since it is the log of the ratio between the estimated probability for the positive class and the estimated probability for the negative class: logit(p) = log(p/(1−p))."},
  {id:"lec7_20",lecture:"Lecture 7",topic:"Logistic Regression Basics",type:"ms",label:"Multi-Select",
   q:"Which of the following are true about Logistic Regression? Select all that apply.",
   opts:["It estimates the probability that an instance belongs to a class","It is a binary classifier","It creates a linear decision boundary","It uses the sigmoid function to produce probability outputs","It can directly handle more than two classes without modification"],
   ans:[0,1,2,3],exp:"Logistic Regression estimates class probabilities (A), is a binary classifier (B), creates a linear decision boundary (C), and uses the sigmoid function (D). Without modification (e.g. OvR or using Softmax/Multinomial), it is strictly binary — it cannot natively handle more than two classes (E is false)."},
  {id:"lec7_21",lecture:"Lecture 7",topic:"Decision Boundary",type:"mc",label:"Multiple Choice",
   q:"At what value of xᵀθ does the sigmoid function output exactly 0.5, forming the decision boundary?",
   opts:["xᵀθ = 1","xᵀθ = 0","xᵀθ = −1","xᵀθ = 0.5"],
   ans:1,exp:"When xᵀθ = 0, σ(0) = 1/(1+e⁰) = 1/(1+1) = 0.5. The decision boundary is the hyperplane where xᵀθ = 0, which is where p̂ = 0.5 — the threshold between predicting class 0 and class 1."},
  {id:"lec7_22",lecture:"Lecture 7",topic:"Cost Function",type:"mc",label:"Multiple Choice",
   q:"Since the Logistic Regression cost function is convex, what does this guarantee about Gradient Descent?",
   opts:["GD will always converge in exactly 100 iterations","GD is guaranteed to find the global minimum (if the learning rate is not too large and you wait long enough)","GD will find a local minimum but not necessarily the global minimum","GD is not needed because a closed-form solution exists"],
   ans:1,exp:"Because the log loss cost function is convex, Gradient Descent (or any optimization algorithm) is guaranteed to find the global minimum — given the learning rate is not too large and you wait long enough. There are no local minima to get stuck in."},
  {id:"lec7_23",lecture:"Lecture 7",topic:"Logistic Regression Basics",type:"mc",label:"Multiple Choice",
   q:"What is the prediction rule for Logistic Regression?",
   opts:["Predict 1 if p̂ > 0; predict 0 if p̂ ≤ 0","Predict 1 if p̂ ≥ 0.5; predict 0 if p̂ < 0.5","Predict 1 if p̂ > 0.9; predict 0 otherwise","Predict the class with the highest score regardless of probability"],
   ans:1,exp:"The prediction rule is: ŷ = 1 if p̂ ≥ 0.5, ŷ = 0 if p̂ < 0.5. Since σ(t) = 0.5 when t = 0, this means predict 1 when xᵀθ ≥ 0 and predict 0 when xᵀθ < 0."},
  {id:"lec7_24",lecture:"Lecture 7",topic:"Sigmoid Function",type:"ms",label:"Multi-Select",
   q:"Which of the following correctly describe the relationship between the logit and logistic functions? Select all that apply.",
   opts:["The logit function is the inverse of the sigmoid (logistic) function","logit(p) = log(p / (1 − p))","The score t = xᵀθ is also called the logit","The logit maps probabilities (0 to 1) to real numbers (−∞ to +∞)","The logit is always between 0 and 1"],
   ans:[0,1,2,3],exp:"The logit is the inverse of the sigmoid (A). logit(p) = log(p/(1−p)) (B). The score t = xᵀθ is called the logit (C). The logit maps probabilities to real numbers (D). The logit is NOT between 0 and 1 — it ranges from −∞ to +∞ (E is false)."},
  {id:"lec7_25",lecture:"Lecture 7",topic:"Cost Function",type:"ms",label:"Multi-Select",
   q:"Which of the following are ways to describe the Logistic Regression cost function? Select all that apply.",
   opts:["Log loss","Binary cross-entropy","Negative log-likelihood","Mean Squared Error (MSE)","Hinge loss"],
   ans:[0,1,2],exp:"The Logistic Regression cost function can be described as log loss (A), binary cross-entropy (B), or negative log-likelihood (C) — these are all the same thing. MSE (D) is for linear regression. Hinge loss (E) is used by SVMs."},
  {id:"lec7_26",lecture:"Lecture 7",topic:"Logistic Regression Basics",type:"mc",label:"Multiple Choice",
   q:"What does it mean that Logistic Regression's decision boundary is 'linear in the parameters'?",
   opts:["The predictions are always 0 or 1 with no gradient","The decision boundary is a straight line (or hyperplane) defined by the linear equation xᵀθ = 0","The model uses linear activation functions at each layer","The cost function decreases linearly during training"],
   ans:1,exp:"The decision boundary xᵀθ = 0 is a linear equation — it defines a straight line in 2D or a hyperplane in higher dimensions. Although Logistic Regression models non-linear probability curves (via sigmoid), the boundary between classes is always linear."},
  {id:"lec8_01",lecture:"Lecture 8",topic:"Softmax Regression Basics",type:"mc",label:"Multiple Choice",
   q:"What is Softmax Regression also called?",
   opts:["Hard Margin Classification","Multinomial Logistic Regression","One-versus-Rest Logistic Regression","Support Vector Classification"],
   ans:1,exp:"Softmax Regression is also called Multinomial Logistic Regression. It is a generalization of Logistic Regression that directly supports multiple classes without needing to combine multiple binary classifiers."},
  {id:"lec8_02",lecture:"Lecture 8",topic:"Softmax Regression Basics",type:"mc",label:"Multiple Choice",
   q:"How does Softmax Regression generalize Logistic Regression?",
   opts:["It adds a regularization term to the Logistic Regression cost function","It generalizes Logistic Regression to support multiple classes directly without training and combining multiple binary classifiers","It applies Logistic Regression to each feature separately","It uses a different cost function but the same prediction rule"],
   ans:1,exp:"Softmax Regression generalizes Logistic Regression to multiple classes directly. While Logistic Regression is binary, Softmax handles K classes by computing a score for each class and estimating probabilities via the softmax function."},
  {id:"lec8_03",lecture:"Lecture 8",topic:"Softmax Regression Basics",type:"mc",label:"Multiple Choice",
   q:"What does Softmax Regression compute for each instance before estimating probabilities?",
   opts:["A single probability for the most likely class","A score sₖ(x) for each class k","A decision boundary for each pair of classes","A confusion matrix entry for each class"],
   ans:1,exp:"Softmax Regression first computes a score sₖ(x) = (θ⁽ᵏ⁾)ᵀx for each class k, then converts these scores into probabilities using the softmax function. Each class has its own dedicated parameter vector θ⁽ᵏ⁾."},
  {id:"lec8_04",lecture:"Lecture 8",topic:"Softmax Regression Basics",type:"eq",label:"Equation",
   q:"What is the score equation for class k in Softmax Regression?",
   opts:["sₖ(x) = (θ⁽ᵏ⁾)ᵀ x","sₖ(x) = σ(xᵀθ)","sₖ(x) = exp(xᵀθ) / Σ exp(xᵀθ)","sₖ(x) = 1 / (1 + exp(−xᵀθ))"],
   ans:0,exp:"The score for class k is sₖ(x) = (θ⁽ᵏ⁾)ᵀx — just like the Linear Regression prediction equation, but each class has its own parameter vector θ⁽ᵏ⁾. All these vectors are stored as rows in the parameter matrix Θ."},
  {id:"lec8_05",lecture:"Lecture 8",topic:"Softmax Function",type:"eq",label:"Equation",
   q:"What is the softmax function (probability for class k)?",
   opts:["p̂ₖ = exp(sₖ(x)) / Σⱼ₌₁ᴷ exp(sⱼ(x))","p̂ₖ = 1 / (1 + exp(−sₖ(x)))","p̂ₖ = sₖ(x) / Σⱼ sⱼ(x)","p̂ₖ = argmax_k sₖ(x)"],
   ans:0,exp:"The softmax function is p̂ₖ = exp(sₖ(x)) / Σⱼ₌₁ᴷ exp(sⱼ(x)). It computes the exponential of every score, then normalizes by dividing by the sum of all exponentials. This ensures outputs are between 0 and 1 and sum to 1."},
  {id:"lec8_06",lecture:"Lecture 8",topic:"Softmax Function",type:"mc",label:"Multiple Choice",
   q:"What is the softmax function also called?",
   opts:["Normalized sigmoid","Normalized exponential","Logistic normalization","Probability calibration function"],
   ans:1,exp:"The softmax function is also called the normalized exponential. It computes the exponential of every score, then normalizes them by dividing by the sum of all the exponentials."},
  {id:"lec8_07",lecture:"Lecture 8",topic:"Softmax Function",type:"mc",label:"Multiple Choice",
   q:"How does Softmax Regression make its prediction?",
   opts:["It predicts the class with the highest raw feature value","It predicts the class with the highest estimated probability, which is the class with the highest score","It predicts the class with probability above 50%","It takes a majority vote across all binary classifiers"],
   ans:1,exp:"Softmax Regression predicts the class with the highest estimated probability — which is simply the class with the highest score sₖ(x). The argmax over k of σ(s(x))ₖ equals the argmax over k of sₖ(x)."},
  {id:"lec8_08",lecture:"Lecture 8",topic:"Softmax Function",type:"eq",label:"Equation",
   q:"What is the Softmax Regression prediction rule?",
   opts:["ŷ = argmax_k σ(s(x))ₖ = argmax_k sₖ(x)","ŷ = argmin_k sₖ(x)","ŷ = Σ_k k × p̂ₖ","ŷ = 1 if p̂ ≥ 0.5 else 0"],
   ans:0,exp:"ŷ = argmax_k σ(s(x))ₖ = argmax_k sₖ(x) = argmax_k (θ⁽ᵏ⁾)ᵀx. Since softmax is monotonic, the class with the highest score always has the highest probability — so argmax on scores equals argmax on probabilities."},
  {id:"lec8_09",lecture:"Lecture 8",topic:"Softmax Regression Basics",type:"tf",label:"True / False",
   q:"True or False: Softmax Regression is multiclass but not multioutput — it predicts exactly one class at a time and should only be used with mutually exclusive classes.",
   opts:["True","False"],
   ans:0,exp:"True. Softmax Regression is multiclass (can predict one of K classes) but NOT multioutput (cannot predict multiple classes simultaneously). It should only be used when classes are mutually exclusive — e.g. different plant species, not recognizing multiple people in a photo."},
  {id:"lec8_10",lecture:"Lecture 8",topic:"Softmax Regression Basics",type:"mc",label:"Multiple Choice",
   q:"Why can't you use Softmax Regression to recognize multiple people in a single photo?",
   opts:["Softmax Regression can only handle two classes","Softmax Regression is multiclass but not multioutput — it predicts exactly one class at a time, requiring mutually exclusive classes","Softmax Regression requires more training data than is typically available for face recognition","Softmax Regression cannot handle image data"],
   ans:1,exp:"Softmax Regression predicts ONE class at a time. Recognizing multiple people requires predicting multiple labels simultaneously (multilabel classification). Softmax is only appropriate when classes are mutually exclusive — exactly one can be true."},
  {id:"lec8_11",lecture:"Lecture 8",topic:"Softmax Regression Basics",type:"ms",label:"Multi-Select",
   q:"Which of the following are true about the parameter structure of Softmax Regression? Select all that apply.",
   opts:["Each class k has its own dedicated parameter vector θ⁽ᵏ⁾","All parameter vectors are stored as rows in a parameter matrix Θ","There is one shared parameter vector for all classes","The score for class k is computed as sₖ(x) = (θ⁽ᵏ⁾)ᵀx","The parameter matrix Θ has one column per class"],
   ans:[0,1,3],exp:"Each class has its own θ⁽ᵏ⁾ (A), all stored as rows in matrix Θ (B), and sₖ(x) = (θ⁽ᵏ⁾)ᵀx (D). There is NOT one shared parameter vector (C is false). The matrix has one ROW per class, not one column per class (E is false)."},
  {id:"lec8_12",lecture:"Lecture 8",topic:"Cross-Entropy Cost",type:"mc",label:"Multiple Choice",
   q:"What cost function does Softmax Regression use?",
   opts:["Mean Squared Error (MSE)","Hinge loss","Cross-entropy (generalization of log loss to K classes)","Binary cross-entropy"],
   ans:2,exp:"Softmax Regression uses the cross-entropy cost function — a generalization of log loss (binary cross-entropy) to K classes. It penalizes the model when it estimates a low probability for the target class."},
  {id:"lec8_13",lecture:"Lecture 8",topic:"Cross-Entropy Cost",type:"eq",label:"Equation",
   q:"What is the cross-entropy cost function for Softmax Regression?",
   opts:["J(Θ) = −(1/m) Σᵢ Σₖ yₖ⁽ⁱ⁾ log(p̂ₖ⁽ⁱ⁾)","J(Θ) = (1/m) Σᵢ (p̂⁽ⁱ⁾ − y⁽ⁱ⁾)²","J(Θ) = −(1/m) Σᵢ [y⁽ⁱ⁾ log(p̂⁽ⁱ⁾) + (1−y⁽ⁱ⁾) log(1−p̂⁽ⁱ⁾)]","J(Θ) = Σᵢ max(0, 1 − yᵢ × p̂ᵢ)"],
   ans:0,exp:"The cross-entropy cost for Softmax is J(Θ) = −(1/m) Σᵢ Σₖ yₖ⁽ⁱ⁾ log(p̂ₖ⁽ⁱ⁾). The double sum runs over all instances and all classes. yₖ⁽ⁱ⁾ is 1 if instance i belongs to class k, otherwise 0. Option C is the binary cross-entropy (Logistic Regression)."},
  {id:"lec8_14",lecture:"Lecture 8",topic:"Cross-Entropy Cost",type:"mc",label:"Multiple Choice",
   q:"Why does cross-entropy penalize a model that estimates low probability for the target class?",
   opts:["Because low probabilities lead to high MSE","Because −log(p̂ₖ) grows very large as p̂ₖ approaches 0, so predicting near-zero probability for the true class incurs a huge cost","Because the cost function squares the probabilities","Because cross-entropy multiplies probabilities together"],
   ans:1,exp:"The cost for predicting class k is −log(p̂ₖ). As p̂ₖ → 0, −log(p̂ₖ) → ∞. So if the model assigns very low probability to the correct class, the cost becomes enormous. This forces the model to estimate high probability for the target class."},
  {id:"lec8_15",lecture:"Lecture 8",topic:"Cross-Entropy Cost",type:"mc",label:"Multiple Choice",
   q:"What optimization algorithm is used to train Softmax Regression?",
   opts:["The Normal Equation (closed-form)","Gradient Descent (or another optimization algorithm) — there is no closed-form solution","K-fold cross-validation","The Simplex method"],
   ans:1,exp:"Like Logistic Regression, Softmax Regression is trained using Gradient Descent (or another optimization algorithm). The gradient of the cost function can be computed, then GD minimizes it. There is no closed-form solution equivalent to the Normal Equation."},
  {id:"lec8_16",lecture:"Lecture 8",topic:"Cross-Entropy Information Theory",type:"mc",label:"Multiple Choice",
   q:"What does cross-entropy measure from an information theory perspective?",
   opts:["The squared difference between two probability distributions","The average number of bits actually sent per option when using the model's predicted distribution to encode the true distribution","The total number of training instances misclassified","The Euclidean distance between predicted and true probability vectors"],
   ans:1,exp:"From information theory: cross-entropy measures the average number of bits you need to send per option when you use the model's assumed distribution to encode options from the true distribution. If your assumptions are perfect, cross-entropy equals the entropy. If wrong, cross-entropy is higher by the KL divergence."},
  {id:"lec8_17",lecture:"Lecture 8",topic:"Cross-Entropy Information Theory",type:"mc",label:"Multiple Choice",
   q:"What is KL divergence in the context of cross-entropy?",
   opts:["The total cost of all misclassifications","The extra amount of cross-entropy beyond the true entropy — measuring how wrong the model's distributional assumptions are","The variance of the predicted probability distribution","The difference between training and validation loss"],
   ans:1,exp:"KL (Kullback-Leibler) divergence is the extra cost beyond the true entropy — it measures how wrong your assumptions are. If your model perfectly captures the true distribution, KL divergence = 0 and cross-entropy = entropy."},
  {id:"lec8_18",lecture:"Lecture 8",topic:"Softmax Function",type:"ms",label:"Multi-Select",
   q:"Which of the following are true about the softmax function? Select all that apply.",
   opts:["It outputs values between 0 and 1 for each class","All class probabilities sum to 1","It takes the exponential of each score then normalizes","It is also called the normalized exponential","It is the inverse of the sigmoid function"],
   ans:[0,1,2,3],exp:"Softmax outputs values between 0 and 1 (A), they sum to 1 (B), it exponentiates then normalizes (C), and is also called the normalized exponential (D). The sigmoid function's inverse is the logit function — not the softmax (E is false)."},
  {id:"lec8_19",lecture:"Lecture 8",topic:"Softmax Regression Basics",type:"mc",label:"Multiple Choice",
   q:"According to your slides, what is true about the decision boundaries of Softmax Regression?",
   opts:["Decision boundaries are curved","Decision boundaries between any two classes are linear","There is only one decision boundary for all K classes","Decision boundaries are computed using the kernel trick"],
   ans:1,exp:"Your slides explicitly state: 'the decision boundaries between any two classes are linear.' Even though Softmax handles K classes, each pairwise boundary is a straight line (or hyperplane in higher dimensions)."},
  {id:"lec8_20",lecture:"Lecture 8",topic:"Softmax Regression Basics",type:"tf",label:"True / False",
   q:"True or False: A Softmax Regression model can predict a class with an estimated probability below 50%.",
   opts:["True","False"],
   ans:0,exp:"True. Softmax picks the class with the highest probability. If there are 3 classes and probabilities are 40%, 35%, 25%, the model predicts the first class even though its probability is below 50%. Your slides give the example of all three classes having 33% probability at the intersection of decision boundaries."},
  {id:"lec8_21",lecture:"Lecture 8",topic:"Cross-Entropy Cost",type:"ms",label:"Multi-Select",
   q:"In the cross-entropy cost function J(Θ) = −(1/m) Σᵢ Σₖ yₖ⁽ⁱ⁾ log(p̂ₖ⁽ⁱ⁾), what do the following terms represent? Select all that apply.",
   opts:["m = number of training instances","K = number of classes","yₖ⁽ⁱ⁾ = 1 if instance i belongs to class k, 0 otherwise (one-hot)","p̂ₖ⁽ⁱ⁾ = the predicted probability that instance i belongs to class k","Σᵢ sums over classes, Σₖ sums over instances"],
   ans:[0,1,2,3],exp:"m = instances (A), K = classes (B), yₖ⁽ⁱ⁾ is the one-hot label (C), p̂ₖ⁽ⁱ⁾ is the predicted probability (D). Option E has the sums reversed — Σᵢ sums over instances and Σₖ sums over classes, not the other way around."},
  {id:"lec8_22",lecture:"Lecture 8",topic:"Softmax Regression Basics",type:"mc",label:"Multiple Choice",
   q:"In the Iris classification example in your slides, what solver does Scikit-Learn require to use Softmax Regression (Multinomial Logistic Regression)?",
   opts:["The 'lbfgs' solver","The 'sgd' solver","The 'liblinear' solver","The 'adam' solver"],
   ans:0,exp:"Your slides show that for Softmax Regression, you set multi_class='multinomial' and must use a solver that supports it, such as the 'lbfgs' solver. The slides also note that it applies ℓ2 regularization by default (controlled by hyperparameter C)."},
  {id:"lec8_23",lecture:"Lecture 8",topic:"Softmax Regression Basics",type:"ms",label:"Multi-Select",
   q:"Which of the following correctly distinguish Softmax Regression from Logistic Regression? Select all that apply.",
   opts:["Softmax supports multiple classes directly without binary classifiers","Logistic Regression is binary; Softmax is multiclass","Softmax computes one score per class; Logistic computes one score total","Both use cross-entropy as their cost function","Softmax requires one parameter vector per class; Logistic uses one"],
   ans:[0,1,2,3,4],exp:"All five are correct. Softmax handles K classes directly (A). Logistic is binary, Softmax is multiclass (B). Softmax computes K scores (C). Both use cross-entropy — binary cross-entropy for Logistic, multiclass for Softmax (D). Softmax needs K parameter vectors (E)."},
  {id:"lec8_24",lecture:"Lecture 8",topic:"Cross-Entropy Cost",type:"tf",label:"True / False",
   q:"True or False: The cross-entropy cost function for Softmax Regression reduces to the binary cross-entropy (log loss) when K=2.",
   opts:["True","False"],
   ans:0,exp:"True. When K=2, the cross-entropy J(Θ) = −(1/m) Σᵢ Σₖ yₖ⁽ⁱ⁾ log(p̂ₖ⁽ⁱ⁾) reduces to the binary cross-entropy (log loss) used in Logistic Regression: −(1/m) Σ [y log(p̂) + (1−y) log(1−p̂)]. Softmax is a true generalization of Logistic Regression."},
  {id:"lec9_01",lecture:"Lecture 9",topic:"Large Margin Classification",type:"mc",label:"Multiple Choice",
   q:"What is the key idea behind large margin classification in SVMs?",
   opts:["Minimizing the number of features used","Fitting the widest possible 'street' between classes, keeping the decision boundary as far as possible from the closest training instances","Maximizing the number of support vectors","Minimizing the training error to zero"],
   ans:1,exp:"An SVM finds the widest possible 'street' (margin) between classes. The decision boundary is not just any separating line — it stays as far away from the closest training instances as possible, maximizing the margin width."},
  {id:"lec9_02",lecture:"Lecture 9",topic:"Large Margin Classification",type:"mc",label:"Multiple Choice",
   q:"What are support vectors?",
   opts:["All training instances used to train the SVM","The instances located on the edge of the margin (street) — the decision boundary is fully determined by them","The feature vectors after applying the kernel transformation","The weights w and bias b that define the decision boundary"],
   ans:1,exp:"Support vectors are the training instances that sit on the edge of the margin. The decision boundary is entirely determined by these instances — adding more instances 'off the street' has no effect on it. This is why the method is called Support Vector Machines."},
  {id:"lec9_03",lecture:"Lecture 9",topic:"Large Margin Classification",type:"mc",label:"Multiple Choice",
   q:"What is the decision boundary equation for a linear SVM?",
   opts:["wᵀx + b = 1","wᵀx + b = 0","‖w‖ = 0","xᵀθ = 0.5"],
   ans:1,exp:"The decision boundary is wᵀx + b = 0. The margins (where support vectors lie) are at wᵀx + b = +1 and wᵀx + b = −1. The distance from each margin to the decision boundary is 1/‖w‖."},
  {id:"lec9_04",lecture:"Lecture 9",topic:"Large Margin Classification",type:"mc",label:"Multiple Choice",
   q:"To maximize the SVM margin, what must be minimized?",
   opts:["The bias term b","The norm of the weight vector ‖w‖","The number of training instances","The learning rate η"],
   ans:1,exp:"The distance from the decision boundary to each margin is 1/‖w‖. To make this distance large (wide margin), we minimize ‖w‖. Your slides show: 'So we want to minimize ‖w‖ to get a large margin.'"},
  {id:"lec9_05",lecture:"Lecture 9",topic:"Large Margin Classification",type:"tf",label:"True / False",
   q:"True or False: SVMs are sensitive to feature scaling — features should be scaled before training an SVM.",
   opts:["True","False"],
   ans:0,exp:"True. SVMs are sensitive to feature scales. If features have very different scales, the widest possible street tends to be nearly parallel to the feature with the largest scale, ignoring other features. Feature scaling (e.g. using StandardScaler) fixes this."},
  {id:"lec9_06",lecture:"Lecture 9",topic:"Hard vs Soft Margin",type:"mc",label:"Multiple Choice",
   q:"What is hard margin classification?",
   opts:["A soft margin with a very large C value","Strictly imposing that all instances must be on the correct side of the margin with no violations allowed","Using no regularization in the SVM objective","Training the SVM on only the support vectors"],
   ans:1,exp:"Hard margin classification strictly requires that ALL instances be off the street and on the right side — no margin violations are allowed. This only works if the data is linearly separable and is very sensitive to outliers."},
  {id:"lec9_07",lecture:"Lecture 9",topic:"Hard vs Soft Margin",type:"ms",label:"Multi-Select",
   q:"What are the two main problems with hard margin classification? Select all that apply.",
   opts:["It only works if the data is linearly separable","It is computationally too expensive","It is very sensitive to outliers","It requires too many support vectors","It cannot handle high-dimensional data"],
   ans:[0,2],exp:"Your slides state exactly two issues with hard margin: (1) it only works if the data is linearly separable, and (2) it is very sensitive to outliers. These are the reasons soft margin was developed."},
  {id:"lec9_08",lecture:"Lecture 9",topic:"Hard vs Soft Margin",type:"mc",label:"Multiple Choice",
   q:"What is soft margin classification?",
   opts:["An SVM that always misclassifies some training instances","A flexible model that balances keeping the margin as wide as possible while limiting margin violations","An SVM trained without a bias term","An SVM that uses the kernel trick instead of a margin"],
   ans:1,exp:"Soft margin classification finds a good balance between keeping the street (margin) as wide as possible and limiting margin violations (instances on the wrong side or inside the margin). The hyperparameter C controls this trade-off."},
  {id:"lec9_09",lecture:"Lecture 9",topic:"Hard vs Soft Margin",type:"mc",label:"Multiple Choice",
   q:"In a soft margin SVM, what does a SMALL value of C produce?",
   opts:["A narrower margin with fewer violations","A wider margin with more violations allowed — more regularization","A model that always classifies perfectly","A model that converges faster"],
   ans:1,exp:"Small C = wider margin + more margin violations allowed = more regularization (constrains the model more). Large C = narrower margin + fewer violations = less regularization (allows a more complex boundary, higher overfitting risk). If overfitting, reduce C."},
  {id:"lec9_10",lecture:"Lecture 9",topic:"Hard vs Soft Margin",type:"mc",label:"Multiple Choice",
   q:"What is the slack variable ζ (zeta) in the soft margin SVM objective?",
   opts:["The learning rate for gradient descent","A variable that measures how much each instance is allowed to violate the margin","The regularization strength (equivalent to α in Ridge Regression)","The width of the margin"],
   ans:1,exp:"The slack variable ζ ≥ 0 is introduced for each instance in the soft margin formulation. It measures how much that particular instance is allowed to violate the margin. C controls the trade-off between minimizing ‖w‖ and reducing margin violations (via ζ)."},
  {id:"lec9_11",lecture:"Lecture 9",topic:"Hard vs Soft Margin",type:"tf",label:"True / False",
   q:"True or False: If your SVM model is overfitting, you should try increasing the C hyperparameter.",
   opts:["True","False"],
   ans:1,exp:"False. Your slides explicitly say: 'If your SVM model is overfitting, you can try regularizing it by reducing C.' Smaller C allows more margin violations but produces a wider, simpler boundary that generalizes better."},
  {id:"lec9_12",lecture:"Lecture 9",topic:"Kernel Trick",type:"mc",label:"Multiple Choice",
   q:"What is the kernel trick?",
   opts:["A method to reduce the number of support vectors","A mathematical technique that allows computing dot products in a transformed feature space without actually performing the transformation","A way to convert a multiclass problem into binary problems","A technique to speed up Gradient Descent in SVMs"],
   ans:1,exp:"The kernel trick allows you to get the same result as if you had transformed training data into a higher-dimensional space, without actually doing the transformation. A kernel function K(a,b) computes φ(a)ᵀφ(b) directly from original vectors a and b."},
  {id:"lec9_13",lecture:"Lecture 9",topic:"Kernel Trick",type:"mc",label:"Multiple Choice",
   q:"What is a kernel function?",
   opts:["A function that maps classes to decision boundaries","A function capable of computing the dot product of transformed vectors φ(a)ᵀφ(b) based only on the original vectors a and b, without computing the transformation φ","A function that measures the distance between support vectors","A function that initializes the SVM weights"],
   ans:1,exp:"A kernel function K(a,b) = φ(a)ᵀφ(b) computes the dot product of transformed vectors based only on the original vectors a and b — without ever computing (or needing to know) the transformation φ. This is the mathematical magic that makes the kernel trick possible."},
  {id:"lec9_14",lecture:"Lecture 9",topic:"Kernel Trick",type:"eq",label:"Equation",
   q:"What is the polynomial kernel?",
   opts:["K(a,b) = (γaᵀb + r)^d","K(a,b) = exp(−γ‖a−b‖²)","K(a,b) = aᵀb","K(a,b) = tanh(γaᵀb + r)"],
   ans:0,exp:"The polynomial kernel is K(a,b) = (γaᵀb + r)^d. The hyperparameter d is the degree. The hyperparameter coef0 (r) controls how much the model is influenced by high-degree vs. low-degree polynomials. Option B is the Gaussian RBF kernel."},
  {id:"lec9_15",lecture:"Lecture 9",topic:"Kernel Trick",type:"eq",label:"Equation",
   q:"What is the Gaussian RBF kernel?",
   opts:["K(a,b) = (γaᵀb + r)^d","K(a,b) = exp(−γ‖a−b‖²)","K(a,b) = aᵀb","K(a,b) = 1 / (1 + ‖a−b‖²)"],
   ans:1,exp:"The Gaussian RBF (Radial Basis Function) kernel is K(a,b) = exp(−γ‖a−b‖²). γ (gamma) acts like a regularization hyperparameter: high γ = narrow bell curve = each instance has a smaller range of influence = more complex, potentially overfitting boundary. Low γ = smoother boundary."},
  {id:"lec9_16",lecture:"Lecture 9",topic:"Kernel Trick",type:"mc",label:"Multiple Choice",
   q:"In the Gaussian RBF kernel, what does a HIGH value of γ produce?",
   opts:["A smoother, wider decision boundary — lower risk of overfitting","A more irregular, complex decision boundary that wiggles around individual instances — higher risk of overfitting","A faster convergence during training","A linear decision boundary"],
   ans:1,exp:"High γ makes the bell-shaped curve narrower, so each instance's range of influence is smaller. The decision boundary ends up more irregular, wiggling around individual instances. This is like high complexity — higher overfitting risk. If overfitting, reduce γ. If underfitting, increase γ."},
  {id:"lec9_17",lecture:"Lecture 9",topic:"Kernel Trick",type:"ms",label:"Multi-Select",
   q:"Which of the following kernel formulas are listed in your slides? Select all that apply.",
   opts:["Linear: K(a,b) = aᵀb","Polynomial: K(a,b) = (γaᵀb + r)^d","Gaussian RBF: K(a,b) = exp(−γ‖a−b‖²)","Sigmoid: K(a,b) = tanh(γaᵀb + r)","Hinge: K(a,b) = max(0, 1 − aᵀb)"],
   ans:[0,1,2,3],exp:"Your slides list four kernels: Linear K(a,b) = aᵀb (A), Polynomial K(a,b) = (γaᵀb + r)^d (B), Gaussian RBF K(a,b) = exp(−γ‖a−b‖²) (C), and Sigmoid K(a,b) = tanh(γaᵀb + r) (D). Hinge (E) is a loss function, not a kernel."},
  {id:"lec9_18",lecture:"Lecture 9",topic:"Kernel Selection",type:"mc",label:"Multiple Choice",
   q:"According to your slides, what kernel should you always try first?",
   opts:["The Gaussian RBF kernel, because it works well in most cases","The polynomial kernel, because it handles the most cases","The linear kernel, especially if the training set is very large or has many features","The sigmoid kernel, because it is the most flexible"],
   ans:2,exp:"Your slides say: 'As a rule of thumb, you should always try the linear kernel first, especially if the training set is very large or if it has plenty of features.' After that, try the Gaussian RBF kernel, which works well in most cases."},
  {id:"lec9_19",lecture:"Lecture 9",topic:"Dual Problem",type:"mc",label:"Multiple Choice",
   q:"Why is the dual problem important for SVMs?",
   opts:["It is easier to implement than the primal problem","The dual problem makes the kernel trick possible — the primal problem does not","It always produces a better solution than the primal problem","It requires fewer hyperparameters to tune"],
   ans:1,exp:"Your slides state: 'Dual problem makes the kernel trick possible, while primal does not.' The dual formulation expresses the optimization in terms of dot products of training instances, which can then be replaced by kernel function evaluations — enabling the kernel trick."},
  {id:"lec9_20",lecture:"Lecture 9",topic:"Dual Problem",type:"tf",label:"True / False",
   q:"True or False: The primal problem formulation of SVMs supports the kernel trick.",
   opts:["True","False"],
   ans:1,exp:"False. The primal problem does NOT support the kernel trick. Only the dual problem formulation allows the kernel trick. This is because the dual problem expresses the solution in terms of dot products of training instances, which can be replaced by kernel evaluations."},
  {id:"lec9_21",lecture:"Lecture 9",topic:"SVM Complexity",type:"mc",label:"Multiple Choice",
   q:"What is the main difference between LinearSVC and SVC in Scikit-Learn?",
   opts:["LinearSVC uses the polynomial kernel; SVC uses the RBF kernel","LinearSVC does not support the kernel trick and scales almost linearly with instances/features; SVC supports the kernel trick but gets very slow on large datasets","LinearSVC is only for regression; SVC is only for classification","They are identical but LinearSVC is faster to initialize"],
   ans:1,exp:"LinearSVC (liblinear): no kernel trick, scales almost linearly with instances and features — good for large datasets. SVC (libsvm): supports the kernel trick but gets very slow when there are many instances (e.g. hundreds of thousands). SVC is best for complex small/medium datasets."},
  {id:"lec9_22",lecture:"Lecture 9",topic:"SVM Complexity",type:"ms",label:"Multi-Select",
   q:"Which of the following are true about LinearSVC? Select all that apply.",
   opts:["It is based on the liblinear library","It does not support the kernel trick","It scales almost linearly with the number of training instances and features","It is ideal for complex small or medium-sized training sets","It is faster than SVC on very large datasets"],
   ans:[0,1,2,4],exp:"LinearSVC is based on liblinear (A), does not support kernel trick (B), scales almost linearly with instances and features (C), and is faster on large datasets (E). It is NOT ideal for complex small/medium sets — that's SVC with kernel trick (D is false — that describes SVC)."},
  {id:"lec9_23",lecture:"Lecture 9",topic:"SVM Regression",type:"mc",label:"Multiple Choice",
   q:"How does SVM Regression differ from SVM Classification in its objective?",

const LETTERS=['A','B','C','D','E','F','G','H','I','J'];
function getMissed(){try{return JSON.parse(localStorage.getItem('ml_missed_questions')||'{}');}catch{return{};}}
function saveMissed(d){localStorage.setItem('ml_missed_questions',JSON.stringify(d));}
function getMissedCount(){return Object.keys(getMissed()).length;}
function recordMiss(q){const m=getMissed(),s=JSON.parse(localStorage.getItem('ml_streak_data')||'{}');m[q.id]={id:q.id,lecture:q.lecture,topic:q.topic};s[q.id]=0;saveMissed(m);localStorage.setItem('ml_streak_data',JSON.stringify(s));}
function getSeen(key){try{return JSON.parse(localStorage.getItem(key)||'[]');}catch{return[];}}
function saveSeen(key,arr){localStorage.setItem(key,JSON.stringify(arr));}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function shuffleOpts(q){if(q.type==='tf')return{opts:q.opts,ans:q.ans};const idxs=shuffle(q.opts.map((_,i)=>i));const map={};idxs.forEach((old,n)=>{map[old]=n;});return{opts:idxs.map(i=>q.opts[i]),ans:Array.isArray(q.ans)?q.ans.map(i=>map[i]):map[q.ans]};}
const TOTAL=ALL_QUESTIONS.length;const ROUND_SIZE=20;
function getUnseenPool(){const seen=new Set(getSeen(SEEN_KEY));return ALL_QUESTIONS.map(q=>q.id).filter(id=>!seen.has(id));}
function pickRound(){
  let pool=getUnseenPool();
  if(pool.length<=ROUND_SIZE){
    const picked=shuffle(pool);saveSeen(SEEN_KEY,[]);
    if(picked.length<ROUND_SIZE){const extras=shuffle(ALL_QUESTIONS.map(q=>q.id).filter(id=>!picked.includes(id)));picked.push(...extras.slice(0,ROUND_SIZE-picked.length));}
    saveSeen(SEEN_KEY,picked);return picked.map(id=>ALL_QUESTIONS.find(q=>q.id===id)).filter(Boolean);
  }else{const picked=shuffle(pool).slice(0,ROUND_SIZE);const seen=getSeen(SEEN_KEY);saveSeen(SEEN_KEY,[...seen,...picked]);return picked.map(id=>ALL_QUESTIONS.find(q=>q.id===id)).filter(Boolean);}
}
let deck=[],idx=0,score=0,answered=0,selectedMulti=new Set(),currentAns=null;
function updateSeenBar(){const seen=getSeen(SEEN_KEY).length;document.getElementById('seenProgress').textContent=Math.min(seen,TOTAL)+' / '+TOTAL;}
function init(){deck=pickRound();idx=0;score=0;answered=0;updateSeenBar();renderQ();}
function renderQ(){
  const q=deck[idx];selectedMulti=new Set();
  document.getElementById('metaLecture').textContent=q.lecture;document.getElementById('metaTopic').textContent=q.topic;
  document.getElementById('qTypeBadge').textContent=q.label;document.getElementById('qHint').style.display=q.type==='ms'?'block':'none';
  document.getElementById('qText').textContent=q.q;
  const eqEl=document.getElementById('qEquation');if(q.equation){eqEl.textContent=q.equation;eqEl.style.display='block';}else{eqEl.style.display='none';}
  document.getElementById('explanation').classList.remove('show');document.getElementById('explanation').textContent='';
  document.getElementById('missedNotice').classList.remove('show');document.getElementById('btnNext').classList.remove('show');document.getElementById('btnSubmit').classList.remove('show');
  const{opts,ans}=shuffleOpts(q);currentAns=ans;
  const div=document.getElementById('optionsDiv');div.innerHTML='';
  opts.forEach((o,i)=>{
    const el=document.createElement('div');el.className='opt';
    const ind=document.createElement('span');ind.className='opt-indicator';ind.textContent=q.type==='ms'?'☐':LETTERS[i];
    if(q.optEquations&&q.optEquations[i]){
      const txt=document.createElement('div');txt.style.display='flex';txt.style.flexDirection='column';txt.style.gap='4px';
      const label=document.createElement('span');label.className='opt-text';label.textContent=o;
      txt.appendChild(label);
      el.appendChild(ind);el.appendChild(txt);
    }else{
      const txt=document.createElement('span');txt.className='opt-text';txt.textContent=o;
      el.appendChild(ind);el.appendChild(txt);
    }
    if(q.type==='ms'){el.onclick=()=>{if(el.classList.contains('disabled'))return;if(selectedMulti.has(i)){selectedMulti.delete(i);el.classList.remove('selected');ind.textContent='☐';}else{selectedMulti.add(i);el.classList.add('selected');ind.textContent='☑';}document.getElementById('btnSubmit').classList.toggle('show',selectedMulti.size>0);};}
    else{el.onclick=()=>resolveSingle(i);}
    div.appendChild(el);
  });
  document.getElementById('qCounter').textContent='Question '+(idx+1)+' of '+deck.length;
  document.getElementById('progressFill').style.width=Math.round((idx/deck.length)*100)+'%';
  document.getElementById('scoreDisplay').textContent=score+' / '+answered;
}
function resolveSingle(chosen){
  const correct=chosen===currentAns;const opts=document.getElementById('optionsDiv').children;
  for(let i=0;i<opts.length;i++){opts[i].classList.add('disabled');opts[i].onclick=null;const ind=opts[i].querySelector('.opt-indicator');if(i===currentAns){opts[i].classList.add(correct&&i===chosen?'correct':'reveal-correct');ind.textContent='✓';}else if(i===chosen){opts[i].classList.add('wrong');ind.textContent='✗';}}
  finalize(correct);
}
function submitMulti(){
  const correctSet=new Set(Array.isArray(currentAns)?currentAns:[currentAns]);const correct=selectedMulti.size===correctSet.size&&[...selectedMulti].every(i=>correctSet.has(i));
  const opts=document.getElementById('optionsDiv').children;
  for(let i=0;i<opts.length;i++){opts[i].classList.add('disabled');opts[i].onclick=null;const ind=opts[i].querySelector('.opt-indicator');if(correctSet.has(i)&&selectedMulti.has(i)){opts[i].classList.add('correct');ind.textContent='✓';}else if(!correctSet.has(i)&&selectedMulti.has(i)){opts[i].classList.add('wrong');ind.textContent='✗';}else if(correctSet.has(i)&&!selectedMulti.has(i)){opts[i].classList.add('reveal-correct');ind.textContent='✓';}}
  document.getElementById('btnSubmit').classList.remove('show');finalize(correct);
}
function finalize(correct){
  if(correct){score++;}else{recordMiss(deck[idx]);document.getElementById('missedNotice').classList.add('show');}
  answered++;document.getElementById('scoreDisplay').textContent=score+' / '+answered;
  const exp=document.getElementById('explanation');exp.textContent=(correct?'✓ Correct. ':'✗ Incorrect. ')+deck[idx].exp;exp.classList.add('show');document.getElementById('btnNext').classList.add('show');
}
function nextQ(){idx++;if(idx>=deck.length)showSummary();else renderQ();}
function showSummary(){
  document.getElementById('questionCard').style.display='none';document.getElementById('btnNext').style.display='none';document.getElementById('qCounter').style.display='none';document.getElementById('progressFill').style.width='100%';
  const pct=Math.round((score/deck.length)*100);document.getElementById('summaryScore').textContent=pct+'%';document.getElementById('summaryFrac').textContent=score+' out of '+deck.length+' correct';
  document.getElementById('summaryMsg').textContent=pct>=85?'Strong round — keep going!':pct>=65?'Good effort. Review your misses, then do another round.':'Keep drilling — do the missed deck, then come back for another round.';
  const seen=Math.min(getSeen(SEEN_KEY).length,TOTAL);document.getElementById('summarySeen').textContent='You have now seen '+seen+' of '+TOTAL+' total questions in this deck.';
  const mc=getMissedCount();if(mc>0){document.getElementById('summaryMissedBox').style.display='block';document.getElementById('summaryMissedBox').textContent=mc+' question'+(mc!==1?'s':'')+' in your missed deck.';document.getElementById('linkMissed').style.display='inline-block';}
  document.getElementById('summary').classList.add('show');
}
function newRound(){
  idx=0;score=0;answered=0;deck=pickRound();
  document.getElementById('questionCard').style.display='block';document.getElementById('btnNext').style.display='';document.getElementById('btnNext').classList.remove('show');document.getElementById('qCounter').style.display='block';
  document.getElementById('summary').classList.remove('show');document.getElementById('summaryMissedBox').style.display='none';document.getElementById('linkMissed').style.display='none';
  updateSeenBar();renderQ();
}
init();

</script>
