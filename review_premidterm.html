<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pre-Midterm Review</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{--bg:#f5f4f0;--surface:#ffffff;--surface2:#f0eeea;--border:#e2dfd8;--text:#1a1916;--muted:#8a8680;--accent:#5046e4;--accent-dim:rgba(80,70,228,0.08);--accent-border:rgba(80,70,228,0.2);--orange:#d97706;--orange-bg:#fff7ed;--orange-border:#fed7aa;--green:#16a34a;--green-bg:#f0fdf4;--green-border:#86efac;--red:#dc2626;--red-bg:#fef2f2;--red-border:#fca5a5;--purple:#7c3aed;--purple-bg:#f5f3ff;--purple-border:#ddd6fe;--reveal-bg:#fafaf9;--yellow-bg:#fefce8;--yellow-border:#fde68a;}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;}
  header{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.5rem;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0;}
  .header-left{display:flex;align-items:center;gap:1rem;}
  .back-link{font-size:13px;color:var(--muted);text-decoration:none;padding:5px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);}
  .back-link:hover{border-color:var(--accent);color:var(--accent);}
  .header-title{font-family:'DM Serif Display',serif;font-size:20px;color:var(--text);}
  .header-badge{font-size:11px;font-weight:600;letter-spacing:0.06em;padding:3px 10px;border-radius:99px;background:var(--accent-dim);color:var(--accent);border:1px solid var(--accent-border);}
  .score-display{font-size:13px;color:var(--muted);}
  .progress-wrap{height:3px;background:var(--border);}
  .progress-fill{height:100%;background:var(--accent);width:0%;transition:width 0.3s;}
  main{max-width:680px;margin:0 auto;padding:2rem 1.5rem;width:100%;display:flex;flex-direction:column;flex:1;}
  .seen-bar{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:1rem;}
  .seen-progress{font-weight:600;color:var(--purple);}
  .q-counter{font-size:13px;color:var(--muted);margin-bottom:1rem;}
  .question-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:1.75rem;display:flex;flex-direction:column;gap:1rem;}
  .meta-row{display:flex;gap:8px;flex-wrap:wrap;}
  .meta-tag{font-size:11px;font-weight:600;letter-spacing:0.06em;padding:2px 9px;border-radius:99px;}
  .meta-lecture{background:var(--accent-dim);color:var(--accent);border:1px solid var(--accent-border);}
  .meta-topic{background:var(--surface2);color:var(--muted);border:1px solid var(--border);}
  .q-type-badge{font-size:11px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);}
  .q-hint{font-size:13px;color:var(--accent);font-weight:500;display:none;}
  .q-text{font-size:16px;color:var(--text);line-height:1.65;font-weight:500;}
  .q-equation{display:none;background:var(--yellow-bg);border:1px solid var(--yellow-border);border-radius:8px;padding:14px 18px;font-size:16px;font-family:'Georgia',serif;text-align:center;line-height:1.8;color:var(--text);}
  .options{display:flex;flex-direction:column;gap:8px;}
  .opt{display:flex;align-items:flex-start;gap:12px;padding:11px 14px;border:1.5px solid var(--border);border-radius:10px;cursor:pointer;transition:border-color 0.12s,background 0.12s;}
  .opt:hover{border-color:var(--accent);background:var(--accent-dim);}
  .opt.selected{border-color:var(--accent);background:var(--accent-dim);}
  .opt-indicator{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0;background:var(--surface);color:var(--muted);}
  .opt-text{font-size:15px;color:var(--text);line-height:1.5;}
  .opt-equation{display:block;background:var(--yellow-bg);border:1px solid var(--yellow-border);border-radius:6px;padding:8px 12px;font-size:14px;font-family:'Georgia',serif;text-align:center;line-height:1.8;color:var(--text);margin-top:4px;}
  .opt.correct{border-color:var(--green-border);background:var(--green-bg);}
  .opt.correct .opt-indicator{background:var(--green);color:#fff;border-color:var(--green);}
  .opt.wrong{border-color:var(--red-border);background:var(--red-bg);}
  .opt.wrong .opt-indicator{background:var(--red);color:#fff;border-color:var(--red);}
  .opt.reveal-correct{border-color:var(--green-border);background:var(--green-bg);}
  .opt.reveal-correct .opt-indicator{background:var(--green);color:#fff;border-color:var(--green);}
  .opt.disabled{cursor:default;}
  .btn-submit{display:none;margin-top:1rem;background:var(--accent);color:#fff;border:none;padding:10px 24px;border-radius:10px;font-size:14px;font-family:'DM Sans',sans-serif;font-weight:500;cursor:pointer;}
  .btn-submit.show{display:block;}
  .explanation{display:none;margin-top:1.25rem;padding:14px 16px;border-radius:10px;background:var(--reveal-bg);border-left:3px solid var(--purple);font-size:14px;color:var(--muted);line-height:1.7;}
  .explanation.show{display:block;}
  .missed-notice{display:none;margin-top:10px;padding:10px 14px;border-radius:8px;background:var(--orange-bg);border:1px solid var(--orange-border);font-size:13px;color:var(--orange);font-weight:500;}
  .missed-notice.show{display:block;}
  .btn-next{display:none;margin-top:1.5rem;align-self:flex-end;background:var(--purple);color:#fff;border:none;padding:11px 28px;border-radius:10px;font-size:15px;font-family:'DM Sans',sans-serif;font-weight:500;cursor:pointer;}
  .btn-next.show{display:block;}
  .summary{display:none;flex-direction:column;align-items:center;text-align:center;padding:3rem 2rem;width:100%;}
  .summary.show{display:flex;}
  .summary-score{font-family:'DM Serif Display',serif;font-size:72px;color:var(--purple);line-height:1;margin-bottom:0.5rem;}
  .summary-label{font-size:14px;color:var(--muted);margin-bottom:0.25rem;}
  .summary-msg{font-size:17px;color:var(--text);margin:1.25rem 0 0.75rem;line-height:1.6;max-width:420px;}
  .summary-seen{font-size:14px;color:var(--purple);background:var(--purple-bg);border:1px solid var(--purple-border);border-radius:10px;padding:10px 18px;margin-bottom:1.5rem;}
  .summary-missed-box{font-size:14px;color:var(--orange);background:var(--orange-bg);border:1px solid var(--orange-border);border-radius:10px;padding:10px 18px;margin-bottom:1.5rem;display:none;}
  .btn-group{display:flex;flex-direction:column;align-items:center;gap:10px;}
  .btn-new-round{background:var(--purple);color:#fff;border:none;padding:11px 28px;border-radius:10px;font-size:15px;font-family:'DM Sans',sans-serif;font-weight:500;cursor:pointer;}
  .link-missed{font-size:14px;color:var(--orange);text-decoration:none;padding:10px 24px;border:1px solid var(--orange-border);border-radius:10px;background:var(--orange-bg);display:none;}
  .link-home{font-size:14px;color:var(--muted);text-decoration:none;margin-top:0.25rem;}
</style>
</head>
<body>
<header>
  <div class="header-left">
    <a href="index.html" class="back-link">← Back</a>
    <span class="header-title">Pre-Midterm Review</span>
    <span class="header-badge">Lectures 2–9 · 20 questions per round</span>
  </div>
  <div class="score-display">Score: <span id="scoreDisplay">0 / 0</span></div>
</header>
<div class="progress-wrap"><div class="progress-fill" id="progressFill"></div></div>
<main>
  <div class="seen-bar">
    <span class="seen-label" id="seenLabel">Questions seen in this deck:</span>
    <span class="seen-progress" id="seenProgress"></span>
  </div>
  <div class="q-counter" id="qCounter">Question 1 of 20</div>
  <div class="question-card" id="questionCard">
    <div class="meta-row"><span class="meta-tag meta-lecture" id="metaLecture"></span><span class="meta-tag meta-topic" id="metaTopic"></span></div>
    <div class="q-type-badge" id="qTypeBadge"></div>
    <div class="q-hint" id="qHint">Select all that apply, then click Submit.</div>
    <p class="q-text" id="qText"></p>
    <div class="q-equation" id="qEquation"></div>
    <div class="options" id="optionsDiv"></div>
    <button class="btn-submit" id="btnSubmit" onclick="submitMulti()">Submit answer</button>
    <div class="explanation" id="explanation"></div>
    <div class="missed-notice" id="missedNotice">⚠ Added to your missed questions deck.</div>
  </div>
  <button class="btn-next" id="btnNext" onclick="nextQ()">Next question →</button>
  <div class="summary" id="summary">
    <div class="summary-label">Round complete</div>
    <div class="summary-score" id="summaryScore"></div>
    <div class="summary-label" id="summaryFrac"></div>
    <p class="summary-msg" id="summaryMsg"></p>
    <div class="summary-seen" id="summarySeen"></div>
    <div class="summary-missed-box" id="summaryMissedBox"></div>
    <div class="btn-group">
      <button class="btn-new-round" onclick="newRound()">Next round of 20 →</button>
      <a href="missed.html" class="link-missed" id="linkMissed">Review missed questions →</a>
      <a href="index.html" class="link-home">← Back</a>
    </div>
  </div>
</main>
<script>
const SEEN_KEY='ml_review_premidterm';
const ALL_QUESTIONS=[
  { id:"lec2_01", lecture:"Lecture 2", topic:"Types of ML", type:"mc", label:"Multiple Choice",
    q:"What is the defining characteristic of supervised learning?",
    opts:["The training data has no labels","The training data includes labeled examples with desired outputs","The model learns by receiving rewards and penalties","The model is trained on a small labeled set and large unlabeled set"],
    ans:1, exp:"In supervised learning, every training example comes with a label (the desired answer). This is what makes it 'supervised' — you are telling the algorithm what the correct output should be."},
  {id:"lec2_02", lecture:"Lecture 2", topic:"Types of ML", type:"ms", label:"Multi-Select",
    q:"Which of the following are supervised learning algorithms as listed in your slides? Select ALL that apply.",
    opts:["K-Means","Logistic Regression","k-Nearest Neighbors","Isolation Forest","Support Vector Machines (SVMs)","Decision Trees and Random Forests","PCA","Linear Regression"],
    ans:[1,2,4,5,7], exp:"Supervised algorithms from your slides: Linear Regression, Logistic Regression, k-Nearest Neighbors, SVMs, Decision Trees and Random Forests. K-Means (clustering), Isolation Forest (anomaly detection), and PCA (dimensionality reduction) are all unsupervised."},
  {id:"lec2_03", lecture:"Lecture 2", topic:"Types of ML", type:"ms", label:"Multi-Select",
    q:"Which of the following are unsupervised learning algorithms as listed in your slides? Select ALL that apply.",
    opts:["Linear Regression","K-Means","One-class SVM","Logistic Regression","Isolation Forest","PCA","Kernel PCA","Locally Linear Embedding (LLE)","t-SNE","Decision Trees"],
    ans:[1,2,4,5,6,7,8], exp:"Unsupervised algorithms from your slides — Clustering: K-Means. Anomaly detection: One-class SVM, Isolation Forest. Dimensionality reduction/visualization: PCA, Kernel PCA, LLE, t-SNE. Linear Regression, Logistic Regression, and Decision Trees are supervised."},
  {id:"lec2_02b", lecture:"Lecture 2", topic:"Types of ML", type:"tf", label:"True / False",
    q:"True or False: One-class SVM is a supervised learning algorithm used for classification.",
    opts:["True","False"],
    ans:1, exp:"False. One-class SVM is an unsupervised algorithm used for anomaly detection and novelty detection — it learns what 'normal' looks like and flags deviations, with no labeled data required."},
  {id:"lec2_03b", lecture:"Lecture 2", topic:"Types of ML", type:"tf", label:"True / False",
    q:"True or False: Random Forests are listed as a supervised learning algorithm in your slides.",
    opts:["True","False"],
    ans:0, exp:"True. Your slides list 'Decision Trees and Random Forests' together as supervised learning algorithms."},
  {id:"lec2_04", lecture:"Lecture 2", topic:"Types of ML", type:"mc", label:"Multiple Choice",
    q:"A company wants to group customers into segments based on purchasing behavior, with no predefined categories. What type of ML is this?",
    opts:["Supervised learning, because they have purchase data","Unsupervised learning, because there are no labels","Reinforcement learning, because the model improves over time","Semisupervised learning, because some customers are known"],
    ans:1, exp:"No predefined labels = unsupervised learning. The algorithm must discover the natural groupings on its own."},
  {id:"lec2_05", lecture:"Lecture 2", topic:"Types of ML", type:"tf", label:"True / False",
    q:"True or False: In semisupervised learning, you have plenty of labeled instances and very few unlabeled ones.",
    opts:["True","False"], ans:1,
    exp:"False. It's the opposite — semisupervised learning has plenty of UNLABELED instances and only a FEW labeled ones."},
  {id:"lec2_06", lecture:"Lecture 2", topic:"Types of ML", type:"mc", label:"Multiple Choice",
    q:"In reinforcement learning, what is a 'policy'?",
    opts:["The reward the agent receives for each action","The set of all possible actions the agent can take","The strategy defining what action the agent should take in a given situation","The environment the agent observes"],
    ans:2, exp:"A policy defines what action the agent should choose when it is in a given situation — it is the learned strategy for maximizing reward over time."},
  {id:"lec2_07", lecture:"Lecture 2", topic:"Batch vs Online", type:"mc", label:"Multiple Choice",
    q:"A system is trained once on all available data and then deployed. When new data arrives, the entire model must be retrained from scratch. What type of learning is this?",
    opts:["Online learning","Reinforcement learning","Batch learning","Instance-based learning"],
    ans:2, exp:"Batch learning trains on all available data at once and cannot learn incrementally. Updating it requires retraining on the full dataset from scratch."},
  {id:"lec2_08", lecture:"Lecture 2", topic:"Batch vs Online", type:"ms", label:"Multi-Select",
    q:"Which of the following are true about online learning? Select all that apply.",
    opts:["It trains the system incrementally","It requires the full dataset at every update","Data can be fed individually or in minibatches","Each learning step is fast and cheap","It cannot adapt to new data after deployment"],
    ans:[0,2,3], exp:"Online learning trains incrementally (not on the full dataset), accepts data individually or in minibatches, and each step is fast and cheap. It CAN adapt to new data on the fly — that's its main advantage."},
  {id:"lec2_09", lecture:"Lecture 2", topic:"Instance vs Model Based", type:"mc", label:"Multiple Choice",
    q:"A k-Nearest Neighbors classifier works by comparing a new instance to stored training examples using a similarity measure. What type of learning approach is this?",
    opts:["Model-based learning","Batch learning","Semisupervised learning","Instance-based learning"],
    ans:3, exp:"Instance-based learning memorizes the training examples and generalizes to new cases by comparing them using a similarity measure — exactly what k-NN does."},
  {id:"lec2_10", lecture:"Lecture 2", topic:"Instance vs Model Based", type:"tf", label:"True / False",
    q:"True or False: Model-based learning builds a model from training examples and uses that model to make predictions on new data.",
    opts:["True","False"], ans:0,
    exp:"True. In model-based learning, you build a model (e.g. a linear equation with learned parameters) and use it to make predictions, rather than looking up similar past examples."},
  {id:"lec2_11", lecture:"Lecture 2", topic:"Equations", type:"eq", label:"Equation",
    q:"The model-based learning example in your slides predicts life satisfaction from GDP per capita. What is the correct equation?",
    opts:["life_satisfaction = θ₀ + θ₁ × GDP_per_capita","life_satisfaction = θ₁ × GDP_per_capita²","life_satisfaction = θ₀ × θ₁ + GDP_per_capita","life_satisfaction = GDP_per_capita / (θ₀ + θ₁)"],
    ans:0, exp:"This is a simple linear model: θ₀ is the bias term (intercept) and θ₁ is the weight on the feature GDP per capita. It follows the general linear model pattern ŷ = θ₀ + θ₁x₁."},
  {id:"lec2_12", lecture:"Lecture 2", topic:"Equations", type:"eq", label:"Equation",
    q:"Given this equation from your slides, what do θ₀ and θ₁ represent?",
    equation:"life_satisfaction = θ₀ + θ₁ × GDP_per_capita",
    opts:["θ₀ is the predicted output; θ₁ is the learning rate","θ₀ is the bias term (intercept); θ₁ is the weight on the feature","θ₀ is the number of features; θ₁ is the regularization term","θ₀ and θ₁ are both bias terms with no difference"],
    ans:1, exp:"θ₀ is the bias (intercept — what the model predicts when all features are 0). θ₁ is the weight applied to the feature GDP per capita. These are the two parameters the model learns from data."},
  {id:"lec2_13", lecture:"Lecture 2", topic:"ML Challenges", type:"mc", label:"Multiple Choice",
    q:"A training dataset is collected only from hospital patients in one city, but the model is deployed nationally. What ML challenge does this describe?",
    opts:["Overfitting","Irrelevant features","Nonrepresentative training data (sampling bias)","Underfitting"],
    ans:2, exp:"This is sampling bias — the training data is not representative of the real-world population, so the model won't generalize well."},
  {id:"lec2_14", lecture:"Lecture 2", topic:"ML Challenges", type:"ms", label:"Multi-Select",
    q:"Which of the following are listed as main challenges of machine learning in your slides? Select all that apply.",
    opts:["Insufficient quantity of training data","Using too many hidden layers","Poor quality data","Irrelevant features","Overfitting the training data","Having too large a validation set"],
    ans:[0,2,3,4], exp:"The main challenges listed are: insufficient training data, nonrepresentative data, poor quality data, irrelevant features, overfitting, and underfitting. 'Too many hidden layers' and 'too large a validation set' are not listed."},
  {id:"lec2_15", lecture:"Lecture 2", topic:"Overfitting & Underfitting", type:"mc", label:"Multiple Choice",
    q:"A model performs extremely well on training data but poorly on new data. What is this called and what is the standard remedy?",
    opts:["Underfitting — use a more complex model","Overfitting — apply regularization or simplify the model","Sampling bias — collect more data","Overfitting — use a more complex model"],
    ans:1, exp:"Great training performance + poor generalization = overfitting. Regularization constrains the model to make it simpler and reduce overfitting."},
  {id:"lec2_16", lecture:"Lecture 2", topic:"Overfitting & Underfitting", type:"mc", label:"Multiple Choice",
    q:"A linear model is used to predict life satisfaction, but the relationship is far more complex. The model performs poorly even on training data. What is this?",
    opts:["Overfitting","Sampling bias","Underfitting","Regularization"],
    ans:2, exp:"When a model is too simple to capture the underlying structure, it underfits — it performs poorly even on the training examples it was trained on."},
  {id:"lec2_17", lecture:"Lecture 2", topic:"Overfitting & Underfitting", type:"ms", label:"Multi-Select",
    q:"Which of the following are true about overfitting? Select all that apply.",
    opts:["The model performs well on training data","The model performs well on new, unseen data","It can be caused by a model that is too complex","It can be reduced by regularization","It occurs when the model is too simple"],
    ans:[0,2,3], exp:"Overfitting: good training performance (A), caused by too complex a model (C), fixed by regularization (D). It does NOT generalize well to new data (B false), and it is NOT caused by being too simple — that's underfitting (E false)."},
  {id:"lec2_18", lecture:"Lecture 2", topic:"Overfitting & Underfitting", type:"tf", label:"True / False",
    q:"True or False: Regularization increases model complexity to improve training accuracy.",
    opts:["True","False"], ans:1,
    exp:"False. Regularization CONSTRAINS (simplifies) the model to reduce overfitting — it trades some training accuracy for better generalization."},
  {id:"lec2_19", lecture:"Lecture 2", topic:"Testing & Validation", type:"mc", label:"Multiple Choice",
    q:"What is the generalization error?",
    opts:["The error on the training set","The difference between training and validation error","The error rate on new, unseen cases","The error introduced by regularization"],
    ans:2, exp:"The generalization error (also called out-of-sample error) is the error rate on new cases — it estimates how well the model performs in the real world."},
  {id:"lec2_20", lecture:"Lecture 2", topic:"Testing & Validation", type:"mc", label:"Multiple Choice",
    q:"You tune a model's hyperparameters by evaluating it on the test set 50 times. What is the main problem?",
    opts:["It is computationally too expensive","You end up overfitting to the test set, so the error estimate is no longer unbiased","The test set is too small for reliable evaluation","Hyperparameters cannot be tuned after training"],
    ans:1, exp:"Repeatedly evaluating on the test set causes you to adapt the model to that particular set — the test error is no longer a reliable estimate of real-world performance."},
  {id:"lec2_21", lecture:"Lecture 2", topic:"Testing & Validation", type:"mc", label:"Multiple Choice",
    q:"What is holdout validation?",
    opts:["Holding out the test set until final evaluation","Holding out part of the training set as a validation set to compare and select models","Training the model on a random subset of data each epoch","Removing outliers from the training set before training"],
    ans:1, exp:"Holdout validation holds out a portion of the training data as a validation set to evaluate and tune models, keeping the test set untouched until the very end."},
  {id:"lec2_22", lecture:"Lecture 2", topic:"Testing & Validation", type:"ms", label:"Multi-Select",
    q:"Which of the following correctly describe the role of the test set? Select all that apply.",
    opts:["It is used to tune hyperparameters during model development","It is touched only once, at the very end of the process","It provides an unbiased estimate of real-world performance","It should be used repeatedly to guide model selection","Using it multiple times can cause overfitting to the test set"],
    ans:[1,2,4], exp:"The test set is touched only once (B), gives an unbiased final estimate (C), and using it repeatedly causes overfitting to it (E). It should NOT be used for tuning (A and D are false)."},
  {id:"lec2_23", lecture:"Lecture 2", topic:"Testing & Validation", type:"mc", label:"Multiple Choice",
    q:"Which of the following correctly orders the three data splits and their purpose?",
    opts:["Test set → tune hyperparameters; Validation set → final evaluation; Training set → learn patterns","Training set → learn patterns; Validation set → tune and compare models; Test set → final unbiased evaluation","Training set → learn patterns; Test set → tune hyperparameters; Validation set → final evaluation","Validation set → learn patterns; Training set → tune models; Test set → final evaluation"],
    ans:1, exp:"Training set: learn from. Validation set: tune and compare during development. Test set: final unbiased evaluation, touched only once."},
  {id:"lec2_24", lecture:"Lecture 2", topic:"ML Challenges", type:"mc", label:"Multiple Choice",
    q:"According to research cited in your slides, what factor had the biggest impact on performance across very different ML algorithms on a complex NLP task?",
    opts:["The choice of algorithm","The model architecture complexity","The quantity of training data","The regularization strength"],
    ans:2, exp:"Microsoft researchers Banko & Brill (2001) showed that very different algorithms performed almost identically once given enough training data — quantity of data mattered most."},
  {id:"lec2_25", lecture:"Lecture 2", topic:"ML Challenges", type:"ms", label:"Multi-Select",
    q:"Which of the following are strategies for dealing with missing feature values in a dataset? Select all that apply.",
    opts:["Ignore the attribute altogether","Ignore the instances with missing values","Fill in missing values with the median","Train two models: one with the feature and one without","Always remove the entire dataset and collect new data"],
    ans:[0,1,2,3], exp:"Your slides list four valid strategies: ignore the attribute, ignore those instances, fill in missing values (e.g. with the median), or train separate models. Discarding the entire dataset is not listed."},
  {id:"lec2_26", lecture:"Lecture 2", topic:"Instance vs Model Based", type:"ms", label:"Multi-Select",
    q:"Which of the following are true about instance-based learning? Select all that apply.",
    opts:["It learns by heart — memorizing training examples","It builds an explicit model with learned parameters","It generalizes to new cases using a similarity measure","k-Nearest Neighbors is a classic example","It requires learning a function before making predictions"],
    ans:[0,2,3], exp:"Instance-based learning memorizes examples (A), generalizes using similarity (C), and k-NN is the classic example (D). It does NOT build an explicit parametric model (B false) and does not learn a function first (E false)." },
  { id:"lec3_01", lecture:"Lecture 3", topic:"ML Workflow Steps", type:"mc", label:"Multiple Choice",
    q:"What is the correct order of the first four steps in the end-to-end ML project workflow from your slides?",
    opts:["Get data → Look at the big picture → Prepare data → Discover and visualize","Look at the big picture → Get the data → Discover and visualize → Prepare the data","Discover and visualize → Get data → Prepare data → Select a model","Prepare the data → Look at the big picture → Get the data → Train a model"],
    ans:1, exp:"The 8 steps are: 1) Look at the big picture, 2) Get the data, 3) Discover and visualize, 4) Prepare the data, 5) Select and train a model, 6) Fine-tune, 7) Present solution, 8) Launch and maintain."},
  {id:"lec3_02", lecture:"Lecture 3", topic:"ML Workflow Steps", type:"ms", label:"Multi-Select",
    q:"Which of the following are part of the 8-step ML project workflow from your slides? Select all that apply.",
    opts:["Look at the big picture","Delete all outliers from the dataset","Fine-tune your model","Discover and visualize the data","Deploy to a quantum computer","Launch, monitor, and maintain your system"],
    ans:[0,2,3,5], exp:"The 8 steps include: look at the big picture, get the data, discover and visualize, prepare the data, select and train a model, fine-tune, present the solution, and launch/monitor/maintain. 'Delete all outliers' and 'deploy to a quantum computer' are not steps."},
  {id:"lec3_03", lecture:"Lecture 3", topic:"ML Workflow Steps", type:"mc", label:"Multiple Choice",
    q:"In the ML workflow, what is the purpose of step 6: 'Fine-tune your model'?",
    opts:["Collect more training data to improve accuracy","Tune hyperparameters to get the best performance from your selected model","Re-train the model from scratch with a different algorithm","Evaluate the final model on the test set"],
    ans:1, exp:"Fine-tuning (step 6) involves tuning hyperparameters — using techniques like Grid Search or Random Search — to squeeze the best performance out of your chosen model. The test set evaluation happens separately at the end."},
  {id:"lec3_04", lecture:"Lecture 3", topic:"Framing the Problem", type:"mc", label:"Multiple Choice",
    q:"The real estate example in your slides predicts median housing price by district. What type of ML problem is this?",
    opts:["Unsupervised clustering problem","Supervised regression problem","Reinforcement learning problem","Supervised classification problem"],
    ans:1, exp:"It's supervised (we have labeled data — known housing prices) and regression (we're predicting a continuous value — the median price). Classification would predict a category, not a number."},
  {id:"lec3_05", lecture:"Lecture 3", topic:"Framing the Problem", type:"ms", label:"Multi-Select",
    q:"When framing an ML problem at the start of a project, which questions should you ask? Select all that apply.",
    opts:["Is it supervised, unsupervised, or reinforcement learning?","What GPU cluster should I use?","Is it a classification or regression task?","Should I use batch or online learning?","What color should the dashboard be?"],
    ans:[0,2,3], exp:"The three key framing questions from your slides are: (1) supervised/unsupervised/RL, (2) classification/regression/other, and (3) batch/online learning. GPU and dashboard color are not part of problem framing."},
  {id:"lec3_06", lecture:"Lecture 3", topic:"Framing the Problem", type:"tf", label:"True / False",
    q:"True or False: Data snooping bias occurs when you look at the test set before training, causing your intuitions to be biased by the test data.",
    opts:["True","False"],
    ans:0, exp:"True. Data snooping bias is a real risk — if you explore the test set, you may unconsciously make decisions (feature choices, model choices) that are tailored to it, making your final evaluation overly optimistic."},
  {id:"lec3_07", lecture:"Lecture 3", topic:"Performance Measures", type:"mc", label:"Multiple Choice",
    q:"What is the typical performance measure used for regression problems?",
    opts:["Mean Absolute Error (MAE)","Accuracy","Root Mean Square Error (RMSE)","F1 Score"],
    ans:2, exp:"RMSE is the typical performance measure for regression tasks. It gives an idea of how much error the system typically makes, with higher weight for large errors."},
  {id:"lec3_08", lecture:"Lecture 3", topic:"Performance Measures", type:"mc", label:"Multiple Choice",
    q:"When would you prefer MAE over RMSE as your performance measure?",
    opts:["When your dataset has no outliers","When you want to penalize large errors more heavily","When there are many outliers in your dataset","When you are solving a classification problem"],
    ans:2, exp:"MAE is preferred when there are many outliers. Because MAE uses absolute differences (not squared), it is less sensitive to large individual errors than RMSE."},
  {id:"lec3_09", lecture:"Lecture 3", topic:"Performance Measures", type:"eq", label:"Equation",
    q:"Which of the following is the correct formula for RMSE?",
    opts:[
      "RMSE(X,h) = √( (1/m) Σ (h(x⁽ⁱ⁾) − y⁽ⁱ⁾)² )",
      "RMSE(X,h) = (1/m) Σ |h(x⁽ⁱ⁾) − y⁽ⁱ⁾|",
      "RMSE(X,h) = (1/m) Σ (h(x⁽ⁱ⁾) − y⁽ⁱ⁾)²",
      "RMSE(X,h) = Σ (h(x⁽ⁱ⁾) − y⁽ⁱ⁾)² / (m−1)"
    ],
    ans:0, exp:"RMSE is the square root of the average of squared errors. Option B is MAE (no square, no root). Option C is MSE (no square root). Option D is close to variance, not RMSE."},
  {id:"lec3_10", lecture:"Lecture 3", topic:"Performance Measures", type:"eq", label:"Equation",
    q:"Given this equation, what does it represent?",
    equation:"(1/m) Σᵢ₌₁ᵐ |h(x⁽ⁱ⁾) − y⁽ⁱ⁾|",
    opts:["Root Mean Square Error (RMSE)","Mean Absolute Error (MAE)","Mean Squared Error (MSE)","Cross-entropy loss"],
    ans:1, exp:"This is the MAE formula — it averages the absolute differences between predictions and true values. It uses the Manhattan (ℓ₁) norm, unlike RMSE which uses the Euclidean (ℓ₂) norm."},
  {id:"lec3_11", lecture:"Lecture 3", topic:"Performance Measures", type:"mc", label:"Multiple Choice",
    q:"RMSE corresponds to the Euclidean norm and MAE corresponds to the Manhattan norm. What does this mean about their sensitivity to outliers?",
    opts:["MAE is more sensitive to outliers than RMSE","RMSE is more sensitive to outliers than MAE because errors are squared","They are equally sensitive to outliers","Neither is sensitive to outliers"],
    ans:1, exp:"RMSE squares the errors before averaging, which gives disproportionately high weight to large errors (outliers). MAE simply takes the absolute value, treating all errors more equally."},
  {id:"lec3_12", lecture:"Lecture 3", topic:"Performance Measures", type:"ms", label:"Multi-Select",
    q:"In the RMSE formula, what do the variables represent? Select all that apply.",
    opts:["m = number of instances in the dataset","m = number of features","h(x⁽ⁱ⁾) = the predicted value for instance i","y⁽ⁱ⁾ = the predicted value for instance i","y⁽ⁱ⁾ = the true label for instance i"],
    ans:[0,2,4], exp:"m is the number of instances. h(x⁽ⁱ⁾) is the model's prediction (hypothesis) for instance i. y⁽ⁱ⁾ is the true label. The error for each instance is h(x⁽ⁱ⁾) − y⁽ⁱ⁾."},
  {id:"lec3_13", lecture:"Lecture 3", topic:"Data Preparation", type:"mc", label:"Multiple Choice",
    q:"What is the purpose of feature scaling?",
    opts:["To remove outliers from the dataset","To ensure all features have the same scale so ML algorithms perform well","To convert categorical features into numbers","To reduce the number of features in the dataset"],
    ans:1, exp:"Feature scaling ensures all attributes have the same scale. ML algorithms can struggle when features have very different ranges — e.g. one feature ranging 0–1 and another ranging 0–100,000."},
  {id:"lec3_14", lecture:"Lecture 3", topic:"Data Preparation", type:"mc", label:"Multiple Choice",
    q:"What does min-max scaling (normalization) do to your data?",
    opts:["Subtracts the mean and divides by the standard deviation","Shifts and rescales values to range from 0 to 1","Converts all values to z-scores","Removes values outside the interquartile range"],
    ans:1, exp:"Min-max scaling rescales values to [0, 1] by subtracting the minimum and dividing by (max − min). It is the simplest form of feature scaling."},
  {id:"lec3_15", lecture:"Lecture 3", topic:"Data Preparation", type:"eq", label:"Equation",
    q:"Which of the following is the correct formula for min-max scaling (normalization)?",
    opts:[
      "x_scaled = (x − μ) / σ",
      "x_scaled = (x − min) / (max − min)",
      "x_scaled = x / max",
      "x_scaled = (x − min) / (max + min)"
    ],
    ans:1, exp:"Min-max scaling subtracts the minimum and divides by the range (max − min), producing values between 0 and 1. Option A is the standardization (z-score) formula."},
  {id:"lec3_16", lecture:"Lecture 3", topic:"Data Preparation", type:"eq", label:"Equation",
    q:"Given this formula, what scaling method does it describe?",
    equation:"x_new = (x − μ) / σ",
    opts:["Min-max scaling (normalization)","Standardization (z-score normalization)","Log transformation","L2 normalization"],
    ans:1, exp:"This is standardization (z-score): subtracting the mean (μ) and dividing by the standard deviation (σ). The result has zero mean and unit variance."},
  {id:"lec3_17", lecture:"Lecture 3", topic:"Data Preparation", type:"ms", label:"Multi-Select",
    q:"Which of the following are true about standardization (z-score scaling)? Select all that apply.",
    opts:["It subtracts the mean from each value","It produces values that always range from 0 to 1","It divides by the standard deviation","It is much less affected by outliers than min-max scaling","It always produces values between −1 and 1"],
    ans:[0,2,3], exp:"Standardization subtracts the mean (A) and divides by the standard deviation (C), and is less affected by outliers (D). It does NOT constrain values to [0,1] (B false) — values can range widely. And standardized values are NOT always in [−1, 1] (E false)."},
  {id:"lec3_18", lecture:"Lecture 3", topic:"Data Preparation", type:"mc", label:"Multiple Choice",
    q:"A dataset has a data entry error where one district has a median income of 100 (the real range is 0–15). Which scaling method handles this outlier better?",
    opts:["Min-max scaling, because it always produces values in [0, 1]","Standardization, because it is much less affected by outliers","They are equally affected by outliers","Neither handles outliers well"],
    ans:1, exp:"Min-max scaling would crush all valid values from 0–15 down to 0–0.15 because the outlier (100) becomes the new max. Standardization would barely be affected because it uses mean and standard deviation, which are more robust."},
  {id:"lec3_19", lecture:"Lecture 3", topic:"Data Preparation", type:"tf", label:"True / False",
    q:"True or False: Feature scaling should be applied to the entire dataset (training + test set) before splitting.",
    opts:["True","False"],
    ans:1, exp:"False. You should fit the scaler on the training set only, then apply it to the test set. Fitting on the full dataset would cause data leakage — the scaler would have information from the test set."},
  {id:"lec3_20", lecture:"Lecture 3", topic:"Data Preparation", type:"ms", label:"Multi-Select",
    q:"Which of the following are valid strategies for handling missing values in a dataset? Select all that apply.",
    opts:["Drop the rows with missing values","Drop the entire attribute (column)","Fill in missing values with the median","Fill in missing values with the mean or zero","Always leave missing values as-is — most algorithms handle them automatically"],
    ans:[0,1,2,3], exp:"Valid strategies include: dropping rows, dropping the attribute, or imputing (filling) with a representative value like the median or mean. Most sklearn algorithms do NOT handle missing values automatically — you must deal with them first."},
  {id:"lec3_21", lecture:"Lecture 3", topic:"Model Selection", type:"mc", label:"Multiple Choice",
    q:"What is K-fold cross-validation?",
    opts:["Training K different models and picking the best one","Splitting the training set into K folds, training on K−1 and evaluating on the remaining fold, repeated K times","Splitting the data into exactly 3 parts: train, validation, and test","Randomly sampling K instances to use as a test set"],
    ans:1, exp:"K-fold cross-validation splits the training set into K folds. Each fold takes a turn as the validation set while the model trains on the remaining K−1 folds. This gives K performance estimates that are averaged."},
  {id:"lec3_22", lecture:"Lecture 3", topic:"Model Selection", type:"tf", label:"True / False",
    q:"True or False: Cross-validation should be done using the test set to get the most accurate estimate of model performance.",
    opts:["True","False"],
    ans:1, exp:"False. Cross-validation is done on the training set only. The test set is never used until the very end. Using the test set for cross-validation would cause data leakage and give an overoptimistic performance estimate."},
  {id:"lec3_23", lecture:"Lecture 3", topic:"Model Selection", type:"mc", label:"Multiple Choice",
    q:"What is the difference between Grid Search and Random Search for hyperparameter tuning?",
    opts:["Grid Search is faster; Random Search tries all combinations","Grid Search tries all specified combinations; Random Search samples combinations randomly","Random Search always finds better hyperparameters than Grid Search","They are the same method with different names"],
    ans:1, exp:"Grid Search exhaustively tries all combinations of specified hyperparameter values. Random Search samples combinations randomly, which is more efficient when the search space is large because not all hyperparameters are equally important."},
  {id:"lec3_24", lecture:"Lecture 3", topic:"Model Selection", type:"ms", label:"Multi-Select",
    q:"Which of the following are true about the fine-tuning step of the ML workflow? Select all that apply.",
    opts:["Hyperparameter tuning should be done on the training/validation set","You should evaluate hyperparameter choices on the test set repeatedly","Grid Search tries all combinations of specified hyperparameter values","Random Search is better when the hyperparameter search space is large","After tuning, evaluate the final model once on the test set"],
    ans:[0,2,3,4], exp:"Fine-tuning happens on training/validation data (A). Grid Search is exhaustive (C). Random Search is efficient for large spaces (D). The test set is used only once at the very end (E). Evaluating hyperparameters on the test set repeatedly (B) causes overfitting to the test set."},
  {id:"lec3_25", lecture:"Lecture 3", topic:"Performance Measures", type:"tf", label:"True / False",
    q:"True or False: The ℓ₂ norm used in RMSE focuses more on large errors than the ℓ₁ norm used in MAE.",
    opts:["True","False"],
    ans:0, exp:"True. The higher the norm index, the more it focuses on large values and neglects small ones. The ℓ₂ norm (used in RMSE) squares the errors, giving disproportionately high weight to large errors. The ℓ₁ norm (used in MAE) treats all errors more equally."},
  {id:"lec3_26", lecture:"Lecture 3", topic:"ML Workflow Steps", type:"mc", label:"Multiple Choice",
    q:"Why is step 8 (Launch, monitor, and maintain) necessary even after a model is deployed?",
    opts:["To retrain the model on new data every hour","Models can degrade over time as real-world data patterns change","To satisfy legal requirements for ML systems","To convert the model from batch to online learning"],
    ans:1, exp:"Models can degrade over time — this is called model drift. As the real-world data distribution changes, a model trained on old data may become less accurate. Monitoring lets you detect this and retrain or update the model when needed."},
  {id:"lec3_27", lecture:"Lecture 3", topic:"Data Preparation", type:"mc", label:"Multiple Choice",
    q:"In your slides, the notation convention uses lowercase bold for vectors and uppercase bold for matrices. What does X (uppercase bold) represent in the RMSE formula?",
    opts:["A single feature value","A vector of all feature values for one instance","A matrix containing all feature values for all instances in the dataset","The set of all labels in the dataset"],
    ans:2, exp:"X (uppercase bold) is a matrix — one row per instance, where each row is the transpose of x⁽ⁱ⁾ (the feature vector for that instance). This follows the convention that uppercase bold = matrix, lowercase bold = vector."},
  {id:"lec3_28", lecture:"Lecture 3", topic:"ML Workflow Steps", type:"ms", label:"Multi-Select",
    q:"Which of the following activities belong to step 4 (Prepare the data) of the ML workflow? Select all that apply.",
    opts:["Handling missing values","Selecting the best algorithm","Feature scaling","Encoding categorical variables","Evaluating model performance on the test set"],
    ans:[0,2,3], exp:"Data preparation (step 4) includes handling missing values (imputation), feature scaling (normalization/standardization), and encoding categorical variables. Algorithm selection is step 5, and test set evaluation happens at the very end of the workflow." },
  {id:"lec4_01",lecture:"Lecture 4",topic:"MNIST & Binary Classification",type:"mc",label:"Multiple Choice",
   q:"What is the MNIST dataset?",
   opts:["A dataset of 70,000 handwritten digit images labeled with their digit (0–9)","A dataset of 10,000 images of objects used for object detection","A dataset of text documents for NLP benchmarks","A dataset of medical images for disease classification"],
   ans:0,exp:"MNIST contains 70,000 small images of handwritten digits from 0–9, each labeled with the digit it represents. It's a classic benchmark dataset for classification algorithms."},
  {id:"lec4_02",lecture:"Lecture 4",topic:"MNIST & Binary Classification",type:"mc",label:"Multiple Choice",
   q:"What makes a classifier 'binary'?",
   opts:["It can only process binary (0/1) feature values","It distinguishes between just two classes","It uses binary decision trees","It requires exactly two training epochs"],
   ans:1,exp:"A binary classifier distinguishes between exactly two classes. In the lecture example, the '5-detector' classifies each image as either '5' or 'not 5.'"},
  {id:"lec4_03",lecture:"Lecture 4",topic:"MNIST & Binary Classification",type:"mc",label:"Multiple Choice",
   q:"A classifier always predicts 'not 5' for every image. Why does this demonstrate that accuracy is a poor metric for this task?",
   opts:["Because accuracy cannot be computed without a confusion matrix","Because only about 10% of images are 5s, so it achieves ~90% accuracy while being completely useless","Because the classifier fails on the training set","Because precision and recall are always better than accuracy"],
   ans:1,exp:"With ~10% of images being 5s, always predicting 'not 5' gives ~90% accuracy despite never correctly identifying any 5. This is the problem with accuracy on skewed (imbalanced) datasets."},
  {id:"lec4_04",lecture:"Lecture 4",topic:"MNIST & Binary Classification",type:"tf",label:"True / False",
   q:"True or False: Accuracy is generally the preferred performance measure for classifiers, especially on skewed datasets.",
   opts:["True","False"],
   ans:1,exp:"False. Accuracy is generally NOT the preferred measure for classifiers, especially when dealing with skewed datasets where one class is much more frequent than others. Precision and recall are more informative."},
  {id:"lec4_05",lecture:"Lecture 4",topic:"Confusion Matrix",type:"mc",label:"Multiple Choice",
   q:"In a confusion matrix, what does each row represent?",
   opts:["A predicted class","An actual (true) class","A feature of the dataset","A threshold value"],
   ans:1,exp:"Each row in a confusion matrix represents an actual (true) class, while each column represents a predicted class. So the cell at row i, column j = number of instances of actual class i predicted as class j."},
  {id:"lec4_06",lecture:"Lecture 4",topic:"Confusion Matrix",type:"ms",label:"Multi-Select",
   q:"From the 5-detector confusion matrix in your slides: [[53057, 1522], [1325, 4096]]. Which of the following are correct? Select all that apply.",
   opts:["53,057 = true negatives (non-5s correctly classified as non-5)","1,522 = false positives (non-5s wrongly classified as 5)","1,325 = false negatives (5s wrongly classified as non-5)","4,096 = true positives (5s correctly classified as 5)","1,522 = true positives"],
   ans:[0,1,2,3],exp:"Reading the matrix [[TN=53057, FP=1522], [FN=1325, TP=4096]]: TN=53,057 non-5s correctly classified, FP=1,522 non-5s wrongly called 5, FN=1,325 5s missed, TP=4,096 5s correctly detected."},
  {id:"lec4_07",lecture:"Lecture 4",topic:"Confusion Matrix",type:"mc",label:"Multiple Choice",
   q:"What is a False Positive (FP)?",
   opts:["An instance that is actually positive and predicted positive","An instance that is actually negative but predicted positive","An instance that is actually positive but predicted negative","An instance that is actually negative and predicted negative"],
   ans:1,exp:"A False Positive (FP) is an instance that actually belongs to the negative class but is incorrectly predicted as positive. Also called a Type I error."},
  {id:"lec4_08",lecture:"Lecture 4",topic:"Confusion Matrix",type:"mc",label:"Multiple Choice",
   q:"What is a False Negative (FN)?",
   opts:["An instance that is actually positive and predicted positive","An instance that is actually negative but predicted positive","An instance that is actually positive but predicted negative","An instance that is actually negative and predicted negative"],
   ans:2,exp:"A False Negative (FN) is an instance that actually belongs to the positive class but is incorrectly predicted as negative. Also called a Type II error — a missed detection."},
  {id:"lec4_09",lecture:"Lecture 4",topic:"Precision, Recall & F1",type:"eq",label:"Equation",
   q:"What is the formula for Precision?",
   opts:["Precision = TP / (TP + FP)","Precision = TP / (TP + FN)","Precision = (TP + TN) / (TP + TN + FP + FN)","Precision = 2 × TP / (2 × TP + FP + FN)"],
   ans:0,exp:"Precision = TP / (TP + FP). It measures how many of the predicted positives are actually positive — i.e., the accuracy of positive predictions. High precision means few false alarms."},
  {id:"lec4_10",lecture:"Lecture 4",topic:"Precision, Recall & F1",type:"eq",label:"Equation",
   q:"Given this formula, what metric does it define?",
   equation:"TP / (TP + FN)",
   opts:["Precision","Recall (Sensitivity / True Positive Rate)","F1 Score","Specificity (True Negative Rate)"],
   ans:1,exp:"This is Recall (also called Sensitivity or True Positive Rate). It measures what fraction of actual positives were correctly detected. TP/(TP+FN) — FN is what was missed, so this captures how many true positives you caught."},
  {id:"lec4_11",lecture:"Lecture 4",topic:"Precision, Recall & F1",type:"eq",label:"Equation",
   q:"What is the F1 score, and which formula correctly represents it?",
   opts:["The arithmetic mean of precision and recall: (P + R) / 2","The harmonic mean of precision and recall: 2 × (P × R) / (P + R)","The geometric mean of precision and recall: √(P × R)","The ratio of precision to recall: P / R"],
   ans:1,exp:"The F1 score is the harmonic mean of precision and recall: 2 × (P × R) / (P + R). Unlike the arithmetic mean, the harmonic mean gives much more weight to low values — so the classifier only gets a high F1 if BOTH precision and recall are high."},
  {id:"lec4_12",lecture:"Lecture 4",topic:"Precision, Recall & F1",type:"ms",label:"Multi-Select",
   q:"Which of the following are true about Recall? Select all that apply.",
   opts:["It is also called Sensitivity","It is also called the True Positive Rate (TPR)","Its formula is TP / (TP + FP)","Its formula is TP / (TP + FN)","A high recall means few positive instances were missed"],
   ans:[0,1,3,4],exp:"Recall = TP/(TP+FN) (D), also called Sensitivity (A) and True Positive Rate/TPR (B). High recall means few positives were missed (E). The formula TP/(TP+FP) is Precision, not Recall (C is false)."},
  {id:"lec4_13",lecture:"Lecture 4",topic:"Precision, Recall & F1",type:"mc",label:"Multiple Choice",
   q:"You are training a classifier to detect videos safe for kids. You want to keep only safe videos (it's okay to reject some good videos). Which metric should you prioritize?",
   opts:["High recall, because you want to catch all safe videos","High precision, because you want few false positives (unsafe videos slipping through)","High F1, because you want balance","High accuracy, because most videos are safe"],
   ans:1,exp:"You want HIGH PRECISION — meaning when the classifier says 'safe,' it's almost always right. Low recall is acceptable (some good videos get rejected). If precision is low, unsafe content gets through, which is worse."},
  {id:"lec4_14",lecture:"Lecture 4",topic:"Precision, Recall & F1",type:"mc",label:"Multiple Choice",
   q:"You train a classifier to detect shoplifters. Missing a shoplifter is much worse than a false alarm. Which metric should you prioritize?",
   opts:["High precision, because false alarms are costly","High recall, because you want to catch almost every shoplifter","High F1, because you need balance","High specificity, because most people are not shoplifters"],
   ans:1,exp:"You want HIGH RECALL — catching as many actual shoplifters as possible, even if it means some false alarms (low precision). Your slides explicitly use this example: 30% precision is acceptable if recall is 99%."},
  {id:"lec4_15",lecture:"Lecture 4",topic:"Precision, Recall & F1",type:"tf",label:"True / False",
   q:"True or False: Increasing the decision threshold of a classifier will always increase both precision and recall simultaneously.",
   opts:["True","False"],
   ans:1,exp:"False. This is the precision/recall trade-off: increasing precision reduces recall and vice versa. Raising the threshold means fewer positive predictions (higher precision but lower recall). You can't maximize both simultaneously."},
  {id:"lec4_16",lecture:"Lecture 4",topic:"ROC Curve & AUC",type:"mc",label:"Multiple Choice",
   q:"What does the ROC curve plot?",
   opts:["Precision vs. Recall at all possible thresholds","True Positive Rate (recall) vs. False Positive Rate at all possible thresholds","Accuracy vs. model complexity","Training error vs. validation error"],
   ans:1,exp:"The ROC (Receiver Operating Characteristic) curve plots True Positive Rate (recall/sensitivity) on the y-axis against False Positive Rate (FPR) on the x-axis at all possible classification thresholds."},
  {id:"lec4_17",lecture:"Lecture 4",topic:"ROC Curve & AUC",type:"mc",label:"Multiple Choice",
   q:"What is the False Positive Rate (FPR)?",
   opts:["The ratio of positive instances correctly detected","The ratio of negative instances incorrectly classified as positive","1 minus the True Positive Rate","The ratio of false predictions to total predictions"],
   ans:1,exp:"FPR = ratio of negative instances incorrectly classified as positive. FPR = 1 − TNR (1 − specificity). So ROC plots sensitivity (recall) versus 1 − specificity."},
  {id:"lec4_18",lecture:"Lecture 4",topic:"ROC Curve & AUC",type:"mc",label:"Multiple Choice",
   q:"What does an AUC (Area Under the ROC Curve) of 0.5 indicate?",
   opts:["A perfect classifier","A classifier no better than random guessing","A classifier that always predicts the negative class","A classifier with 50% precision"],
   ans:1,exp:"AUC = 0.5 means the classifier performs no better than random guessing (the ROC curve is a diagonal line). A perfect classifier has AUC = 1."},
  {id:"lec4_19",lecture:"Lecture 4",topic:"ROC Curve & AUC",type:"ms",label:"Multi-Select",
   q:"Which of the following are true about the ROC curve and AUC? Select all that apply.",
   opts:["ROC plots True Positive Rate vs. False Positive Rate","A perfect classifier has AUC = 1","A random classifier has AUC = 0.5","ROC plots precision vs. recall","The TNR is also called specificity"],
   ans:[0,1,2,4],exp:"ROC plots TPR vs. FPR (A), perfect AUC = 1 (B), random AUC = 0.5 (C), TNR = specificity (E). Option D describes the Precision-Recall curve, not the ROC curve."},
  {id:"lec4_20",lecture:"Lecture 4",topic:"Multiclass: OvR vs OvO",type:"mc",label:"Multiple Choice",
   q:"What is the One-versus-the-Rest (OvR) strategy for multiclass classification?",
   opts:["Train one classifier for every pair of classes","Train one binary classifier per class, then pick the class with the highest confidence score","Train a single model with multiple output nodes","Randomly assign instances to classes during training"],
   ans:1,exp:"OvR (also called One-versus-All) trains one binary classifier per class. To classify a new instance, each classifier scores it and the class with the highest score wins. For 10 digit classes, this means 10 binary classifiers."},
  {id:"lec4_21",lecture:"Lecture 4",topic:"Multiclass: OvR vs OvO",type:"mc",label:"Multiple Choice",
   q:"What is the One-versus-One (OvO) strategy?",
   opts:["Train one classifier per class","Train one binary classifier per pair of classes","Train a single multiclass classifier","Train one classifier and use thresholds to split classes"],
   ans:1,exp:"OvO trains a binary classifier for every pair of classes. For N classes, this means N×(N−1)/2 classifiers. For 10 digit classes: 45 classifiers. Each only needs training data for its two specific classes."},
  {id:"lec4_22",lecture:"Lecture 4",topic:"Multiclass: OvR vs OvO",type:"mc",label:"Multiple Choice",
   q:"What is the main advantage of OvO over OvR?",
   opts:["OvO requires fewer classifiers overall","Each classifier only needs to train on the part of the training set for its two classes, making it useful for algorithms that scale poorly with dataset size","OvO always produces more accurate results","OvO is simpler to implement than OvR"],
   ans:1,exp:"The main advantage of OvO is that each classifier trains only on data from its two specific classes — a much smaller subset. This is particularly useful for algorithms like SVMs that scale poorly with large datasets."},
  {id:"lec4_23",lecture:"Lecture 4",topic:"Multiclass: OvR vs OvO",type:"ms",label:"Multi-Select",
   q:"Which of the following classifiers are described as capable of handling multiple classes natively (without OvR or OvO)? Select all that apply.",
   opts:["SGD classifiers","Logistic Regression","Random Forest classifiers","Support Vector Machine classifiers","Naive Bayes classifiers"],
   ans:[0,2,4],exp:"Your slides state that SGD classifiers, Random Forest classifiers, and Naive Bayes classifiers can handle multiple classes natively. Logistic Regression and SVMs are strictly binary classifiers that require OvR or OvO strategies."},
  {id:"lec4_24",lecture:"Lecture 4",topic:"Multiclass: OvR vs OvO",type:"tf",label:"True / False",
   q:"True or False: Logistic Regression and Support Vector Machines are strictly binary classifiers that require OvR or OvO strategies for multiclass problems.",
   opts:["True","False"],
   ans:0,exp:"True. Your slides explicitly state that Logistic Regression and SVMs are strictly binary classifiers. OvR or OvO strategies are needed to apply them to multiclass problems."},
  {id:"lec4_25",lecture:"Lecture 4",topic:"Multiclass: OvR vs OvO",type:"mc",label:"Multiple Choice",
   q:"What is multilabel classification?",
   opts:["A classifier that predicts multiple possible values for a single continuous output","A system that outputs multiple binary labels simultaneously (e.g. tagging multiple people in a photo)","A classifier that uses multiple models and votes on the final class","Classifying instances into more than two mutually exclusive categories"],
   ans:1,exp:"Multilabel classification outputs multiple binary tags simultaneously. Example: a face-recognition classifier outputs [Alice: yes, Bob: no, Charlie: yes] = [1, 0, 1]. This is different from multiclass, where only one class is predicted."},
  {id:"lec4_26",lecture:"Lecture 4",topic:"Precision, Recall & F1",type:"ms",label:"Multi-Select",
   q:"Which of the following are alternative names for Recall? Select all that apply.",
   opts:["Sensitivity","Specificity","True Positive Rate (TPR)","True Negative Rate (TNR)","Hit rate"],
   ans:[0,2,4],exp:"Recall is also called Sensitivity (A), True Positive Rate/TPR (C), and sometimes hit rate (E). Specificity is another name for TNR (True Negative Rate), not recall."},
  {id:"lec4_27",lecture:"Lecture 4",topic:"ROC Curve & AUC",type:"mc",label:"Multiple Choice",
   q:"The ROC curve plots sensitivity versus 1 − specificity. What does this mean in terms of standard metrics?",
   opts:["Precision vs. False Positive Rate","True Positive Rate vs. False Positive Rate","Recall vs. True Negative Rate","Accuracy vs. False Positive Rate"],
   ans:1,exp:"Sensitivity = Recall = TPR. Specificity = TNR. So 1 − specificity = FPR. Therefore, ROC plots TPR (True Positive Rate) vs. FPR (False Positive Rate)."},
  {id:"lec4_28",lecture:"Lecture 4",topic:"Confusion Matrix",type:"ms",label:"Multi-Select",
   q:"Which of the following are true about the confusion matrix? Select all that apply.",
   opts:["Each row represents an actual class","Each column represents a predicted class","A perfect classifier has zeros everywhere except the main diagonal","False positives appear in the diagonal cells","True positives appear on the main diagonal"],
   ans:[0,1,2,4],exp:"Each row = actual class (A), each column = predicted class (B). A perfect classifier has all correct predictions on the main diagonal with zeros elsewhere (C). True positives are on the main diagonal (E). False positives appear off-diagonal (D is false)."},
  {id:"lec5_01",lecture:"Lecture 5",topic:"Linear Regression Model",type:"mc",label:"Multiple Choice",
   q:"What is the linear regression model equation as shown in your slides?",
   opts:["ŷ = θ₀ + θ₁x₁ + θ₂x₂ + ... + θₙxₙ","ŷ = σ(θᵀx)","ŷ = argmax σ(s(x))","ŷ = √((1/m) Σ(h(x⁽ⁱ⁾) − y⁽ⁱ⁾)²)"],
   ans:0,exp:"The linear regression model is ŷ = θ₀ + θ₁x₁ + ... + θₙxₙ, which can also be written compactly as θᵀx. θ₀ is the bias term, θ₁ through θₙ are feature weights, and x₁ through xₙ are feature values."},
  {id:"lec5_02",lecture:"Lecture 5",topic:"Linear Regression Model",type:"ms",label:"Multi-Select",
   q:"In the linear regression equation ŷ = θ₀ + θ₁x₁ + ... + θₙxₙ, what do the following terms represent? Select all that apply.",
   opts:["θ₀ is the bias term (intercept)","θ₁ through θₙ are the feature weights","n is the number of training instances","xᵢ is the ith feature value","ŷ is the predicted output value"],
   ans:[0,1,3,4],exp:"θ₀ = bias/intercept (A), θ₁..θₙ = feature weights (B), xᵢ = ith feature value (D), ŷ = predicted output (E). n is the NUMBER OF FEATURES, not training instances (C is false — m is typically used for instances)."},
  {id:"lec5_03",lecture:"Lecture 5",topic:"Linear Regression Model",type:"mc",label:"Multiple Choice",
   q:"Your slides mention two ways to train a Linear Regression model. What are they?",
   opts:["Gradient Descent and Stochastic Descent","A closed-form Normal Equation and iterative Gradient Descent","Logistic Regression and Ridge Regression","Cross-validation and Grid Search"],
   ans:1,exp:"Your slides describe two training approaches: (1) a closed-form Normal Equation that directly computes the best parameters mathematically, and (2) iterative Gradient Descent that gradually tweaks parameters to minimize the cost function."},
  {id:"lec5_04",lecture:"Lecture 5",topic:"Normal Equation",type:"mc",label:"Multiple Choice",
   q:"What is the Normal Equation?",
   opts:["An iterative algorithm that gradually minimizes the cost function","A closed-form mathematical equation that directly computes the model parameters that best fit the training data","A regularization technique that constrains the model weights","A method to evaluate model performance on the test set"],
   ans:1,exp:"The Normal Equation is a closed-form solution — a mathematical equation that gives the optimal θ directly without iteration. It finds the value of θ that minimizes the MSE cost function in one step."},
  {id:"lec5_05",lecture:"Lecture 5",topic:"Normal Equation",type:"mc",label:"Multiple Choice",
   q:"What is a key limitation of the Normal Equation and SVD approaches?",
   opts:["They can only be used when the data is linearly separable","They get very slow when the number of features grows large (e.g. 100,000+)","They require normalized features to work correctly","They can only handle binary classification problems"],
   ans:1,exp:"Both the Normal Equation and SVD approaches get very slow when the number of features grows large (e.g. 100,000+). However, they are linear with respect to the number of instances (O(m)), so they handle large training sets efficiently if they fit in memory."},
  {id:"lec5_06",lecture:"Lecture 5",topic:"MSE Cost Function",type:"mc",label:"Multiple Choice",
   q:"Why do we minimize MSE rather than RMSE when training Linear Regression?",
   opts:["MSE is always smaller than RMSE, making it easier to compare","MSE is simpler to compute derivatives for and leads to the same result since both have the same minimum","RMSE cannot be computed for linear models","MSE penalizes outliers more heavily than RMSE"],
   ans:1,exp:"In practice, we minimize MSE rather than RMSE because (1) MSE is simpler to compute partial derivatives for, and (2) they have the same minimum — the value that minimizes MSE also minimizes its square root (RMSE)."},
  {id:"lec5_07",lecture:"Lecture 5",topic:"MSE Cost Function",type:"mc",label:"Multiple Choice",
   q:"Why is the MSE cost function being convex important for Gradient Descent?",
   opts:["It means the function has many local minima to explore","It guarantees there are no local minima — just one global minimum that GD will approach","It means the function is always differentiable","It means GD will converge instantly"],
   ans:1,exp:"Because the MSE cost function for Linear Regression is convex, there are no local minima — only one global minimum. This guarantees that Gradient Descent will approach arbitrarily close to the global minimum given enough time and a reasonable learning rate."},
  {id:"lec5_08",lecture:"Lecture 5",topic:"Gradient Descent",type:"mc",label:"Multiple Choice",
   q:"What is the general idea behind Gradient Descent?",
   opts:["Randomly initialize parameters and pick the configuration with the lowest cost","Iteratively tweak parameters in the direction of steepest descent to minimize a cost function","Solve a closed-form equation to find the optimal parameters directly","Evaluate all possible parameter values and select the best"],
   ans:1,exp:"Gradient Descent iteratively tweaks model parameters in the direction of steepest descent (opposite to the gradient, which points uphill) to minimize the cost function. It measures the local gradient and moves in the direction of descending gradient."},
  {id:"lec5_09",lecture:"Lecture 5",topic:"Gradient Descent",type:"eq",label:"Equation",
   q:"What is the Gradient Descent update rule from your slides?",
   opts:["θ⁽ⁿᵉˣᵗ⁾ = θ − η∇θ MSE(θ)","θ⁽ⁿᵉˣᵗ⁾ = θ + η∇θ MSE(θ)","θ⁽ⁿᵉˣᵗ⁾ = θ / η∇θ MSE(θ)","θ⁽ⁿᵉˣᵗ⁾ = η − θ∇θ MSE(θ)"],
   ans:0,exp:"The update rule is θ⁽ⁿᵉˣᵗ⁾ = θ − η∇θ MSE(θ). The gradient points uphill, so we SUBTRACT it (go downhill). η is the learning rate controlling step size."},
  {id:"lec5_10",lecture:"Lecture 5",topic:"Gradient Descent",type:"mc",label:"Multiple Choice",
   q:"In the GD update rule θ⁽ⁿᵉˣᵗ⁾ = θ − η∇θ MSE(θ), what is η?",
   opts:["The number of training instances","The learning rate — controls the size of each step","The regularization parameter","The gradient vector"],
   ans:1,exp:"η (eta) is the learning rate hyperparameter. It controls the size of each step in Gradient Descent. Too small = very slow convergence. Too large = may overshoot and diverge."},
  {id:"lec5_11",lecture:"Lecture 5",topic:"Gradient Descent",type:"ms",label:"Multi-Select",
   q:"What happens when the learning rate is too small in Gradient Descent? Select all that apply.",
   opts:["The algorithm will converge quickly","The algorithm has to go through many iterations to converge","Convergence will take a very long time","The algorithm may diverge with larger and larger values","Training will be slow"],
   ans:[1,2,4],exp:"If the learning rate is too small, the algorithm takes many iterations (B) and convergence is very slow (C, E). Divergence (D) happens when the learning rate is too LARGE. Fast convergence (A) is the opposite problem."},
  {id:"lec5_12",lecture:"Lecture 5",topic:"Gradient Descent",type:"mc",label:"Multiple Choice",
   q:"What happens when the learning rate is too large in Gradient Descent?",
   opts:["Convergence is guaranteed but very slow","The algorithm may jump across the valley and diverge, failing to find a good solution","The algorithm finds local minima instead of the global minimum","The cost function becomes non-convex"],
   ans:1,exp:"If the learning rate is too large, GD may jump across the valley and overshoot the minimum, possibly landing higher than before. This can cause the algorithm to diverge with larger and larger values, failing to find a good solution."},
  {id:"lec5_13",lecture:"Lecture 5",topic:"Gradient Descent",type:"tf",label:"True / False",
   q:"True or False: You should ensure that all features have a similar scale when using Gradient Descent, otherwise it will take much longer to converge.",
   opts:["True","False"],
   ans:0,exp:"True. Without feature scaling, the cost function is elongated (like a narrow valley), and GD will bounce around taking much longer to converge. Feature scaling makes the cost function more spherical and GD converges much faster."},
  {id:"lec5_14",lecture:"Lecture 5",topic:"Gradient Descent",type:"mc",label:"Multiple Choice",
   q:"When should Gradient Descent stop (what is the convergence criterion)?",
   opts:["When the cost function reaches exactly zero","When the gradient vector becomes tiny","After a fixed number of 1,000 iterations","When the training error equals the validation error"],
   ans:1,exp:"Gradient Descent should stop when the gradient vector becomes tiny — meaning you're very close to the minimum and further steps won't improve the solution meaningfully."},
  {id:"lec5_15",lecture:"Lecture 5",topic:"Batch vs SGD vs Mini-batch",type:"mc",label:"Multiple Choice",
   q:"What defines Batch Gradient Descent?",
   opts:["It picks one random instance per step","It computes gradients on small random subsets","It uses the full training set to compute gradients at every step","It updates parameters once per epoch using all data simultaneously"],
   ans:2,exp:"Batch Gradient Descent uses the FULL training set to compute the gradients at every step. This is why it is called 'batch' GD and why it is terribly slow on very large training sets."},
  {id:"lec5_16",lecture:"Lecture 5",topic:"Batch vs SGD vs Mini-batch",type:"mc",label:"Multiple Choice",
   q:"What defines Stochastic Gradient Descent (SGD)?",
   opts:["It uses the full training set at every step","It picks one random instance per step and computes gradients based only on that instance","It computes gradients on small random mini-batches","It randomly selects a subset of features at each step"],
   ans:1,exp:"SGD picks ONE random instance in the training set at every step and computes gradients based only on that single instance. This makes each step fast but the path is noisy and bounces around."},
  {id:"lec5_17",lecture:"Lecture 5",topic:"Batch vs SGD vs Mini-batch",type:"ms",label:"Multi-Select",
   q:"Which of the following are true about Stochastic Gradient Descent (SGD)? Select all that apply.",
   opts:["It is much faster per step than Batch GD on large datasets","The cost function bounces up and down, decreasing only on average","It can help the algorithm escape local minima","It always converges to exactly the global minimum","Training instances must be IID (shuffled) for it to work correctly"],
   ans:[0,1,2,4],exp:"SGD is faster per step (A), noisy cost function (B), can escape local minima (C), and requires shuffled/IID instances (E). SGD does NOT settle exactly at the global minimum — it bounces around it (D is false)."},
  {id:"lec5_18",lecture:"Lecture 5",topic:"Batch vs SGD vs Mini-batch",type:"mc",label:"Multiple Choice",
   q:"What is the main advantage of Mini-batch Gradient Descent over Stochastic GD?",
   opts:["Mini-batch GD always finds a better solution","Mini-batch GD uses less memory","Mini-batch GD can get a performance boost from hardware optimization of matrix operations, especially on GPUs","Mini-batch GD always converges faster than SGD"],
   ans:2,exp:"The main advantage of Mini-batch GD over Stochastic GD is the ability to leverage hardware optimization (especially GPUs) for matrix operations. This gives a significant performance boost compared to one-instance-at-a-time SGD."},
  {id:"lec5_19",lecture:"Lecture 5",topic:"Batch vs SGD vs Mini-batch",type:"ms",label:"Multi-Select",
   q:"Which of the following correctly describe differences between the three GD variants? Select all that apply.",
   opts:["Batch GD uses the full training set per step","SGD uses one random instance per step","Mini-batch GD uses small random subsets","All three are guaranteed to find the exact global minimum","Batch GD is slowest per step but most stable"],
   ans:[0,1,2,4],exp:"Batch GD = full dataset (A), SGD = one instance (B), Mini-batch = small subsets (C), Batch GD is slowest but most stable (E). Not all three find the exact global minimum — SGD and Mini-batch GD bounce around it (D is false)."},
  {id:"lec5_20",lecture:"Lecture 5",topic:"Batch vs SGD vs Mini-batch",type:"mc",label:"Multiple Choice",
   q:"Why must training instances be shuffled when using Stochastic Gradient Descent?",
   opts:["To reduce memory usage","To ensure instances are IID so parameters get pulled toward the global optimum on average","To increase the learning rate automatically","To prevent the model from seeing the same instance twice"],
   ans:1,exp:"SGD requires IID (independent and identically distributed) instances. If instances are sorted by label, SGD optimizes for one label at a time and won't settle near the global minimum. Shuffling ensures the updates point toward the global optimum on average."},
  {id:"lec5_21",lecture:"Lecture 5",topic:"Gradient Descent",type:"tf",label:"True / False",
   q:"True or False: Batch Gradient Descent scales well with the number of features and is faster than the Normal Equation when there are hundreds of thousands of features.",
   opts:["True","False"],
   ans:0,exp:"True. Batch GD scales well with the number of features — training a Linear Regression model with hundreds of thousands of features is much faster using Gradient Descent than the Normal Equation or SVD decomposition."},
  {id:"lec5_22",lecture:"Lecture 5",topic:"MSE Cost Function",type:"eq",label:"Equation",
   q:"What does the MSE cost function for Linear Regression look like?",
   opts:["MSE(θ) = (1/m) Σᵢ₌₁ᵐ (θᵀx⁽ⁱ⁾ − y⁽ⁱ⁾)²","MSE(θ) = √((1/m) Σᵢ₌₁ᵐ (θᵀx⁽ⁱ⁾ − y⁽ⁱ⁾)²)","MSE(θ) = (1/m) Σᵢ₌₁ᵐ |θᵀx⁽ⁱ⁾ − y⁽ⁱ⁾|","MSE(θ) = Σᵢ₌₁ᵐ (θᵀx⁽ⁱ⁾ − y⁽ⁱ⁾)"],
   ans:0,exp:"MSE(θ) = (1/m) Σ (θᵀx⁽ⁱ⁾ − y⁽ⁱ⁾)² — the average of squared errors. Option B is RMSE (has square root). Option C is MAE (absolute value). Option D is missing the average (1/m) and squaring."},
  {id:"lec5_23",lecture:"Lecture 5",topic:"Normal Equation",type:"tf",label:"True / False",
   q:"True or False: The Normal Equation and SVD approaches are O(m) with respect to the number of training instances, so they handle large training sets efficiently provided the data fits in memory.",
   opts:["True","False"],
   ans:0,exp:"True. Both Normal Equation and SVD are linear in the number of instances (O(m)), meaning adding more training instances doesn't slow them down disproportionately — as long as the data fits in memory."},
  {id:"lec5_24",lecture:"Lecture 5",topic:"Batch vs SGD vs Mini-batch",type:"mc",label:"Multiple Choice",
   q:"Which GD variant is best suited for cases with a very large number of features or too many training instances to fit in memory?",
   opts:["Batch Gradient Descent, because it uses the full dataset","Gradient Descent with the Normal Equation","Stochastic or Mini-batch Gradient Descent","The SVD approach"],
   ans:2,exp:"Gradient Descent (especially SGD or Mini-batch) is better suited for large numbers of features or when the training set is too large to fit in memory. The Normal Equation and Batch GD require the full dataset in memory and slow down with many features."},
  {id:"lec5_25",lecture:"Lecture 5",topic:"Gradient Descent",type:"ms",label:"Multi-Select",
   q:"Which of the following are true about Gradient Descent? Select all that apply.",
   opts:["It measures the local gradient of the cost function and goes in the direction of descending gradient","It requires features to have similar scale for efficient convergence","It can be used to minimize any differentiable cost function, not just MSE","The learning rate is a hyperparameter that must be tuned","It always starts from the same parameter initialization"],
   ans:[0,1,2,3],exp:"GD measures the gradient and descends (A), requires feature scaling (B), is a general optimizer for any differentiable function (C), and η must be tuned (D). GD does NOT always start from the same initialization — parameters are typically initialized randomly (E is false)."},
  {id:"lec5_26",lecture:"Lecture 5",topic:"Linear Regression Model",type:"mc",label:"Multiple Choice",
   q:"What is the compact vector form of the linear regression prediction?",
   opts:["ŷ = σ(θᵀx)","ŷ = θᵀx","ŷ = ‖θ‖²","ŷ = exp(θᵀx)"],
   ans:1,exp:"The compact vector form is ŷ = θᵀx, where θ is the parameter vector (including the bias θ₀) and x is the feature vector (with x₀ = 1 for the bias term). This is equivalent to θ₀ + θ₁x₁ + ... + θₙxₙ."},
  {id:"lec5_27",lecture:"Lecture 5",topic:"Batch vs SGD vs Mini-batch",type:"mc",label:"Multiple Choice",
   q:"In the parameter space diagram shown in your slides, which GD variant has the most erratic (noisy) path toward the minimum?",
   opts:["Batch Gradient Descent","Mini-batch Gradient Descent","Stochastic Gradient Descent","All three have identical paths"],
   ans:2,exp:"SGD has the most erratic path because it computes the gradient based on a single random instance at each step, causing the cost function to bounce up and down (decreasing only on average). Batch GD takes the smoothest path."},
  {id:"lec5_28",lecture:"Lecture 5",topic:"Gradient Descent",type:"ms",label:"Multi-Select",
   q:"Which of the following are advantages of Gradient Descent over the Normal Equation? Select all that apply.",
   opts:["GD works well when there are a very large number of features","GD does not require computing a matrix inverse","GD is simpler to implement than the Normal Equation","GD can be applied to other cost functions beyond MSE","GD always gives an exact solution in one step"],
   ans:[0,1,3],exp:"GD works well with many features (A), avoids the matrix inverse computation required by the Normal Equation (B), and can be applied to any differentiable cost function (D). GD is not necessarily simpler to implement (C) and does not give an exact solution in one step — that's the Normal Equation's advantage (E is false)."},
  {id:"lec6_01",lecture:"Lecture 6",topic:"Polynomial Regression",type:"mc",label:"Multiple Choice",
   q:"What is Polynomial Regression?",
   opts:["A model that uses polynomial activation functions in a neural network","A technique that adds powers of features as new features, then trains a linear model on the extended feature set","A regularization method that adds a polynomial penalty to the cost function","A model that fits a polynomial function directly to non-linear data without feature engineering"],
   ans:1,exp:"Polynomial Regression adds powers of each feature as new features (e.g. adding x² as a new feature), then trains a standard linear model on this extended feature set. Despite fitting non-linear data, it is still a linear model because it is linear in the parameters."},
  {id:"lec6_02",lecture:"Lecture 6",topic:"Polynomial Regression",type:"tf",label:"True / False",
   q:"True or False: Polynomial Regression is considered a non-linear model because it fits non-linear data.",
   opts:["True","False"],
   ans:1,exp:"False. Although Polynomial Regression can fit non-linear data, it is still a LINEAR model because it is linear in the parameters (θ). The non-linearity comes from the added features (x²), not from the model structure."},
  {id:"lec6_03",lecture:"Lecture 6",topic:"Learning Curves",type:"mc",label:"Multiple Choice",
   q:"What do learning curves plot?",
   opts:["Model accuracy vs. number of hidden layers","Training and validation error as a function of training set size","Cost function value vs. number of gradient descent iterations","Precision vs. recall at different thresholds"],
   ans:1,exp:"Learning curves plot the model's training error and validation error as a function of the training set size. They are used to diagnose whether a model is underfitting or overfitting."},
  {id:"lec6_04",lecture:"Lecture 6",topic:"Learning Curves",type:"mc",label:"Multiple Choice",
   q:"A learning curve shows that both the training error and validation error have plateaued at a high value, and the two curves are close together. What does this indicate?",
   opts:["Overfitting — the model is too complex","Underfitting — the model is too simple to capture the data structure","A well-fitted model — the curves should plateau","The model needs more regularization"],
   ans:1,exp:"This is the classic underfitting signature: both curves plateau high and close together. The model is too simple. Adding more training data won't help much — you need a more complex model."},
