<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Post-Midterm Review</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{--bg:#f5f4f0;--surface:#ffffff;--surface2:#f0eeea;--border:#e2dfd8;--text:#1a1916;--muted:#8a8680;--accent:#5046e4;--accent-dim:rgba(80,70,228,0.08);--accent-border:rgba(80,70,228,0.2);--orange:#d97706;--orange-bg:#fff7ed;--orange-border:#fed7aa;--green:#16a34a;--green-bg:#f0fdf4;--green-border:#86efac;--red:#dc2626;--red-bg:#fef2f2;--red-border:#fca5a5;--purple:#7c3aed;--purple-bg:#f5f3ff;--purple-border:#ddd6fe;--reveal-bg:#fafaf9;--yellow-bg:#fefce8;--yellow-border:#fde68a;}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;}
  header{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.5rem;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0;}
  .header-left{display:flex;align-items:center;gap:1rem;}
  .back-link{font-size:13px;color:var(--muted);text-decoration:none;padding:5px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);}
  .back-link:hover{border-color:var(--accent);color:var(--accent);}
  .header-title{font-family:'DM Serif Display',serif;font-size:20px;color:var(--text);}
  .header-badge{font-size:11px;font-weight:600;letter-spacing:0.06em;padding:3px 10px;border-radius:99px;background:var(--accent-dim);color:var(--accent);border:1px solid var(--accent-border);}
  .score-display{font-size:13px;color:var(--muted);}
  .progress-wrap{height:3px;background:var(--border);}
  .progress-fill{height:100%;background:var(--accent);width:0%;transition:width 0.3s;}
  main{max-width:680px;margin:0 auto;padding:2rem 1.5rem;width:100%;display:flex;flex-direction:column;flex:1;}
  .seen-bar{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:1rem;}
  .seen-progress{font-weight:600;color:var(--purple);}
  .q-counter{font-size:13px;color:var(--muted);margin-bottom:1rem;}
  .question-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:1.75rem;display:flex;flex-direction:column;gap:1rem;}
  .meta-row{display:flex;gap:8px;flex-wrap:wrap;}
  .meta-tag{font-size:11px;font-weight:600;letter-spacing:0.06em;padding:2px 9px;border-radius:99px;}
  .meta-lecture{background:var(--accent-dim);color:var(--accent);border:1px solid var(--accent-border);}
  .meta-topic{background:var(--surface2);color:var(--muted);border:1px solid var(--border);}
  .q-type-badge{font-size:11px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);}
  .q-hint{font-size:13px;color:var(--accent);font-weight:500;display:none;}
  .q-text{font-size:16px;color:var(--text);line-height:1.65;font-weight:500;}
  .q-equation{display:none;background:var(--yellow-bg);border:1px solid var(--yellow-border);border-radius:8px;padding:14px 18px;font-size:16px;font-family:'Georgia',serif;text-align:center;line-height:1.8;color:var(--text);}
  .options{display:flex;flex-direction:column;gap:8px;}
  .opt{display:flex;align-items:flex-start;gap:12px;padding:11px 14px;border:1.5px solid var(--border);border-radius:10px;cursor:pointer;transition:border-color 0.12s,background 0.12s;}
  .opt:hover{border-color:var(--accent);background:var(--accent-dim);}
  .opt.selected{border-color:var(--accent);background:var(--accent-dim);}
  .opt-indicator{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0;background:var(--surface);color:var(--muted);}
  .opt-text{font-size:15px;color:var(--text);line-height:1.5;}
  .opt-equation{display:block;background:var(--yellow-bg);border:1px solid var(--yellow-border);border-radius:6px;padding:8px 12px;font-size:14px;font-family:'Georgia',serif;text-align:center;line-height:1.8;color:var(--text);margin-top:4px;}
  .opt.correct{border-color:var(--green-border);background:var(--green-bg);}
  .opt.correct .opt-indicator{background:var(--green);color:#fff;border-color:var(--green);}
  .opt.wrong{border-color:var(--red-border);background:var(--red-bg);}
  .opt.wrong .opt-indicator{background:var(--red);color:#fff;border-color:var(--red);}
  .opt.reveal-correct{border-color:var(--green-border);background:var(--green-bg);}
  .opt.reveal-correct .opt-indicator{background:var(--green);color:#fff;border-color:var(--green);}
  .opt.disabled{cursor:default;}
  .btn-submit{display:none;margin-top:1rem;background:var(--accent);color:#fff;border:none;padding:10px 24px;border-radius:10px;font-size:14px;font-family:'DM Sans',sans-serif;font-weight:500;cursor:pointer;}
  .btn-submit.show{display:block;}
  .explanation{display:none;margin-top:1.25rem;padding:14px 16px;border-radius:10px;background:var(--reveal-bg);border-left:3px solid var(--purple);font-size:14px;color:var(--muted);line-height:1.7;}
  .explanation.show{display:block;}
  .missed-notice{display:none;margin-top:10px;padding:10px 14px;border-radius:8px;background:var(--orange-bg);border:1px solid var(--orange-border);font-size:13px;color:var(--orange);font-weight:500;}
  .missed-notice.show{display:block;}
  .btn-next{display:none;margin-top:1.5rem;align-self:flex-end;background:var(--purple);color:#fff;border:none;padding:11px 28px;border-radius:10px;font-size:15px;font-family:'DM Sans',sans-serif;font-weight:500;cursor:pointer;}
  .btn-next.show{display:block;}
  .summary{display:none;flex-direction:column;align-items:center;text-align:center;padding:3rem 2rem;width:100%;}
  .summary.show{display:flex;}
  .summary-score{font-family:'DM Serif Display',serif;font-size:72px;color:var(--purple);line-height:1;margin-bottom:0.5rem;}
  .summary-label{font-size:14px;color:var(--muted);margin-bottom:0.25rem;}
  .summary-msg{font-size:17px;color:var(--text);margin:1.25rem 0 0.75rem;line-height:1.6;max-width:420px;}
  .summary-seen{font-size:14px;color:var(--purple);background:var(--purple-bg);border:1px solid var(--purple-border);border-radius:10px;padding:10px 18px;margin-bottom:1.5rem;}
  .summary-missed-box{font-size:14px;color:var(--orange);background:var(--orange-bg);border:1px solid var(--orange-border);border-radius:10px;padding:10px 18px;margin-bottom:1.5rem;display:none;}
  .btn-group{display:flex;flex-direction:column;align-items:center;gap:10px;}
  .btn-new-round{background:var(--purple);color:#fff;border:none;padding:11px 28px;border-radius:10px;font-size:15px;font-family:'DM Sans',sans-serif;font-weight:500;cursor:pointer;}
  .link-missed{font-size:14px;color:var(--orange);text-decoration:none;padding:10px 24px;border:1px solid var(--orange-border);border-radius:10px;background:var(--orange-bg);display:none;}
  .link-home{font-size:14px;color:var(--muted);text-decoration:none;margin-top:0.25rem;}
</style>
</head>
<body>
<header>
  <div class="header-left">
    <a href="index.html" class="back-link">← Back</a>
    <span class="header-title">Post-Midterm Review</span>
    <span class="header-badge">Lectures 10–19 · 20 questions per round</span>
  </div>
  <div class="score-display">Score: <span id="scoreDisplay">0 / 0</span></div>
</header>
<div class="progress-wrap"><div class="progress-fill" id="progressFill"></div></div>
<main>
  <div class="seen-bar">
    <span class="seen-label" id="seenLabel">Questions seen in this deck:</span>
    <span class="seen-progress" id="seenProgress"></span>
  </div>
  <div class="q-counter" id="qCounter">Question 1 of 20</div>
  <div class="question-card" id="questionCard">
    <div class="meta-row"><span class="meta-tag meta-lecture" id="metaLecture"></span><span class="meta-tag meta-topic" id="metaTopic"></span></div>
    <div class="q-type-badge" id="qTypeBadge"></div>
    <div class="q-hint" id="qHint">Select all that apply, then click Submit.</div>
    <p class="q-text" id="qText"></p>
    <div class="q-equation" id="qEquation"></div>
    <div class="options" id="optionsDiv"></div>
    <button class="btn-submit" id="btnSubmit" onclick="submitMulti()">Submit answer</button>
    <div class="explanation" id="explanation"></div>
    <div class="missed-notice" id="missedNotice">⚠ Added to your missed questions deck.</div>
  </div>
  <button class="btn-next" id="btnNext" onclick="nextQ()">Next question →</button>
  <div class="summary" id="summary">
    <div class="summary-label">Round complete</div>
    <div class="summary-score" id="summaryScore"></div>
    <div class="summary-label" id="summaryFrac"></div>
    <p class="summary-msg" id="summaryMsg"></p>
    <div class="summary-seen" id="summarySeen"></div>
    <div class="summary-missed-box" id="summaryMissedBox"></div>
    <div class="btn-group">
      <button class="btn-new-round" onclick="newRound()">Next round of 20 →</button>
      <a href="missed.html" class="link-missed" id="linkMissed">Review missed questions →</a>
      <a href="index.html" class="link-home">← Back</a>
    </div>
  </div>
</main>
<script>
const SEEN_KEY='ml_review_postmidterm';
const ALL_QUESTIONS=[
  {id:"lec10_01",lecture:"Lecture 10",topic:"Decision Trees",type:"mc",label:"Multiple Choice",q:"What algorithm does Scikit-Learn use to train Decision Trees?",opts:["ID3","C4.5","CART","Gradient Boosting"],ans:2,exp:"Scikit-Learn uses the Classification and Regression Tree (CART) algorithm, which produces binary splits at each node."},
  {id:"lec10_02",lecture:"Lecture 10",topic:"Gini Impurity",type:"mc",label:"Multiple Choice",q:"What does a Gini impurity of 0 mean for a node?",opts:["The node has equal class distribution","The node is pure — all samples belong to one class","The node has maximum diversity","The split was made using entropy"],ans:1,exp:"Gini = 0 means 1 − Σp_{i,k}² = 0, which only happens when all samples belong to one class (one p = 1, rest = 0)."},
  {id:"lec10_03",lecture:"Lecture 10",topic:"CART Algorithm",type:"mc",label:"Multiple Choice",q:"How does CART choose which feature and threshold to split on?",opts:["Randomly samples a feature and threshold","Finds the pair (k, t_k) that produces the purest child subsets weighted by size","Uses entropy and picks the highest information gain","Minimizes the depth of the resulting subtree"],ans:1,exp:"CART searches for the (k, t_k) pair that minimizes the weighted impurity J(k, t_k) = (m_left/m)·G_left + (m_right/m)·G_right."},
  {id:"lec10_04",lecture:"Lecture 10",topic:"CART Algorithm",type:"tf",label:"True / False",q:"CART considers all possible future splits several levels down before choosing the current split.",opts:["True","False"],ans:1,exp:"False. CART is a greedy algorithm — it only looks for the locally optimal split at the current level, not the globally optimal tree."},
  {id:"lec10_05",lecture:"Lecture 10",topic:"Complexity",type:"mc",label:"Multiple Choice",q:"What is the time complexity of making a prediction with a trained Decision Tree on a dataset of m instances?",opts:["O(m)","O(m log m)","O(log m)","O(n·m)"],ans:2,exp:"Traversing a balanced binary tree takes O(log m) — you follow one path from root to leaf."},
  {id:"lec10_06",lecture:"Lecture 10",topic:"Gini vs Entropy",type:"mc",label:"Multiple Choice",q:"Compared to Gini impurity, which statement about entropy as a splitting criterion is correct?",opts:["Entropy is always faster to compute","Entropy tends to produce more balanced trees","Entropy leads to shallower trees","Entropy and Gini always produce identical trees"],ans:1,exp:"Both criteria lead to similar trees, but entropy tends to produce slightly more balanced trees. Gini is slightly faster to compute."},
  {id:"lec10_07",lecture:"Lecture 10",topic:"Regularization",type:"multi",label:"Multi-Select",q:"Which hyperparameters can be used to regularize a Decision Tree and reduce overfitting? (Select all that apply)",opts:["max_depth","min_samples_split","max_features","learning_rate","min_samples_leaf"],ans:[0,1,2,4],exp:"max_depth, min_samples_split, max_features, and min_samples_leaf are all regularization hyperparameters. learning_rate is not a Decision Tree parameter."},
  {id:"lec10_08",lecture:"Lecture 10",topic:"Instability",type:"tf",label:"True / False",q:"Decision Trees are sensitive to small changes in training data, such that removing a single instance can produce a very different tree.",opts:["True","False"],ans:0,exp:"True. Decision Trees are very sensitive to small variations in training data. This instability is why ensemble methods like Random Forests work well."},
  {id:"lec10_09",lecture:"Lecture 10",topic:"Decision Boundaries",type:"mc",label:"Multiple Choice",q:"Why are Decision Trees sensitive to rotation of the training data?",opts:["Because they only use one feature at a time","Because their decision boundaries are always orthogonal to feature axes","Because they use Euclidean distance","Because they normalize features internally"],ans:1,exp:"Decision Trees create axis-aligned (orthogonal) boundaries. After rotating the data, the same pattern requires a much more complex tree."},
  {id:"lec10_10",lecture:"Lecture 10",topic:"Probability Estimation",type:"mc",label:"Multiple Choice",q:"How does a Decision Tree estimate the class probability for an instance?",opts:["Uses a sigmoid function on the output","Returns the ratio of each class among the training instances in the leaf node","Averages probabilities over the path from root to leaf","Uses the Gini formula directly as a probability"],ans:1,exp:"The Decision Tree finds the leaf node for the instance and returns the ratio of each class k among the training samples that reach that node."},
  {id:"lec10_11",lecture:"Lecture 10",topic:"Regression",type:"mc",label:"Multiple Choice",q:"When a DecisionTreeRegressor makes a prediction for a new instance, what value does it return?",opts:["The median of target values in the leaf node","The mode of target values in the leaf node","The mean of target values in the leaf node","The maximum target value in the leaf node"],ans:2,exp:"The regression tree predicts the mean target value of all training instances in the leaf node that the new instance falls into."},
  {id:"lec10_12",lecture:"Lecture 10",topic:"Regression",type:"mc",label:"Multiple Choice",q:"What does the CART regression algorithm minimize at each split?",opts:["Gini impurity","Entropy","Mean Squared Error (MSE)","Mean Absolute Error (MAE)"],ans:2,exp:"For regression, CART minimizes the weighted MSE across the two child nodes: J(k,t_k) = (m_left/m)·MSE_left + (m_right/m)·MSE_right."},
  {id:"lec10_13",lecture:"Lecture 10",topic:"Data Preparation",type:"tf",label:"True / False",q:"Decision Trees require feature scaling (e.g., standardization or normalization) before training.",opts:["True","False"],ans:1,exp:"False. Decision Trees split on feature thresholds, so the scale of features does not matter. No feature scaling is needed."},
  {id:"lec10_14",lecture:"Lecture 10",topic:"NP-Completeness",type:"mc",label:"Multiple Choice",q:"Why does CART use a greedy approach instead of finding the globally optimal tree?",opts:["Greedy always finds the optimal solution","Finding the optimal tree is NP-Complete with O(exp(m)) time complexity","CART is designed only for small datasets","Greedy is required by scikit-learn's API"],ans:1,exp:"Finding the optimal Decision Tree is NP-Complete. The greedy approach provides a reasonably good solution in tractable time."},
  {id:"lec10_15",lecture:"Lecture 10",topic:"CART",type:"equation",label:"Equation",q:"Write the CART cost function for classification.",equation:"J(k, t_k) = ?",opts:["(m_left/m)·G_left + (m_right/m)·G_right","(m_left)·G_left + (m_right)·G_right","G_left / G_right","(m_right/m)·G_left + (m_left/m)·G_right"],ans:0,exp:"CART minimizes J(k,t_k) = (m_left/m)·G_left + (m_right/m)·G_right — the size-weighted impurity of the two children."},
  {id:"lec11_01",lecture:"Lecture 11",topic:"Ensemble Learning",type:"mc",label:"Multiple Choice",q:"What is the key advantage of ensemble methods over single predictors?",opts:["They always require less data","Aggregating diverse predictors typically produces better predictions","They train faster","They require no hyperparameter tuning"],ans:1,exp:"An ensemble aggregates predictions from multiple predictors. When predictors are diverse and make independent errors, aggregation reduces variance and improves overall performance."},
  {id:"lec11_02",lecture:"Lecture 11",topic:"Voting",type:"mc",label:"Multiple Choice",q:"What is the difference between hard voting and soft voting in ensemble classifiers?",opts:["Hard voting uses more predictors","Soft voting averages predicted class probabilities; hard voting takes the majority class vote","Hard voting requires more memory","Soft voting only works with decision trees"],ans:1,exp:"Hard voting predicts the most common class. Soft voting averages probabilities across predictors and predicts the class with the highest average probability — often better."},
  {id:"lec11_03",lecture:"Lecture 11",topic:"Bagging",type:"mc",label:"Multiple Choice",q:"What is the key difference between bagging and pasting?",opts:["Bagging uses different algorithms; pasting uses the same","Bagging samples with replacement; pasting samples without replacement","Bagging uses all features; pasting samples features too","Pasting is only for regression"],ans:1,exp:"Bagging = bootstrap aggregating (with replacement). Pasting = without replacement. Both create diverse subsets for each predictor."},
  {id:"lec11_04",lecture:"Lecture 11",topic:"Bagging",type:"mc",label:"Multiple Choice",q:"What effect does bagging have on bias and variance compared to a single predictor trained on the full set?",opts:["Higher bias, lower variance","Similar bias, lower variance","Lower bias, higher variance","Both bias and variance decrease"],ans:1,exp:"Each individual bagged predictor has slightly higher bias than one trained on the full set, but aggregation reduces variance. Net result: similar bias, lower variance."},
  {id:"lec11_05",lecture:"Lecture 11",topic:"Out-of-Bag",type:"tf",label:"True / False",q:"With bagging, approximately 37% of training instances are never sampled for any given predictor, and these can be used for out-of-bag evaluation.",opts:["True","False"],ans:0,exp:"True. With bootstrap sampling, each predictor sees about 63% of instances. The remaining ~37% out-of-bag instances can serve as a free validation set."},
  {id:"lec11_06",lecture:"Lecture 11",topic:"Random Forests",type:"mc",label:"Multiple Choice",q:"How does a Random Forest introduce extra randomness beyond bagging?",opts:["It uses a different activation function","At each node, only a random subset of features is considered for splitting","It samples the target variable randomly","It uses soft voting with random weights"],ans:1,exp:"Random Forests add feature randomness: at each split, only max_features (a random subset) are evaluated, decorrelating the trees and reducing variance."},
  {id:"lec11_07",lecture:"Lecture 11",topic:"Feature Importance",type:"mc",label:"Multiple Choice",q:"How does Scikit-Learn compute feature importance in a Random Forest?",opts:["By the correlation of each feature with the target","By how much tree nodes using that feature reduce impurity on average across all trees","By counting how many times a feature is selected as root","By the coefficient magnitude after training a linear model"],ans:1,exp:"Feature importance = average impurity reduction weighted by the number of samples reaching each node using that feature, averaged across all trees."},
  {id:"lec11_08",lecture:"Lecture 11",topic:"Extra-Trees",type:"mc",label:"Multiple Choice",q:"What makes Extra-Trees (Extremely Randomized Trees) different from a standard Random Forest?",opts:["Extra-Trees use soft voting","Extra-Trees also use random thresholds for each feature rather than searching for the best threshold","Extra-Trees only work for regression","Extra-Trees sample fewer training instances"],ans:1,exp:"Extra-Trees add even more randomness by using random thresholds for splitting, not just random feature subsets. This makes them faster to train but introduces higher bias."},
  {id:"lec11_09",lecture:"Lecture 11",topic:"Boosting",type:"mc",label:"Multiple Choice",q:"What is the core idea of boosting?",opts:["Train predictors in parallel on different subsets","Train predictors sequentially, each correcting its predecessor","Average predictions of identical predictors","Use a single strong predictor with high complexity"],ans:1,exp:"Boosting chains predictors sequentially. Each new predictor focuses on the errors of the previous ensemble, gradually improving overall performance."},
  {id:"lec11_10",lecture:"Lecture 11",topic:"AdaBoost",type:"mc",label:"Multiple Choice",q:"How does AdaBoost handle misclassified instances during training?",opts:["It removes them from the training set","It increases their weight so the next predictor focuses on them","It duplicates them in the training set","It assigns them to a separate validation set"],ans:1,exp:"AdaBoost increases the relative weight of misclassified training instances after each predictor, so subsequent predictors focus more on those hard cases."},
  {id:"lec11_11",lecture:"Lecture 11",topic:"Gradient Boosting",type:"mc",label:"Multiple Choice",q:"What does each new tree in Gradient Boosting fit?",opts:["The original target values","The residual errors of the previous predictor","A random subset of the target values","The weighted version of the original targets"],ans:1,exp:"Gradient Boosting fits each new predictor to the residual errors made by the previous predictor. The final prediction is the sum of all trees."},
  {id:"lec11_12",lecture:"Lecture 11",topic:"Gradient Boosting",type:"mc",label:"Multiple Choice",q:"In Gradient Boosting, what effect does using a very small learning_rate with many estimators have?",opts:["Underfitting due to too many corrections","Better generalization but slower training","Overfitting due to too many trees","No effect on performance"],ans:1,exp:"Shrinking each tree contribution with a small learning_rate (shrinkage) requires more trees but generally produces better generalization. This is the bias-variance trade-off in boosting."},
  {id:"lec11_13",lecture:"Lecture 11",topic:"Stacking",type:"mc",label:"Multiple Choice",q:"What is the key difference between stacking and voting ensembles?",opts:["Stacking uses more trees","Stacking trains a blender model to aggregate predictions rather than using a fixed aggregation rule","Stacking only works for classification","Voting requires more memory than stacking"],ans:1,exp:"Stacking uses a trained meta-learner (blender) to combine base predictor outputs, instead of a fixed rule like majority voting or averaging."},
  {id:"lec11_14",lecture:"Lecture 11",topic:"Random Forests",type:"tf",label:"True / False",q:"Random Forests are considered one of the most powerful Machine Learning algorithms despite their simplicity.",opts:["True","False"],ans:0,exp:"True. Random Forests are highly effective, versatile, and require relatively little hyperparameter tuning, making them one of the go-to algorithms in practice."},
  {id:"lec11_15",lecture:"Lecture 11",topic:"Ensemble Methods",type:"mc",label:"Multiple Choice",q:"When is the best time to apply ensemble methods in a project?",opts:["At the very beginning, before exploring individual models","Near the end of the project, to combine several good predictors","Only when using deep learning","Only on very large datasets"],ans:1,exp:"People typically use ensemble methods near the end of a project, once they have already built a few good individual predictors to combine."},
  {id:"lec12_01",lecture:"Lecture 12",topic:"Dimensionality Reduction",type:"mc",label:"Multiple Choice",q:"What are the two main approaches to dimensionality reduction?",opts:["Regularization and pruning","Projection and Manifold Learning","Encoding and decoding","Clustering and filtering"],ans:1,exp:"The two main approaches are Projection (projecting onto a lower-dimensional subspace) and Manifold Learning (unrolling a manifold to find a lower-dimensional representation)."},
  {id:"lec12_02",lecture:"Lecture 12",topic:"PCA",type:"mc",label:"Multiple Choice",q:"What does the first principal component in PCA represent?",opts:["The axis with the smallest variance","The axis orthogonal to all data points","The axis that accounts for the largest amount of variance in the dataset","The axis that minimizes reconstruction error along it"],ans:2,exp:"PC1 is the axis along which the data has the greatest variance. Each subsequent PC captures the most remaining variance while being orthogonal to all previous PCs."},
  {id:"lec12_03",lecture:"Lecture 12",topic:"PCA",type:"tf",label:"True / False",q:"Principal components in PCA are always orthogonal to each other.",opts:["True","False"],ans:0,exp:"True. Each principal component must be orthogonal (perpendicular) to all previously identified principal components."},
  {id:"lec12_04",lecture:"Lecture 12",topic:"Explained Variance",type:"mc",label:"Multiple Choice",q:"What does an explained_variance_ratio_ of [0.842, 0.146] tell you?",opts:["84.2% of instances are in the first cluster","84.2% of the dataset's variance lies along PC1, and 14.6% lies along PC2","84.2% of features were selected","14.6% of data was discarded"],ans:1,exp:"The explained variance ratio indicates what fraction of total dataset variance is captured by each principal component. PC1 captures 84.2%, PC2 captures 14.6% — together 98.8%."},
  {id:"lec12_05",lecture:"Lecture 12",topic:"PCA Compression",type:"mc",label:"Multiple Choice",q:"Applying PCA to MNIST with n_components=0.95 reduces dimensionality from 784 to approximately how many features?",opts:["10","50","154","400"],ans:2,exp:"Preserving 95% of variance in MNIST reduces from 784 to about 154 features — a large reduction that speeds up training significantly."},
  {id:"lec12_06",lecture:"Lecture 12",topic:"PCA",type:"tf",label:"True / False",q:"PCA is sensitive to feature scaling and therefore features should be scaled before applying it.",opts:["True","False"],ans:0,exp:"True. PCA looks for the directions of maximum variance. If features have very different scales, large-scale features will dominate. Always scale features before PCA."},
  {id:"lec12_07",lecture:"Lecture 12",topic:"Manifold Learning",type:"mc",label:"Multiple Choice",q:"What is a 2D manifold embedded in 3D space?",opts:["Any flat 2D plane","A 2D shape that can be bent and twisted in a higher-dimensional space","A sphere with 2 axes","Any dataset with 2 features"],ans:1,exp:"A 2D manifold is a 2D shape (like a rolled-up sheet or the Swiss roll) that is embedded/twisted in a higher-dimensional space. Locally it looks like a 2D plane."},
  {id:"lec12_08",lecture:"Lecture 12",topic:"LLE",type:"mc",label:"Multiple Choice",q:"How does LLE (Locally Linear Embedding) differ from PCA?",opts:["LLE is faster than PCA","LLE is a nonlinear manifold learning technique that does not rely on projections","LLE only works on 1D data","LLE uses entropy instead of variance"],ans:1,exp:"LLE is a nonlinear dimensionality reduction (NLDR) technique and a manifold learning method — it does not project onto a hyperplane like PCA. It preserves local linear relationships."},
  {id:"lec12_09",lecture:"Lecture 12",topic:"LLE",type:"mc",label:"Multiple Choice",q:"What are the two steps of LLE?",opts:["Compute variance, then project","Find linear reconstruction weights from neighbors, then map to low-D space preserving those weights","Cluster data, then flatten each cluster","Apply PCA, then rotate"],ans:1,exp:"Step 1: for each instance, find weights w_{i,j} that reconstruct it as a linear combination of k nearest neighbors. Step 2: find a low-D representation that preserves these weights as closely as possible."},
  {id:"lec12_10",lecture:"Lecture 12",topic:"LLE Complexity",type:"mc",label:"Multiple Choice",q:"Why does LLE scale poorly to very large datasets?",opts:["Because it requires too many components","Because the last step (constructing the low-D representation) has O(dm²) complexity","Because it needs feature scaling","Because it uses random initialization"],ans:1,exp:"The third step of LLE has O(dm²) complexity — the m² term grows very quickly as the number of instances m grows, making it impractical for very large datasets."},
  {id:"lec12_11",lecture:"Lecture 12",topic:"Dimensionality Reduction",type:"mc",label:"Multiple Choice",q:"Which Scikit-Learn PCA call automatically finds the minimum number of dimensions to preserve 95% of variance?",opts:["PCA(n_components=95)","PCA(n_components=0.95)","PCA(variance=95)","PCA(min_components=0.95)"],ans:1,exp:"When n_components is set to a float between 0 and 1, Scikit-Learn automatically finds the minimum number of dimensions that preserve that fraction of variance."},
  {id:"lec12_12",lecture:"Lecture 12",topic:"PCA",type:"mc",label:"Multiple Choice",q:"What is reconstruction error in PCA?",opts:["The training loss on the original data","The mean squared distance between original data and data reconstructed after inverse-transforming from the compressed representation","The explained variance ratio","The number of features lost during compression"],ans:1,exp:"After projecting to d dimensions and inverse-transforming back, reconstruction error is the mean squared distance between original and reconstructed instances."},
  {id:"lec13_01",lecture:"Lecture 13",topic:"K-Means",type:"mc",label:"Multiple Choice",q:"What is the stopping condition for the K-Means algorithm?",opts:["When all instances are correctly classified","When the centroids stop moving","When inertia reaches zero","After a fixed number of iterations always"],ans:1,exp:"K-Means iterates until the centroids stop moving (converge). The algorithm is guaranteed to converge in a finite number of steps."},
  {id:"lec13_02",lecture:"Lecture 13",topic:"K-Means",type:"mc",label:"Multiple Choice",q:"What is the difference between hard clustering and soft clustering in K-Means?",opts:["Hard uses Euclidean distance; soft uses cosine distance","Hard assigns each instance to exactly one cluster; soft gives each instance a score per cluster","Hard clustering uses more iterations","Soft clustering is always preferred"],ans:1,exp:"Hard clustering assigns one label per instance. Soft clustering provides a score (like distance to centroid) for every cluster, giving richer information about cluster membership."},
  {id:"lec13_03",lecture:"Lecture 13",topic:"Inertia",type:"tf",label:"True / False",q:"Inertia (mean squared distance to nearest centroid) is a reliable metric for choosing the optimal number of clusters k.",opts:["True","False"],ans:1,exp:"False. Inertia always decreases as k increases, so it cannot be used alone to find the optimal k. Use the elbow method or silhouette score instead."},
  {id:"lec13_04",lecture:"Lecture 13",topic:"K-Means++",type:"mc",label:"Multiple Choice",q:"How does K-Means++ improve on random centroid initialization?",opts:["It runs the algorithm multiple times and keeps the best","It selects initial centroids with probability proportional to squared distance from already-chosen centroids","It uses silhouette scores to pick initial centroids","It starts with k=1 and adds centroids one at a time"],ans:1,exp:"K-Means++ selects each new centroid with probability proportional to its squared distance from the nearest already-chosen centroid. This spreads centroids apart and reduces bad initializations."},
  {id:"lec13_05",lecture:"Lecture 13",topic:"Silhouette",type:"mc",label:"Multiple Choice",q:"In the silhouette coefficient formula (b − a) / max(a, b), what does 'a' represent?",opts:["Mean distance to the nearest other cluster","Mean distance to the assigned cluster centroid","Mean distance to the farthest cluster","Number of instances in the cluster"],ans:1,exp:"a = mean intra-cluster distance (mean distance to other instances in the same cluster). b = mean nearest-cluster distance (mean distance to instances of the closest other cluster)."},
  {id:"lec13_06",lecture:"Lecture 13",topic:"Silhouette",type:"mc",label:"Multiple Choice",q:"What does a silhouette coefficient close to −1 indicate?",opts:["The instance is well inside its own cluster","The instance is near a cluster boundary","The instance was likely assigned to the wrong cluster","The cluster has too many instances"],ans:2,exp:"A coefficient near −1 means the instance is far from its assigned cluster and close to another cluster — it was likely assigned to the wrong cluster."},
  {id:"lec13_07",lecture:"Lecture 13",topic:"Silhouette",type:"mc",label:"Multiple Choice",q:"A silhouette coefficient close to 0 means:",opts:["Perfect cluster assignment","The instance is near a cluster boundary","The instance is in the wrong cluster","The cluster is too large"],ans:1,exp:"A coefficient near 0 means the instance is close to the boundary between clusters — it could plausibly belong to either one."},
  {id:"lec13_08",lecture:"Lecture 13",topic:"K-Means Limitations",type:"mc",label:"Multiple Choice",q:"Which type of cluster shapes does K-Means struggle with?",opts:["Spherical, equal-sized clusters","Elongated or clusters of different sizes/densities","Clusters with exactly k instances","Clusters in high-dimensional space"],ans:1,exp:"K-Means assumes roughly spherical, equal-sized clusters because it uses Euclidean distance. It performs poorly on elongated, non-spherical, or differently sized clusters."},
  {id:"lec13_09",lecture:"Lecture 13",topic:"K-Means",type:"tf",label:"True / False",q:"K-Means is guaranteed to find the globally optimal clustering solution.",opts:["True","False"],ans:1,exp:"False. K-Means converges but may find a local minimum, not the global optimum. Running multiple times with different initializations (or using K-Means++) helps."},
  {id:"lec13_10",lecture:"Lecture 13",topic:"Applications",type:"mc",label:"Multiple Choice",q:"How can K-Means be used as a preprocessing step for classification?",opts:["Replace each feature with its cluster assignment","Use cluster distances as new features; the best k is found via cross-validation performance","Use inertia as a feature","Replace labels with cluster IDs"],ans:1,exp:"After K-Means clustering, the k distances to each centroid become new features. The optimal k is the one that gives best classification performance in cross-validation."},
  {id:"lec13_11",lecture:"Lecture 13",topic:"K-Means Algorithm",type:"mc",label:"Multiple Choice",q:"What is the correct order of steps in the K-Means algorithm?",opts:["Label instances → update centroids → initialize → repeat","Initialize centroids → label instances → update centroids → repeat","Update centroids → initialize → label instances → repeat","Initialize centroids → update centroids → label instances → repeat"],ans:1,exp:"K-Means: (1) Initialize centroids randomly, (2) label each instance with the nearest centroid, (3) update centroids to the mean of their group, (4) repeat steps 2-3 until convergence."},
  {id:"lec14_01",lecture:"Lecture 14",topic:"GMM",type:"mc",label:"Multiple Choice",q:"What does a Gaussian Mixture Model assume about the data?",opts:["All data comes from a single Gaussian","Data was generated from a mixture of several Gaussian distributions with unknown parameters","Data is uniformly distributed","Data must be labeled"],ans:1,exp:"A GMM is a probabilistic model that assumes instances were generated from a mixture of Gaussian distributions. Each component has its own mean, covariance, and mixing weight."},
  {id:"lec14_02",lecture:"Lecture 14",topic:"EM Algorithm",type:"mc",label:"Multiple Choice",q:"What happens during the E-step (Expectation) of the EM algorithm?",opts:["The Gaussian parameters are updated","The soft cluster assignments (probabilities) are computed based on current parameters","New centroids are initialized","The BIC is computed"],ans:1,exp:"E-step: estimate the probability that each data point belongs to each Gaussian component (hidden variable probabilities), given the current parameter estimates."},
  {id:"lec14_03",lecture:"Lecture 14",topic:"EM Algorithm",type:"mc",label:"Multiple Choice",q:"What happens during the M-step (Maximization) of the EM algorithm?",opts:["Cluster assignments are computed","Gaussian parameters (mean, covariance, mixing weights) are updated to maximize likelihood given current soft assignments","The number of clusters is selected","Hard cluster assignments are made"],ans:1,exp:"M-step: given the soft cluster assignments from E-step, update all Gaussian parameters (μ, Σ, φ) to maximize the expected log-likelihood."},
  {id:"lec14_04",lecture:"Lecture 14",topic:"EM vs K-Means",type:"multi",label:"Multi-Select",q:"Which of the following are similarities between EM and K-Means? (Select all that apply)",opts:["Both use random initialization","Both alternate between assignment and update steps","Both are guaranteed to find the global optimum","Both converge to a local optimum","Both produce hard cluster assignments"],ans:[0,1,3],exp:"Both EM and K-Means: use random initialization, alternate assignment/update steps, and converge to a local (not necessarily global) optimum. K-Means produces hard assignments; EM produces soft (probabilistic) assignments."},
  {id:"lec14_05",lecture:"Lecture 14",topic:"Model Selection",type:"mc",label:"Multiple Choice",q:"Why are inertia and silhouette score unreliable for selecting the number of components in a GMM?",opts:["They are too slow to compute for GMMs","They are not reliable when clusters are non-spherical or have different sizes","They require labeled data","They only work for K-Means"],ans:1,exp:"Inertia and silhouette assume spherical, similarly-sized clusters. When clusters have different shapes or sizes (as GMMs allow), these metrics are misleading."},
  {id:"lec14_06",lecture:"Lecture 14",topic:"BIC/AIC",type:"mc",label:"Multiple Choice",q:"When using BIC or AIC to select the number of GMM components, what are you looking for?",opts:["The highest value","The lowest value","The value closest to zero","The value with the most stable gradient"],ans:1,exp:"Lower BIC or AIC is better. Both criteria balance model fit (likelihood) against complexity (number of parameters). The k with the lowest criterion is selected."},
  {id:"lec14_07",lecture:"Lecture 14",topic:"Anomaly Detection",type:"mc",label:"Multiple Choice",q:"How can a GMM be used for anomaly detection?",opts:["Flag instances with the highest cluster probability","Flag instances in low-density regions (below a density threshold)","Flag instances from the largest Gaussian component","Flag instances with the largest mixing weight"],ans:1,exp:"A GMM estimates data density. Instances in low-density regions are unusual — they can be flagged as anomalies if their estimated density falls below a threshold."},
  {id:"lec14_08",lecture:"Lecture 14",topic:"GMM",type:"tf",label:"True / False",q:"GMM clustering is a form of soft clustering because each instance is assigned a probability of belonging to each component.",opts:["True","False"],ans:0,exp:"True. Unlike K-Means (hard clustering), GMM assigns each instance a probability for every Gaussian component — this is soft clustering."},
  {id:"lec14_09",lecture:"Lecture 14",topic:"EM",type:"tf",label:"True / False",q:"The EM algorithm is guaranteed to converge to the global optimum for GMMs.",opts:["True","False"],ans:1,exp:"False. Like K-Means, EM is susceptible to local optima depending on initialization. Running multiple times with different random seeds can help."},
  {id:"lec14_10",lecture:"Lecture 14",topic:"BIC vs AIC",type:"mc",label:"Multiple Choice",q:"Compared to AIC, BIC tends to:",opts:["Select more complex models with more components","Select simpler models by penalizing complexity more heavily","Always select the same model as AIC","Ignore the number of parameters"],ans:1,exp:"BIC penalizes model complexity (number of parameters) more heavily than AIC, so it tends to select simpler models. AIC is more tolerant of complexity."},
  {id:"lec15_01",lecture:"Lecture 15",topic:"Neural Networks",type:"mc",label:"Multiple Choice",q:"What is the difference between an ANN, DNN, and MLP?",opts:["They are all identical terms","ANN is any neural network; DNN has multiple hidden layers; MLP is a DNN with fully connected stacked layers","DNN is a subset of MLP; ANN is a superset","MLP has only one hidden layer; DNN has none"],ans:1,exp:"ANN = any artificial neural network. DNN = ANN with multiple hidden layers. MLP = the simplest DNN architecture with fully connected layers stacked sequentially."},
  {id:"lec15_02",lecture:"Lecture 15",topic:"Activation Functions",type:"mc",label:"Multiple Choice",q:"Why must activation functions be differentiable?",opts:["To enable faster prediction","So we can compute gradients during backpropagation","To ensure outputs are bounded","Because scikit-learn requires it"],ans:1,exp:"Backpropagation uses the chain rule to compute gradients, which requires the activation function to be differentiable at each layer."},
  {id:"lec15_03",lecture:"Lecture 15",topic:"Activation Functions",type:"mc",label:"Multiple Choice",q:"What is the ReLU activation function?",opts:["ReLU(z) = 1/(1+exp(−z))","ReLU(z) = max(0, z)","ReLU(z) = tanh(z)","ReLU(z) = z²"],ans:1,exp:"ReLU (Rectified Linear Unit) = max(0, z). It passes positive values unchanged and outputs 0 for negatives. No maximum value helps reduce vanishing gradient problems."},
  {id:"lec15_04",lecture:"Lecture 15",topic:"Nonlinearity",type:"mc",label:"Multiple Choice",q:"Why do neural networks need nonlinear activation functions?",opts:["To make training faster","Without nonlinearity, any stack of layers is equivalent to a single linear transformation","To reduce the number of parameters","To enable use of the ReLU function"],ans:1,exp:"If f(x) = 2x+3 and g(x) = 5x−1, then f(g(x)) = 10x+1 — still linear. Without nonlinear activations, deep networks cannot solve complex problems."},
  {id:"lec15_05",lecture:"Lecture 15",topic:"Activation Functions",type:"mc",label:"Multiple Choice",q:"Why is tanh sometimes preferred over sigmoid for hidden layers?",opts:["Tanh is always more accurate","Tanh outputs are centered around 0, which often helps speed up convergence","Tanh is easier to compute","Tanh avoids the vanishing gradient problem entirely"],ans:1,exp:"Tanh outputs range from (−1, 1) and are centered around 0. This means layer outputs are more centered at the start of training, which can speed up gradient descent convergence."},
  {id:"lec15_06",lecture:"Lecture 15",topic:"Backpropagation",type:"mc",label:"Multiple Choice",q:"What are the three main steps of backpropagation for each training instance?",opts:["Initialize, forward pass, backward pass","Forward pass (predict), backward pass (measure error contributions), gradient descent step (update weights)","Compute loss, compute gradient, reset weights","Shuffle data, compute output, update bias"],ans:1,exp:"Backprop: (1) Forward pass: make prediction, compute error. (2) Backward pass: use chain rule to compute each weight's gradient. (3) Update weights using gradient descent."},
  {id:"lec15_07",lecture:"Lecture 15",topic:"Architecture",type:"mc",label:"Multiple Choice",q:"For an MLP performing multi-class classification with 10 classes, how many neurons should the output layer have?",opts:["1","2","10","Depends on hidden layer size"],ans:2,exp:"For multi-class classification, the output layer has one neuron per class (10 here), typically followed by a softmax activation to convert outputs to probabilities."},
  {id:"lec15_08",lecture:"Lecture 15",topic:"Universal Approximation",type:"tf",label:"True / False",q:"A large enough DNN with nonlinear activations can theoretically approximate any continuous function.",opts:["True","False"],ans:0,exp:"True. This is the Universal Approximation Theorem. A sufficiently large DNN with nonlinear activations can approximate any continuous function to arbitrary precision."},
  {id:"lec15_09",lecture:"Lecture 15",topic:"Architecture",type:"mc",label:"Multiple Choice",q:"What is the recommended default hidden layer activation function according to the slides?",opts:["Sigmoid","Tanh","ReLU","Step function"],ans:2,exp:"ReLU is the default for hidden layers. It does not have a maximum output value, which helps reduce vanishing gradient issues and is computationally efficient."},
  {id:"lec15_10",lecture:"Lecture 15",topic:"Architecture",type:"mc",label:"Multiple Choice",q:"For a regression MLP outputting a single value, what is the typical output layer configuration?",opts:["1 neuron with sigmoid","1 neuron with no activation (or ReLU/softplus for positive outputs)","1 neuron with softmax","1 neuron with tanh"],ans:1,exp:"Regression outputs typically use no activation (for any real value), or ReLU/softplus (if outputs must be positive), or tanh/logistic (for bounded outputs). Loss function is MSE."},
  {id:"lec15_11",lecture:"Lecture 15",topic:"Backpropagation",type:"mc",label:"Multiple Choice",q:"What mathematical principle does backpropagation rely on to compute gradients efficiently?",opts:["Law of large numbers","Chain rule of calculus","Bayes theorem","Central limit theorem"],ans:1,exp:"Backpropagation uses the chain rule of calculus to efficiently decompose the gradient of the loss w.r.t. each weight into a product of local gradients, computed layer by layer."},
  {id:"lec15_12",lecture:"Lecture 15",topic:"Sigmoid",type:"equation",label:"Equation",q:"What is the sigmoid activation function?",equation:"σ(z) = ?",opts:["1 / (1 + exp(−z))","max(0, z)","2σ(2z) − 1","exp(z) / Σ exp(z_j)"],ans:0,exp:"Sigmoid: σ(z) = 1 / (1 + exp(−z)). Outputs in (0,1). Used in output layers for binary classification. Tanh is a rescaled version: tanh(z) = 2σ(2z) − 1."},
  {id:"lec16_01",lecture:"Lecture 16",topic:"Keras APIs",type:"mc",label:"Multiple Choice",q:"Which Keras API is easiest to use but limited to simple models with a single input and single output?",opts:["Functional API","Sequential API","Subclassing API","TensorFlow Graph API"],ans:1,exp:"The Sequential API is simplest — you just stack layers. But it only supports models with one input and one output and no branching/skip connections."},
  {id:"lec16_02",lecture:"Lecture 16",topic:"Keras APIs",type:"mc",label:"Multiple Choice",q:"Which Keras API should you use when you need multiple inputs, multiple outputs, or skip connections?",opts:["Sequential API","Subclassing API","Functional API","TensorFlow low-level API"],ans:2,exp:"The Functional API lets you treat layers as functions of other layers, enabling complex topologies like multiple inputs/outputs, skip connections, and shared layers."},
  {id:"lec16_03",lecture:"Lecture 16",topic:"Keras APIs",type:"mc",label:"Multiple Choice",q:"What is a major disadvantage of the Subclassing API?",opts:["It cannot handle multiple outputs","It is too slow for large models","The architecture is hidden in call(), making it hard to inspect, save, or clone","It requires more memory than other APIs"],ans:2,exp:"The Subclassing API hides architecture inside the call() method. Keras cannot easily inspect, save, clone, or check types/shapes ahead of time. Use it only when you need full flexibility."},
  {id:"lec16_04",lecture:"Lecture 16",topic:"Subclassing vs Functional",type:"mc",label:"Multiple Choice",q:"Both the Sequential API and Functional API are described as 'declarative'. What does this mean?",opts:["They require declaring variable types explicitly","You define the architecture (layers and connections) before feeding it data","They only work with predefined architectures","They use symbolic variables like TensorFlow 1.x"],ans:1,exp:"Declarative: you declare layers and connections upfront before any data flows through. This allows Keras to validate, save, and inspect the model. The Subclassing API is imperative by contrast."},
  {id:"lec16_05",lecture:"Lecture 16",topic:"Wide & Deep",type:"mc",label:"Multiple Choice",q:"What is the purpose of a Wide & Deep neural network architecture?",opts:["To increase the number of parameters","To allow the model to learn both simple rules (wide path) and complex patterns (deep path)","To avoid overfitting by reducing depth","To share weights across multiple layers"],ans:1,exp:"Wide & Deep: the wide path connects inputs directly to the output (learns simple rules), while the deep path goes through many hidden layers (learns complex patterns). Together they capture both."},
  {id:"lec16_06",lecture:"Lecture 16",topic:"Hyperparameters",type:"multi",label:"Multi-Select",q:"Which of the following are key hyperparameters to tune in a neural network? (Select all that apply)",opts:["Number of hidden layers","Learning rate","Neurons per layer","Activation function","Column headers"],ans:[0,1,2,3],exp:"Number of layers, learning rate, neurons per layer, and activation function are all key neural network hyperparameters. Column headers are not."},
  {id:"lec16_07",lecture:"Lecture 16",topic:"Multiple Outputs",type:"mc",label:"Multiple Choice",q:"What is one use case for having auxiliary outputs in a neural network?",opts:["To reduce memory usage","As a regularization technique to ensure subnetworks learn useful representations","To speed up forward passes","To reduce the number of parameters"],ans:1,exp:"Auxiliary outputs force intermediate layers to learn meaningful representations on their own, not just serving the final output. This acts as regularization."},
  {id:"lec16_08",lecture:"Lecture 16",topic:"Keras",type:"tf",label:"True / False",q:"Keras can run on top of multiple backend libraries including TensorFlow, CNTK, and Theano.",opts:["True","False"],ans:0,exp:"True. Keras is a high-level API that was designed to run on multiple computational backends (TensorFlow, CNTK, Theano). In practice, TensorFlow is most commonly used."},
  {id:"lec16_09",lecture:"Lecture 16",topic:"Hyperparameters",type:"mc",label:"Multiple Choice",q:"When would you recommend sticking with the Sequential or Functional API over the Subclassing API?",opts:["Never — Subclassing is always best","Unless you need dynamic behaviors like loops or conditional branching, the other APIs are preferable","Only for small models","Only for classification tasks"],ans:1,exp:"The Subclassing API adds flexibility but loses key benefits: inspectability, easy saving/cloning, and compile-time shape checking. Use it only for models that require truly dynamic behavior."},
  {id:"lec16_10",lecture:"Lecture 16",topic:"Architecture",type:"mc",label:"Multiple Choice",q:"In the Wide & Deep architecture, which API would you use to implement it in Keras?",opts:["Sequential API","Functional API","Subclassing API","Any of the above — they are all equivalent"],ans:1,exp:"The Wide & Deep architecture requires splitting inputs across different paths, which requires the Functional API. The Sequential API only supports a single linear stack of layers."},
  {id:"lec16_11",lecture:"Lecture 16",topic:"Hyperparameters",type:"tf",label:"True / False",q:"Increasing the number of hidden layers in an MLP always improves performance on the test set.",opts:["True","False"],ans:1,exp:"False. More layers increase model capacity but also overfitting risk. Proper regularization and cross-validation are needed to determine the optimal architecture."},
  {id:"lec16_12",lecture:"Lecture 16",topic:"Keras APIs",type:"mc",label:"Multiple Choice",q:"What does model.summary() show when using the Subclassing API compared to the Sequential/Functional API?",opts:["Full layer-by-layer architecture with connections","Only a list of layers without connection information","Identical output to the Sequential API","Only the number of parameters"],ans:1,exp:"With the Subclassing API, summary() only shows layers — not how they connect to each other. The Functional and Sequential APIs show the full architecture diagram."},
  {id:"lec19_01",lecture:"Lecture 19",topic:"Convolutional Layers",type:"mc",label:"Multiple Choice",q:"What makes convolutional layers different from fully connected layers in terms of connectivity?",opts:["Convolutional layers connect every neuron to every pixel","Convolutional layer neurons are connected only to a small receptive field, not every pixel","Convolutional layers have no weights","Convolutional layers only work on 1D data"],ans:1,exp:"In convolutional layers, each neuron is connected only to a small region of the previous layer (the receptive field). This allows hierarchical feature detection and reduces the number of parameters."},
  {id:"lec19_02",lecture:"Lecture 19",topic:"Parameter Sharing",type:"mc",label:"Multiple Choice",q:"What is parameter sharing in convolutional layers?",opts:["All layers share the same weights","All neurons in a given feature map share the same weights and bias","Parameters are shared between different architectures","Weights are shared between the wide and deep path"],ans:1,exp:"Within a feature map, all neurons share the same filter weights and bias. This means the filter detects the same feature regardless of its location in the input (translation invariance). Different feature maps have different parameters."},
  {id:"lec19_03",lecture:"Lecture 19",topic:"Stride & Padding",type:"mc",label:"Multiple Choice",q:"What is the stride in a convolutional layer?",opts:["The size of the filter","The shift between adjacent receptive fields","The number of feature maps","The padding added around the input"],ans:1,exp:"Stride is how much the receptive field shifts between adjacent neurons. Stride > 1 reduces the spatial size of the output and reduces computational complexity."},
  {id:"lec19_04",lecture:"Lecture 19",topic:"Stride & Padding",type:"mc",label:"Multiple Choice",q:"What is zero padding used for in CNNs?",opts:["To reduce the number of parameters","To allow a layer to have the same spatial dimensions as its input","To increase stride","To add more feature maps"],ans:1,exp:"Zero padding adds zeros around the input so that a convolutional layer can produce an output with the same height and width as the input ('same' padding). Without it, spatial size decreases with each layer."},
  {id:"lec19_05",lecture:"Lecture 19",topic:"Pooling",type:"mc",label:"Multiple Choice",q:"What is the purpose of pooling layers in a CNN?",opts:["To add more parameters","To reduce the spatial dimensionality of feature maps and computational complexity","To increase the number of feature maps","To apply the activation function"],ans:1,exp:"Pooling reduces the spatial dimensions (height and width) of feature maps, which reduces computation and the number of parameters, while also providing a degree of translation invariance."},
  {id:"lec19_06",lecture:"Lecture 19",topic:"Pooling",type:"mc",label:"Multiple Choice",q:"What does max pooling do?",opts:["Computes the mean value in each window","Takes the maximum value in each pooling window","Applies a learned filter to the input","Sums all values in the window"],ans:1,exp:"Max pooling slides a window over the feature map and outputs the maximum value within each window. It is the most common pooling operation in CNNs."},
  {id:"lec19_07",lecture:"Lecture 19",topic:"CNN Architecture",type:"mc",label:"Multiple Choice",q:"What is the typical structure of a CNN architecture?",opts:["Fully connected → pooling → convolution","Conv+ReLU → Pool → Conv+ReLU → Pool → Fully Connected → Softmax","Pool → Conv → Pool → Softmax","Conv → Softmax → Fully Connected → Pool"],ans:1,exp:"Typical CNN: stack (Conv+ReLU → Pool) several times to extract features, then flatten and pass through fully connected layers, with a softmax output for classification."},
  {id:"lec19_08",lecture:"Lecture 19",topic:"Famous Architectures",type:"mc",label:"Multiple Choice",q:"What was AlexNet's top-5 error rate on the 2012 ILSVRC challenge, and how did it compare to the runner-up?",opts:["17% vs 26% for runner-up","5% vs 10% for runner-up","26% vs 17% for runner-up","7% vs 17% for runner-up"],ans:0,exp:"AlexNet achieved 17% top-5 error — dramatically better than the runner-up at 26%. This win marked the beginning of the deep learning era in computer vision."},
  {id:"lec19_09",lecture:"Lecture 19",topic:"Famous Architectures",type:"mc",label:"Multiple Choice",q:"What was the key innovation of GoogLeNet (2014)?",opts:["Skip connections","Inception modules — parallel filters of different sizes","Depthwise separable convolutions","Residual units"],ans:1,exp:"GoogLeNet introduced Inception modules, which apply multiple filter sizes (e.g., 1×1, 3×3, 5×5) in parallel and concatenate the results. This pushed top-5 error below 7%."},
  {id:"lec19_10",lecture:"Lecture 19",topic:"ResNet",type:"mc",label:"Multiple Choice",q:"What is a skip connection (shortcut connection) in ResNet?",opts:["A connection from the output layer back to the input","The input signal is also added directly to the output of a later layer","A connection between every pair of layers","A dropout applied to skip certain neurons"],ans:1,exp:"A skip connection adds the input of a block directly to the output, allowing the network to learn residual functions f(x) = h(x) - x instead of h(x). This enables training of very deep networks (152 layers)."},
  {id:"lec19_11",lecture:"Lecture 19",topic:"Transfer Learning",type:"mc",label:"Multiple Choice",q:"When using transfer learning with a pretrained CNN, what is the recommended training strategy?",opts:["Unfreeze all layers and train with a high learning rate","Freeze pretrained layers first and train top layers, then unfreeze and train with a lower learning rate","Only train the last layer, never unfreeze others","Randomly reinitialize pretrained weights before training"],ans:1,exp:"First freeze pretrained weights and train only the new top layers. Once they are well-trained, unfreeze the pretrained layers and continue with a much lower learning rate to avoid damaging the learned representations."},
  {id:"lec19_12",lecture:"Lecture 19",topic:"Object Localization",type:"mc",label:"Multiple Choice",q:"How is object localization framed as a machine learning problem?",opts:["As a classification problem with bounding box classes","As a regression problem predicting 4 numbers (x, y, height, width) using MSE loss","As a clustering problem","As a segmentation problem with pixel-wise labels"],ans:1,exp:"Localization = regression: predict the bounding box center coordinates (x, y), height, and width. A second output layer with 4 units is added, trained using MSE loss."},
  {id:"lec19_13",lecture:"Lecture 19",topic:"Parameter Count",type:"mc",label:"Multiple Choice",q:"For a conv layer with 5×5 filters, 200 feature maps, and 3-channel (RGB) input, how many parameters are there?",opts:["5×5×200 = 5000","5×5×3×200 = 15000","(5×5×3+1)×200 = 15200","5×5+1 = 26"],ans:2,exp:"Parameters = (filter_height × filter_width × input_channels + 1_bias) × n_filters = (5×5×3+1)×200 = 76×200 = 15,200. The +1 is for the bias term per feature map."},
  {id:"lec19_14",lecture:"Lecture 19",topic:"CNNs",type:"tf",label:"True / False",q:"In a convolutional layer, neurons in different feature maps use different weights and biases.",opts:["True","False"],ans:0,exp:"True. Each feature map has its own unique filter (weights and bias). Neurons within the same feature map share weights; neurons across different feature maps use different parameters."},
  {id:"lec19_15",lecture:"Lecture 19",topic:"Famous Architectures",type:"mc",label:"Multiple Choice",q:"ResNet won the ILSVRC 2015 challenge with approximately what top-5 error rate?",opts:["17%","7%","Under 3.6%","Under 1%"],ans:2,exp:"ResNet (Kaiming He et al.) achieved under 3.6% top-5 error using a 152-layer network with skip connections — a remarkable result that demonstrated the power of very deep architectures."}
];

const LETTERS=['A','B','C','D','E','F','G','H','I','J'];
function getMissed(){try{return JSON.parse(localStorage.getItem('ml_missed_questions')||'{}');}catch{return{};}}
function saveMissed(d){localStorage.setItem('ml_missed_questions',JSON.stringify(d));}
function getMissedCount(){return Object.keys(getMissed()).length;}
function recordMiss(q){const m=getMissed(),s=JSON.parse(localStorage.getItem('ml_streak_data')||'{}');m[q.id]={id:q.id,lecture:q.lecture,topic:q.topic};s[q.id]=0;saveMissed(m);localStorage.setItem('ml_streak_data',JSON.stringify(s));}
function getSeen(key){try{return JSON.parse(localStorage.getItem(key)||'[]');}catch{return[];}}
function saveSeen(key,arr){localStorage.setItem(key,JSON.stringify(arr));}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function shuffleOpts(q){if(q.type==='tf')return{opts:q.opts,ans:q.ans};const idxs=shuffle(q.opts.map((_,i)=>i));const map={};idxs.forEach((old,n)=>{map[old]=n;});return{opts:idxs.map(i=>q.opts[i]),ans:Array.isArray(q.ans)?q.ans.map(i=>map[i]):map[q.ans]};}
const TOTAL=ALL_QUESTIONS.length;const ROUND_SIZE=20;
function getUnseenPool(){const seen=new Set(getSeen(SEEN_KEY));return ALL_QUESTIONS.map(q=>q.id).filter(id=>!seen.has(id));}
function pickRound(){
  let pool=getUnseenPool();
  if(pool.length<=ROUND_SIZE){
    const picked=shuffle(pool);saveSeen(SEEN_KEY,[]);
    if(picked.length<ROUND_SIZE){const extras=shuffle(ALL_QUESTIONS.map(q=>q.id).filter(id=>!picked.includes(id)));picked.push(...extras.slice(0,ROUND_SIZE-picked.length));}
    saveSeen(SEEN_KEY,picked);return picked.map(id=>ALL_QUESTIONS.find(q=>q.id===id)).filter(Boolean);
  }else{const picked=shuffle(pool).slice(0,ROUND_SIZE);const seen=getSeen(SEEN_KEY);saveSeen(SEEN_KEY,[...seen,...picked]);return picked.map(id=>ALL_QUESTIONS.find(q=>q.id===id)).filter(Boolean);}
}
let deck=[],idx=0,score=0,answered=0,selectedMulti=new Set(),currentAns=null;
function updateSeenBar(){const seen=getSeen(SEEN_KEY).length;document.getElementById('seenProgress').textContent=Math.min(seen,TOTAL)+' / '+TOTAL;}
function init(){deck=pickRound();idx=0;score=0;answered=0;updateSeenBar();renderQ();}
function renderQ(){
  const q=deck[idx];selectedMulti=new Set();
  document.getElementById('metaLecture').textContent=q.lecture;document.getElementById('metaTopic').textContent=q.topic;
  document.getElementById('qTypeBadge').textContent=q.label;document.getElementById('qHint').style.display=q.type==='ms'?'block':'none';
  document.getElementById('qText').textContent=q.q;
  const eqEl=document.getElementById('qEquation');if(q.equation){eqEl.textContent=q.equation;eqEl.style.display='block';}else{eqEl.style.display='none';}
  document.getElementById('explanation').classList.remove('show');document.getElementById('explanation').textContent='';
  document.getElementById('missedNotice').classList.remove('show');document.getElementById('btnNext').classList.remove('show');document.getElementById('btnSubmit').classList.remove('show');
  const{opts,ans}=shuffleOpts(q);currentAns=ans;
  const div=document.getElementById('optionsDiv');div.innerHTML='';
  opts.forEach((o,i)=>{
    const el=document.createElement('div');el.className='opt';
    const ind=document.createElement('span');ind.className='opt-indicator';ind.textContent=q.type==='ms'?'☐':LETTERS[i];
    if(q.optEquations&&q.optEquations[i]){
      const txt=document.createElement('div');txt.style.display='flex';txt.style.flexDirection='column';txt.style.gap='4px';
      const label=document.createElement('span');label.className='opt-text';label.textContent=o;
      txt.appendChild(label);
      el.appendChild(ind);el.appendChild(txt);
    }else{
      const txt=document.createElement('span');txt.className='opt-text';txt.textContent=o;
      el.appendChild(ind);el.appendChild(txt);
    }
    if(q.type==='ms'){el.onclick=()=>{if(el.classList.contains('disabled'))return;if(selectedMulti.has(i)){selectedMulti.delete(i);el.classList.remove('selected');ind.textContent='☐';}else{selectedMulti.add(i);el.classList.add('selected');ind.textContent='☑';}document.getElementById('btnSubmit').classList.toggle('show',selectedMulti.size>0);};}
    else{el.onclick=()=>resolveSingle(i);}
    div.appendChild(el);
  });
  document.getElementById('qCounter').textContent='Question '+(idx+1)+' of '+deck.length;
  document.getElementById('progressFill').style.width=Math.round((idx/deck.length)*100)+'%';
  document.getElementById('scoreDisplay').textContent=score+' / '+answered;
}
function resolveSingle(chosen){
  const correct=chosen===currentAns;const opts=document.getElementById('optionsDiv').children;
  for(let i=0;i<opts.length;i++){opts[i].classList.add('disabled');opts[i].onclick=null;const ind=opts[i].querySelector('.opt-indicator');if(i===currentAns){opts[i].classList.add(correct&&i===chosen?'correct':'reveal-correct');ind.textContent='✓';}else if(i===chosen){opts[i].classList.add('wrong');ind.textContent='✗';}}
  finalize(correct);
}
function submitMulti(){
  const correctSet=new Set(Array.isArray(currentAns)?currentAns:[currentAns]);const correct=selectedMulti.size===correctSet.size&&[...selectedMulti].every(i=>correctSet.has(i));
  const opts=document.getElementById('optionsDiv').children;
  for(let i=0;i<opts.length;i++){opts[i].classList.add('disabled');opts[i].onclick=null;const ind=opts[i].querySelector('.opt-indicator');if(correctSet.has(i)&&selectedMulti.has(i)){opts[i].classList.add('correct');ind.textContent='✓';}else if(!correctSet.has(i)&&selectedMulti.has(i)){opts[i].classList.add('wrong');ind.textContent='✗';}else if(correctSet.has(i)&&!selectedMulti.has(i)){opts[i].classList.add('reveal-correct');ind.textContent='✓';}}
  document.getElementById('btnSubmit').classList.remove('show');finalize(correct);
}
function finalize(correct){
  if(correct){score++;}else{recordMiss(deck[idx]);document.getElementById('missedNotice').classList.add('show');}
  answered++;document.getElementById('scoreDisplay').textContent=score+' / '+answered;
  const exp=document.getElementById('explanation');exp.textContent=(correct?'✓ Correct. ':'✗ Incorrect. ')+deck[idx].exp;exp.classList.add('show');document.getElementById('btnNext').classList.add('show');
}
function nextQ(){idx++;if(idx>=deck.length)showSummary();else renderQ();}
function showSummary(){
  document.getElementById('questionCard').style.display='none';document.getElementById('btnNext').style.display='none';document.getElementById('qCounter').style.display='none';document.getElementById('progressFill').style.width='100%';
  const pct=Math.round((score/deck.length)*100);document.getElementById('summaryScore').textContent=pct+'%';document.getElementById('summaryFrac').textContent=score+' out of '+deck.length+' correct';
  document.getElementById('summaryMsg').textContent=pct>=85?'Strong round — keep going!':pct>=65?'Good effort. Review your misses, then do another round.':'Keep drilling — do the missed deck, then come back for another round.';
  const seen=Math.min(getSeen(SEEN_KEY).length,TOTAL);document.getElementById('summarySeen').textContent='You have now seen '+seen+' of '+TOTAL+' total questions in this deck.';
  const mc=getMissedCount();if(mc>0){document.getElementById('summaryMissedBox').style.display='block';document.getElementById('summaryMissedBox').textContent=mc+' question'+(mc!==1?'s':'')+' in your missed deck.';document.getElementById('linkMissed').style.display='inline-block';}
  document.getElementById('summary').classList.add('show');
}
function newRound(){
  idx=0;score=0;answered=0;deck=pickRound();
  document.getElementById('questionCard').style.display='block';document.getElementById('btnNext').style.display='';document.getElementById('btnNext').classList.remove('show');document.getElementById('qCounter').style.display='block';
  document.getElementById('summary').classList.remove('show');document.getElementById('summaryMissedBox').style.display='none';document.getElementById('linkMissed').style.display='none';
  updateSeenBar();renderQ();
}
init();

</script>
