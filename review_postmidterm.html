  {id:"lec15_17",lecture:"Lecture 15",topic:"Neural Networks",type:"mc",label:"Multiple Choice",q:"Why is weight initialization important in neural networks?",opts:["Poorly initialized weights cause the network to run slower on CPUs","If all weights are initialized to the same value (e.g., zero), all neurons in a layer learn identically and the network acts as if it has only one neuron per layer","Weight initialization determines the final accuracy of the network","Weights must be initialized to 1 for gradient descent to work"],ans:1,exp:"Symmetric weights (all same value) cause symmetric gradients — all neurons in a layer update identically and remain identical forever. This is called the symmetry problem. Random initialization breaks symmetry, allowing each neuron to learn different features."},
  {id:"lec15_18",lecture:"Lecture 15",topic:"Neural Networks",type:"mc",label:"Multiple Choice",q:"What is the vanishing gradient problem and which activation functions are most susceptible?",opts:["Gradients become very large and cause weights to explode — ReLU is most susceptible","Gradients become very small in deep networks, making early layers train very slowly — sigmoid and tanh are most susceptible because their derivatives are near zero for large inputs","Gradients vanish only when the learning rate is too small","Gradients vanish in the output layer but not in hidden layers"],ans:1,exp:"Vanishing gradients: as gradients are backpropagated, they get multiplied by small values (derivatives of sigmoid/tanh are < 0.25). In deep networks this compounds, making early layers' gradients nearly zero and training them extremely slow. ReLU helps since its derivative is 1 for positive inputs."},
  {id:"lec15_19",lecture:"Lecture 15",topic:"Neural Networks",type:"mc",label:"Multiple Choice",q:"For a multi-class classification MLP, what combination of output activation and loss function is standard?",opts:["Sigmoid output + MSE loss","ReLU output + cross-entropy loss","Softmax output + categorical cross-entropy loss","Tanh output + hinge loss"],ans:2,exp:"Standard multi-class classification: softmax output activation (converts scores to probabilities summing to 1) + categorical cross-entropy loss. Binary classification uses sigmoid + binary cross-entropy. Regression uses no activation (or ReLU for positive outputs) + MSE."},
  {id:"lec15_20",lecture:"Lecture 15",topic:"Neural Networks",type:"mc",label:"Multiple Choice",q:"What is a forward pass in backpropagation?",opts:["The phase where gradients are computed from output to input","The phase where the network makes a prediction and computes the error by passing data from input to output","The phase where weights are updated","The phase where the learning rate is adjusted"],ans:1,exp:"In backpropagation, the forward pass goes from input → output: compute each layer's activations and get the final prediction. The error is then computed. The backward pass reverses this, computing gradients layer by layer using the chain rule, then weights are updated."},
  {id:"lec15_21",lecture:"Lecture 15",topic:"Neural Networks",type:"mc",label:"Multiple Choice",q:"What is the typical number of hidden layers recommended for most deep learning tasks?",opts:["Always exactly 1 hidden layer (Universal Approximation guarantees this is enough)","Always 10+ layers","1 to 5 for most tasks; much deeper for very complex tasks like image recognition","The number of hidden layers should equal the number of input features"],ans:2,exp:"For most tasks 1 to 5 hidden layers is a good starting range. Very complex tasks (image recognition, speech) may benefit from much deeper networks. Start with fewer layers, then increase depth while monitoring validation performance."},
  {id:"lec15_22",lecture:"Lecture 15",topic:"Neural Networks",type:"mc",label:"Multiple Choice",q:"What does batch size control in neural network training?",opts:["The number of layers in the network","The number of training instances processed before updating weights — larger batches give more stable gradients but require more memory","The number of neurons per layer","The number of epochs to train for"],ans:1,exp:"Batch size = number of instances used to estimate the gradient before each weight update. Large batches: stable gradient estimates, fast on GPU, but requires more memory and may generalize less well. Small batches: noisier gradients, acts as regularization, can escape local minima."},
  {id:"lec15_23",lecture:"Lecture 15",topic:"Neural Networks",type:"mc",label:"Multiple Choice",q:"Why does the chain rule of calculus make backpropagation efficient?",opts:["It allows gradients to be computed in parallel across all layers","It decomposes the gradient of the loss with respect to any weight into a product of local gradients, which are computed once and reused rather than recomputed for each weight","It eliminates the need for activation functions","It guarantees the network converges to a global minimum"],ans:1,exp:"Backpropagation uses the chain rule to decompose ∂J/∂w = ∂J/∂a · ∂a/∂z · ∂z/∂w. Local gradients (∂a/∂z for each activation, ∂J/∂a for each layer) are computed once in the backward pass and reused for all weights in that layer — this is why backprop is O(parameters) not O(parameters²)."},
  {id:"lec15_24",lecture:"Lecture 15",topic:"Neural Networks",type:"mc",label:"Multiple Choice",q:"For a regression task where the output could be any positive number, what output activation is appropriate?",opts:["Sigmoid — outputs (0,1)","No activation (linear), or ReLU if outputs must be strictly positive","Softmax — outputs probability distribution","Tanh — outputs (−1,1)"],ans:1,exp:"For regression with no bound: use no activation (linear output) with MSE loss. If outputs must be positive (e.g., price), use ReLU or softplus. If bounded between 0 and 1, use sigmoid. If bounded between −1 and 1, use tanh."},
  {id:"lec15_25",lecture:"Lecture 15",topic:"Neural Networks",type:"mc",label:"Multiple Choice",q:"What is an epoch in neural network training?",opts:["A single weight update","One complete pass through the entire training dataset","The number of layers in the network","One mini-batch of data"],ans:1,exp:"An epoch = one complete pass through all training instances. If the dataset has 1000 instances and batch_size=32, one epoch = ceil(1000/32) ≈ 32 weight updates (mini-batch gradient descent). Training typically runs for many epochs until the validation loss stops improving."},
  {id:"lec16_01",lecture:"Lecture 16",topic:"Keras APIs",type:"mc",label:"Multiple Choice",q:"Which Keras API is easiest to use but limited to simple models with a single input and single output?",opts:["Functional API","Sequential API","Subclassing API","TensorFlow Graph API"],ans:1,exp:"The Sequential API is simplest — you just stack layers. But it only supports models with one input and one output and no branching/skip connections."},
  {id:"lec16_02",lecture:"Lecture 16",topic:"Keras APIs",type:"mc",label:"Multiple Choice",q:"Which Keras API should you use when you need multiple inputs, multiple outputs, or skip connections?",opts:["Sequential API","Subclassing API","Functional API","TensorFlow low-level API"],ans:2,exp:"The Functional API lets you treat layers as functions of other layers, enabling complex topologies like multiple inputs/outputs, skip connections, and shared layers."},
  {id:"lec16_03",lecture:"Lecture 16",topic:"Keras APIs",type:"mc",label:"Multiple Choice",q:"What is a major disadvantage of the Subclassing API?",opts:["It cannot handle multiple outputs","It is too slow for large models","The architecture is hidden in call(), making it hard to inspect, save, or clone","It requires more memory than other APIs"],ans:2,exp:"The Subclassing API hides architecture inside the call() method. Keras cannot easily inspect, save, clone, or check types/shapes ahead of time. Use it only when you need full flexibility."},
  {id:"lec16_04",lecture:"Lecture 16",topic:"Subclassing vs Functional",type:"mc",label:"Multiple Choice",q:"Both the Sequential API and Functional API are described as 'declarative'. What does this mean?",opts:["They require declaring variable types explicitly","You define the architecture (layers and connections) before feeding it data","They only work with predefined architectures","They use symbolic variables like TensorFlow 1.x"],ans:1,exp:"Declarative: you declare layers and connections upfront before any data flows through. This allows Keras to validate, save, and inspect the model. The Subclassing API is imperative by contrast."},
  {id:"lec16_05",lecture:"Lecture 16",topic:"Wide & Deep",type:"mc",label:"Multiple Choice",q:"What is the purpose of a Wide & Deep neural network architecture?",opts:["To increase the number of parameters","To allow the model to learn both simple rules (wide path) and complex patterns (deep path)","To avoid overfitting by reducing depth","To share weights across multiple layers"],ans:1,exp:"Wide & Deep: the wide path connects inputs directly to the output (learns simple rules), while the deep path goes through many hidden layers (learns complex patterns). Together they capture both."},
  {id:"lec16_06",lecture:"Lecture 16",topic:"Hyperparameters",type:"ms",label:"Multi-Select",q:"Which of the following are key hyperparameters to tune in a neural network? (Select all that apply)",opts:["Number of hidden layers","Learning rate","Neurons per layer","Activation function","Column headers"],ans:[0,1,2,3],exp:"Number of layers, learning rate, neurons per layer, and activation function are all key neural network hyperparameters. Column headers are not."},
  {id:"lec16_07",lecture:"Lecture 16",topic:"Multiple Outputs",type:"mc",label:"Multiple Choice",q:"What is one use case for having auxiliary outputs in a neural network?",opts:["To reduce memory usage","As a regularization technique to ensure subnetworks learn useful representations","To speed up forward passes","To reduce the number of parameters"],ans:1,exp:"Auxiliary outputs force intermediate layers to learn meaningful representations on their own, not just serving the final output. This acts as regularization."},
  {id:"lec16_08",lecture:"Lecture 16",topic:"Keras",type:"tf",label:"True / False",q:"Keras can run on top of multiple backend libraries including TensorFlow, CNTK, and Theano.",opts:["True","False"],ans:0,exp:"True. Keras is a high-level API that was designed to run on multiple computational backends (TensorFlow, CNTK, Theano). In practice, TensorFlow is most commonly used."},
  {id:"lec16_09",lecture:"Lecture 16",topic:"Hyperparameters",type:"mc",label:"Multiple Choice",q:"When would you recommend sticking with the Sequential or Functional API over the Subclassing API?",opts:["Never — Subclassing is always best","Unless you need dynamic behaviors like loops or conditional branching, the other APIs are preferable","Only for small models","Only for classification tasks"],ans:1,exp:"The Subclassing API adds flexibility but loses key benefits: inspectability, easy saving/cloning, and compile-time shape checking. Use it only for models that require truly dynamic behavior."},
  {id:"lec16_10",lecture:"Lecture 16",topic:"Architecture",type:"mc",label:"Multiple Choice",q:"In the Wide & Deep architecture, which API would you use to implement it in Keras?",opts:["Sequential API","Functional API","Subclassing API","Any of the above — they are all equivalent"],ans:1,exp:"The Wide & Deep architecture requires splitting inputs across different paths, which requires the Functional API. The Sequential API only supports a single linear stack of layers."},
  {id:"lec16_11",lecture:"Lecture 16",topic:"Hyperparameters",type:"tf",label:"True / False",q:"Increasing the number of hidden layers in an MLP always improves performance on the test set.",opts:["True","False"],ans:1,exp:"False. More layers increase model capacity but also overfitting risk. Proper regularization and cross-validation are needed to determine the optimal architecture."},
  {id:"lec16_12",lecture:"Lecture 16",topic:"Keras APIs",type:"mc",label:"Multiple Choice",q:"What does model.summary() show when using the Subclassing API compared to the Sequential/Functional API?",opts:["Full layer-by-layer architecture with connections","Only a list of layers without connection information","Identical output to the Sequential API","Only the number of parameters"],ans:1,exp:"With the Subclassing API, summary() only shows layers — not how they connect to each other. The Functional and Sequential APIs show the full architecture diagram."}
,
  {id:"lec16_13",lecture:"Lecture 16",topic:"Keras APIs",type:"mc",label:"Multiple Choice",q:"Which Keras API would you use for a model that needs to share weights between two branches?",opts:["Sequential API — it supports weight sharing by default","Functional API — you can reuse the same layer object in multiple places","Subclassing API — only dynamic models support weight sharing","No Keras API supports weight sharing"],ans:1,exp:"The Functional API supports shared layers: define the layer once and call it multiple times on different inputs. For example, a Siamese network uses the same encoder on two inputs. The Sequential API cannot do this since it is a strict linear stack."},
  {id:"lec16_14",lecture:"Lecture 16",topic:"Keras APIs",type:"mc",label:"Multiple Choice",q:"In the Functional API, how do you create a model with two inputs?",opts:["Pass a list of inputs and outputs to keras.Model()","Use two separate Sequential models and merge them","Add two Input layers to a Sequential model","Only the Subclassing API supports multiple inputs"],ans:0,exp:"Functional API: define two Input layers, build separate paths, merge them (e.g., concatenate), then pass both inputs and the output to keras.Model(inputs=[input1, input2], outputs=output). This is the standard pattern for Wide & Deep and multi-input models."},
  {id:"lec16_15",lecture:"Lecture 16",topic:"Keras",type:"mc",label:"Multiple Choice",q:"What does model.compile() configure in Keras?",opts:["The number of layers and neurons","The optimizer, loss function, and evaluation metrics — required before training","The random seed for weight initialization","The batch size and number of epochs"],ans:1,exp:"model.compile(optimizer=..., loss=..., metrics=[...]) configures how the model will be trained. The optimizer (e.g., SGD, Adam) defines the update rule; the loss function defines what to minimize; metrics are tracked during training but not used for optimization."},
  {id:"lec16_16",lecture:"Lecture 16",topic:"Keras",type:"mc",label:"Multiple Choice",q:"What does model.fit() return in Keras?",opts:["The trained model itself","A History object containing training and validation loss/metric values at each epoch","The final test accuracy","Nothing — training is done in-place with no return value"],ans:1,exp:"model.fit() returns a History object (history.history is a dict). It contains keys like 'loss', 'val_loss', 'accuracy', 'val_accuracy' with a list of values per epoch. This is used to plot learning curves and detect overfitting."},
  {id:"lec16_17",lecture:"Lecture 16",topic:"Keras",type:"mc",label:"Multiple Choice",q:"What is the difference between model.evaluate() and model.predict() in Keras?",opts:["evaluate() returns accuracy; predict() returns loss","evaluate() computes loss and metrics on a dataset; predict() returns the model's output predictions for each instance","evaluate() is used during training; predict() is used before training","They are identical — just different names for the same method"],ans:1,exp:"model.evaluate(X_test, y_test) returns scalar loss and metric values (e.g., accuracy) — useful for final performance assessment. model.predict(X_new) returns the actual output values (probabilities or regression values) for each instance — used for making predictions."},
  {id:"lec16_18",lecture:"Lecture 16",topic:"Keras",type:"mc",label:"Multiple Choice",q:"In the Wide & Deep architecture, the wide path connects inputs directly to the output layer. What is the benefit of this?",opts:["It prevents overfitting by regularizing the deep path","It allows the model to memorize simple patterns and rules directly, complementing the complex patterns learned by the deep path","It reduces the number of parameters in the model","It makes the model invariant to input scaling"],ans:1,exp:"The wide path directly connects (some) inputs to the output — it can learn simple, direct relationships (e.g., 'if feature X is high, predict Y'). The deep path learns complex combinations through multiple layers. Together they capture both simple rules and complex patterns."},
  {id:"lec16_19",lecture:"Lecture 16",topic:"Keras",type:"mc",label:"Multiple Choice",q:"What is an auxiliary output in a neural network and why is it useful?",opts:["An extra input that provides additional context to the model","An intermediate output from a hidden layer used to add a loss signal during training, acting as regularization","A copy of the main output used for ensemble predictions","A separate model trained in parallel"],ans:1,exp:"An auxiliary output is an extra output attached to an intermediate layer. During training it adds a loss signal that forces that subnetwork to learn useful representations independently. This is a form of regularization — like supervised fine-tuning of intermediate layers. Used in GoogLeNet."},
  {id:"lec16_20",lecture:"Lecture 16",topic:"Keras",type:"mc",label:"Multiple Choice",q:"What callbacks are commonly used in Keras training and what do they do?",opts:["Layer callbacks — modify layers during training","Training callbacks like ModelCheckpoint (save best model), EarlyStopping (stop when validation loss stops improving), and ReduceLROnPlateau (reduce learning rate when plateauing)","Loss callbacks — switch loss functions between epochs","Metric callbacks — add new metrics after each epoch"],ans:1,exp:"Key Keras callbacks: ModelCheckpoint (save the model with best validation loss), EarlyStopping (stop training when validation loss stops improving for n epochs — prevents overfitting), ReduceLROnPlateau (reduce learning rate when validation loss plateaus). Passed to model.fit() via the callbacks argument."},
  {id:"lec16_21",lecture:"Lecture 16",topic:"Keras",type:"mc",label:"Multiple Choice",q:"Which Keras API is best for quickly prototyping a simple feedforward classifier?",opts:["Subclassing API — it is the most flexible","Functional API — it handles all cases","Sequential API — it is the simplest and requires the least code for linear stacks of layers","Raw TensorFlow — it gives the most control"],ans:2,exp:"Sequential API is best for simple linear stacks: model = Sequential([Dense(100, activation='relu'), Dense(10, activation='softmax')]). For anything requiring branches, shared layers, or multiple inputs/outputs, use the Functional API. For truly dynamic models, use Subclassing."},
  {id:"lec16_22",lecture:"Lecture 16",topic:"Keras",type:"mc",label:"Multiple Choice",q:"In Keras, what does setting validation_split=0.1 in model.fit() do?",opts:["Randomly removes 10% of training data permanently","Reserves the last 10% of the training data as a validation set to monitor overfitting during training","Applies 10% dropout regularization","Splits the dataset into 10 equal folds for cross-validation"],ans:1,exp:"validation_split=0.1 tells Keras to hold out the last 10% of the training data as a validation set. Loss and metrics are computed on this set at the end of each epoch. The model does NOT train on this data. Used to monitor overfitting without a separate test set."},
  {id:"lec16_23",lecture:"Lecture 16",topic:"Keras",type:"mc",label:"Multiple Choice",q:"When you save a Keras model with model.save('my_model'), what is saved?",opts:["Only the weights","Only the architecture","The architecture, weights, optimizer state, and training configuration — everything needed to resume training or make predictions","Only the training history"],ans:2,exp:"model.save() saves the complete model: architecture (layer structure), weights (learned parameters), optimizer state (for resuming training), and compile configuration (loss, metrics). You can reload it with keras.models.load_model('my_model') and continue training or use it for inference."},
  {id:"lec16_24",lecture:"Lecture 16",topic:"Keras",type:"mc",label:"Multiple Choice",q:"What is the purpose of the Dense layer in Keras and what does the units parameter set?",opts:["Dense applies convolution; units sets the filter size","Dense is a fully connected layer; units sets the number of neurons (output dimensions) in that layer","Dense applies pooling; units sets the pool size","Dense is a dropout layer; units sets the dropout rate"],ans:1,exp:"Dense is the standard fully connected layer: every input neuron connects to every output neuron. units sets how many neurons (output features) the layer has. Dense(128, activation='relu') creates a layer with 128 neurons and ReLU activation."},
  {id:"lec19_01",lecture:"Lecture 19",topic:"Convolutional Layers",type:"mc",label:"Multiple Choice",q:"What makes convolutional layers different from fully connected layers in terms of connectivity?",opts:["Convolutional layers connect every neuron to every pixel","Convolutional layer neurons are connected only to a small receptive field, not every pixel","Convolutional layers have no weights","Convolutional layers only work on 1D data"],ans:1,exp:"In convolutional layers, each neuron is connected only to a small region of the previous layer (the receptive field). This allows hierarchical feature detection and reduces the number of parameters."},
  {id:"lec19_02",lecture:"Lecture 19",topic:"Parameter Sharing",type:"mc",label:"Multiple Choice",q:"What is parameter sharing in convolutional layers?",opts:["All layers share the same weights","All neurons in a given feature map share the same weights and bias","Parameters are shared between different architectures","Weights are shared between the wide and deep path"],ans:1,exp:"Within a feature map, all neurons share the same filter weights and bias. This means the filter detects the same feature regardless of its location in the input (translation invariance). Different feature maps have different parameters."},
  {id:"lec19_03",lecture:"Lecture 19",topic:"Stride & Padding",type:"mc",label:"Multiple Choice",q:"What is the stride in a convolutional layer?",opts:["The size of the filter","The shift between adjacent receptive fields","The number of feature maps","The padding added around the input"],ans:1,exp:"Stride is how much the receptive field shifts between adjacent neurons. Stride > 1 reduces the spatial size of the output and reduces computational complexity."},
  {id:"lec19_04",lecture:"Lecture 19",topic:"Stride & Padding",type:"mc",label:"Multiple Choice",q:"What is zero padding used for in CNNs?",opts:["To reduce the number of parameters","To allow a layer to have the same spatial dimensions as its input","To increase stride","To add more feature maps"],ans:1,exp:"Zero padding adds zeros around the input so that a convolutional layer can produce an output with the same height and width as the input ('same' padding). Without it, spatial size decreases with each layer."},
  {id:"lec19_05",lecture:"Lecture 19",topic:"Pooling",type:"mc",label:"Multiple Choice",q:"What is the purpose of pooling layers in a CNN?",opts:["To add more parameters","To reduce the spatial dimensionality of feature maps and computational complexity","To increase the number of feature maps","To apply the activation function"],ans:1,exp:"Pooling reduces the spatial dimensions (height and width) of feature maps, which reduces computation and the number of parameters, while also providing a degree of translation invariance."},
  {id:"lec19_06",lecture:"Lecture 19",topic:"Pooling",type:"mc",label:"Multiple Choice",q:"What does max pooling do?",opts:["Computes the mean value in each window","Takes the maximum value in each pooling window","Applies a learned filter to the input","Sums all values in the window"],ans:1,exp:"Max pooling slides a window over the feature map and outputs the maximum value within each window. It is the most common pooling operation in CNNs."},
  {id:"lec19_07",lecture:"Lecture 19",topic:"CNN Architecture",type:"mc",label:"Multiple Choice",q:"What is the typical structure of a CNN architecture?",opts:["Fully connected → pooling → convolution","Conv+ReLU → Pool → Conv+ReLU → Pool → Fully Connected → Softmax","Pool → Conv → Pool → Softmax","Conv → Softmax → Fully Connected → Pool"],ans:1,exp:"Typical CNN: stack (Conv+ReLU → Pool) several times to extract features, then flatten and pass through fully connected layers, with a softmax output for classification."},
  {id:"lec19_08",lecture:"Lecture 19",topic:"Famous Architectures",type:"mc",label:"Multiple Choice",q:"What was AlexNet's top-5 error rate on the 2012 ILSVRC challenge, and how did it compare to the runner-up?",opts:["17% vs 26% for runner-up","5% vs 10% for runner-up","26% vs 17% for runner-up","7% vs 17% for runner-up"],ans:0,exp:"AlexNet achieved 17% top-5 error — dramatically better than the runner-up at 26%. This win marked the beginning of the deep learning era in computer vision."},
  {id:"lec19_09",lecture:"Lecture 19",topic:"Famous Architectures",type:"mc",label:"Multiple Choice",q:"What was the key innovation of GoogLeNet (2014)?",opts:["Skip connections","Inception modules — parallel filters of different sizes","Depthwise separable convolutions","Residual units"],ans:1,exp:"GoogLeNet introduced Inception modules, which apply multiple filter sizes (e.g., 1×1, 3×3, 5×5) in parallel and concatenate the results. This pushed top-5 error below 7%."},
  {id:"lec19_10",lecture:"Lecture 19",topic:"ResNet",type:"mc",label:"Multiple Choice",q:"What is a skip connection (shortcut connection) in ResNet?",opts:["A connection from the output layer back to the input","The input signal is also added directly to the output of a later layer","A connection between every pair of layers","A dropout applied to skip certain neurons"],ans:1,exp:"A skip connection adds the input of a block directly to the output, allowing the network to learn residual functions f(x) = h(x) - x instead of h(x). This enables training of very deep networks (152 layers)."},
  {id:"lec19_11",lecture:"Lecture 19",topic:"Transfer Learning",type:"mc",label:"Multiple Choice",q:"When using transfer learning with a pretrained CNN, what is the recommended training strategy?",opts:["Unfreeze all layers and train with a high learning rate","Freeze pretrained layers first and train top layers, then unfreeze and train with a lower learning rate","Only train the last layer, never unfreeze others","Randomly reinitialize pretrained weights before training"],ans:1,exp:"First freeze pretrained weights and train only the new top layers. Once they are well-trained, unfreeze the pretrained layers and continue with a much lower learning rate to avoid damaging the learned representations."},
  {id:"lec19_12",lecture:"Lecture 19",topic:"Object Localization",type:"mc",label:"Multiple Choice",q:"How is object localization framed as a machine learning problem?",opts:["As a classification problem with bounding box classes","As a regression problem predicting 4 numbers (x, y, height, width) using MSE loss","As a clustering problem","As a segmentation problem with pixel-wise labels"],ans:1,exp:"Localization = regression: predict the bounding box center coordinates (x, y), height, and width. A second output layer with 4 units is added, trained using MSE loss."},
  {id:"lec19_13",lecture:"Lecture 19",topic:"Parameter Count",type:"mc",label:"Multiple Choice",q:"For a conv layer with 5×5 filters, 200 feature maps, and 3-channel (RGB) input, how many parameters are there?",opts:["5×5×200 = 5000","5×5×3×200 = 15000","(5×5×3+1)×200 = 15200","5×5+1 = 26"],ans:2,exp:"Parameters = (filter_height × filter_width × input_channels + 1_bias) × n_filters = (5×5×3+1)×200 = 76×200 = 15,200. The +1 is for the bias term per feature map."},
  {id:"lec19_14",lecture:"Lecture 19",topic:"CNNs",type:"tf",label:"True / False",q:"In a convolutional layer, neurons in different feature maps use different weights and biases.",opts:["True","False"],ans:0,exp:"True. Each feature map has its own unique filter (weights and bias). Neurons within the same feature map share weights; neurons across different feature maps use different parameters."},
  {id:"lec19_15",lecture:"Lecture 19",topic:"Famous Architectures",type:"mc",label:"Multiple Choice",q:"ResNet won the ILSVRC 2015 challenge with approximately what top-5 error rate?",opts:["17%","7%","Under 3.6%","Under 1%"],ans:2,exp:"ResNet (Kaiming He et al.) achieved under 3.6% top-5 error using a 152-layer network with skip connections — a remarkable result that demonstrated the power of very deep architectures."}
,
  {id:"lec19_16",lecture:"Lecture 19",topic:"CNNs",type:"mc",label:"Multiple Choice",q:"Why do early convolutional layers detect low-level features while deeper layers detect high-level features?",opts:["Deeper layers have fewer parameters so they specialize","Each layer builds on the feature maps of the previous layer, combining low-level patterns (edges, textures) into progressively more complex representations","Deeper layers use larger filters than early layers","The activation function changes at each depth level"],ans:1,exp:"This hierarchical feature detection is a key property of CNNs. Layer 1 detects edges and colors. Layer 2 combines edges into textures. Later layers combine textures into object parts, and finally whole objects. This mirrors how the biological visual cortex processes images."},
  {id:"lec19_17",lecture:"Lecture 19",topic:"CNNs",type:"mc",label:"Multiple Choice",q:"What is the receptive field of a neuron in a convolutional layer?",opts:["The entire input image","The small region of the previous layer the neuron is connected to","The set of filters applied to the neuron","The spatial output size of the layer"],ans:1,exp:"The receptive field is the small region in the previous layer (or input image) that a given neuron is connected to. Unlike fully connected layers (connected to everything), each CNN neuron only sees a local patch. This reduces parameters and exploits spatial locality of features."},
  {id:"lec19_18",lecture:"Lecture 19",topic:"CNNs",type:"mc",label:"Multiple Choice",q:"What is the difference between 'same' padding and 'valid' padding in convolutional layers?",opts:["'same' uses larger filters; 'valid' uses smaller filters","'same' adds zeros around the input so output has the same spatial size as input; 'valid' applies no padding so output is smaller","'same' pads with the edge values; 'valid' pads with zeros","'same' is for classification; 'valid' is for regression"],ans:1,exp:"'same' padding adds zeros around the input so the output feature map has the same height and width as the input (when stride=1). 'valid' padding applies no padding, so the output is smaller: output_size = (input_size − filter_size) / stride + 1."},
  {id:"lec19_19",lecture:"Lecture 19",topic:"CNNs",type:"mc",label:"Multiple Choice",q:"Why does parameter sharing in CNNs dramatically reduce the number of parameters compared to fully connected layers?",opts:["CNNs use fewer neurons per layer","All neurons in a feature map share the same weights — one set of filter weights detects the same feature everywhere in the image","CNNs only process a subset of pixels","CNNs use binary weights instead of real-valued weights"],ans:1,exp:"In a fully connected layer, each neuron has its own weight for every input pixel. In a CNN, all neurons in a feature map share the same filter weights — the filter is applied to every location. A 5×5×3 filter has only 75 weights regardless of how large the input is."},
  {id:"lec19_20",lecture:"Lecture 19",topic:"CNN Architecture",type:"mc",label:"Multiple Choice",q:"In a typical CNN architecture, what does the output of the convolutional + pooling layers feed into?",opts:["Directly into the softmax output","One or more fully connected (Dense) layers, then a softmax output for classification","Another set of pooling layers","A recurrent neural network layer"],ans:1,exp:"Typical CNN: stack of (Conv + ReLU + Pool) layers extract spatial features, then the output is flattened and fed into one or more fully connected (Dense) layers. The final Dense layer has softmax for classification or no activation for regression."},
  {id:"lec19_21",lecture:"Lecture 19",topic:"CNNs",type:"mc",label:"Multiple Choice",q:"What is the key difference between max pooling and average pooling?",opts:["Max pooling is trainable; average pooling is not","Max pooling takes the maximum value in each window (keeps the most prominent feature); average pooling takes the mean","Max pooling uses overlapping windows; average pooling does not","Max pooling is only used in the last layer; average pooling is used elsewhere"],ans:1,exp:"Max pooling: output = max value in each pooling window. Preserves the strongest activation (whether the feature is present). Average pooling: output = mean of values. More smoothing. Max pooling is more common; average pooling is used in some architectures (e.g., global average pooling in ResNet/GoogLeNet before the final Dense layer)."},
  {id:"lec19_22",lecture:"Lecture 19",topic:"Famous Architectures",type:"mc",label:"Multiple Choice",q:"LeNet-5 was a landmark CNN architecture. What task was it originally designed for?",opts:["Object detection in autonomous vehicles","Handwritten digit recognition (MNIST-style digits on bank checks)","Face recognition","Image super-resolution"],ans:1,exp:"LeNet-5 (LeCun et al., 1998) was designed for handwritten digit recognition — specifically for reading handwritten checks for banks. It was one of the first practical CNNs, using 5×5 filters, average pooling, and tanh activations. It pioneered the conv→pool→conv→pool→fc architecture."},
  {id:"lec19_23",lecture:"Lecture 19",topic:"Famous Architectures",type:"mc",label:"Multiple Choice",q:"What were two key innovations AlexNet introduced compared to LeNet that enabled its success in 2012?",opts:["Batch normalization and residual connections","ReLU activations (replacing tanh/sigmoid) and dropout regularization, plus training on GPUs","Inception modules and global average pooling","Depthwise separable convolutions and skip connections"],ans:1,exp:"AlexNet (2012) key innovations: (1) ReLU activations — much faster to train than tanh/sigmoid and reduce vanishing gradients, (2) dropout regularization — prevents overfitting in the large fully connected layers, (3) GPU training — enabled much larger networks, (4) data augmentation."},
  {id:"lec19_24",lecture:"Lecture 19",topic:"Famous Architectures",type:"mc",label:"Multiple Choice",q:"What is an Inception module (used in GoogLeNet) and what problem does it solve?",opts:["A skip connection that adds the input to the layer output — solves vanishing gradients","Parallel convolutions with different filter sizes (1×1, 3×3, 5×5) applied simultaneously and concatenated — lets the network learn features at multiple scales without choosing one filter size","A batch normalization layer before each convolution — solves internal covariate shift","A pooling layer that uses inception to choose between max and average pooling adaptively"],ans:1,exp:"Inception modules apply multiple filter sizes (1×1, 3×3, 5×5) and pooling in parallel, then concatenate the outputs. This lets the network learn features at different spatial scales simultaneously without having to choose a single filter size. 1×1 convolutions reduce dimensions before expensive 3×3/5×5 filters."},
  {id:"lec19_25",lecture:"Lecture 19",topic:"CNNs",type:"mc",label:"Multiple Choice",q:"What is the purpose of 1×1 convolutions in deep CNN architectures like GoogLeNet?",opts:["They apply spatial filtering to detect 1-pixel patterns","They reduce the number of feature maps (channels) before expensive larger convolutions, reducing computational cost without losing representational power","They are used only in the output layer to produce class scores","They replace pooling layers for dimensionality reduction"],ans:1,exp:"1×1 convolutions apply a weighted sum across channels at each spatial location, effectively performing dimensionality reduction in the channel dimension. This reduces the number of feature maps before expensive 3×3 or 5×5 convolutions, dramatically reducing parameters and computation."},
  {id:"lec19_26",lecture:"Lecture 19",topic:"Transfer Learning",type:"mc",label:"Multiple Choice",q:"Why is transfer learning particularly effective for image tasks with limited training data?",opts:["Pretrained models are smaller and faster to fine-tune","Lower layers of CNNs trained on large datasets (ImageNet) learn universal low-level features (edges, textures) that are reusable across tasks — you only need to fine-tune higher layers for your specific task","Transfer learning replaces the need for GPUs","Pretrained models already know all possible object categories"],ans:1,exp:"Lower CNN layers detect universal features (edges, corners, textures) that are useful for almost any image task. When you have limited data, reusing these pretrained features and only training the final layers prevents overfitting. The ImageNet pretrained features are extraordinarily general."},
  {id:"lec19_27",lecture:"Lecture 19",topic:"CNNs",type:"mc",label:"Multiple Choice",q:"When would you choose to unfreeze pretrained layers during transfer learning, and how should you adjust training?",opts:["Always unfreeze all layers from the start with a high learning rate","Unfreeze layers only after the new top layers are well-trained, and use a much lower learning rate to avoid destroying the pretrained representations","Never unfreeze pretrained layers — always keep them frozen","Unfreeze only the first layer and retrain all others"],ans:1,exp:"Fine-tuning strategy: first freeze pretrained layers and train only new top layers for several epochs. Once they converge, unfreeze the pretrained layers and continue training with a very low learning rate. The low rate prevents large updates that would destroy the valuable pretrained features."}
];

const LETTERS=['A','B','C','D','E','F','G','H','I','J'];
function getMissed(){try{return JSON.parse(localStorage.getItem('ml_missed_questions')||'{}');}catch{return{};}}
function saveMissed(d){localStorage.setItem('ml_missed_questions',JSON.stringify(d));}
function getMissedCount(){return Object.keys(getMissed()).length;}
function recordMiss(q){const m=getMissed(),s=JSON.parse(localStorage.getItem('ml_streak_data')||'{}');m[q.id]={id:q.id,lecture:q.lecture,topic:q.topic};s[q.id]=0;saveMissed(m);localStorage.setItem('ml_streak_data',JSON.stringify(s));}
function getSeen(key){try{return JSON.parse(localStorage.getItem(key)||'[]');}catch{return[];}}
function saveSeen(key,arr){localStorage.setItem(key,JSON.stringify(arr));}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function shuffleOpts(q){if(q.type==='tf')return{opts:q.opts,ans:q.ans};const idxs=shuffle(q.opts.map((_,i)=>i));const map={};idxs.forEach((old,n)=>{map[old]=n;});return{opts:idxs.map(i=>q.opts[i]),ans:Array.isArray(q.ans)?q.ans.map(i=>map[i]):map[q.ans]};}
const TOTAL=ALL_QUESTIONS.length;const ROUND_SIZE=20;
function getUnseenPool(){const seen=new Set(getSeen(SEEN_KEY));return ALL_QUESTIONS.map(q=>q.id).filter(id=>!seen.has(id));}
function pickRound(){
  let pool=getUnseenPool();
  if(pool.length<=ROUND_SIZE){
    const picked=shuffle(pool);saveSeen(SEEN_KEY,[]);
    if(picked.length<ROUND_SIZE){const extras=shuffle(ALL_QUESTIONS.map(q=>q.id).filter(id=>!picked.includes(id)));picked.push(...extras.slice(0,ROUND_SIZE-picked.length));}
    saveSeen(SEEN_KEY,picked);return picked.map(id=>ALL_QUESTIONS.find(q=>q.id===id)).filter(Boolean);
  }else{const picked=shuffle(pool).slice(0,ROUND_SIZE);const seen=getSeen(SEEN_KEY);saveSeen(SEEN_KEY,[...seen,...picked]);return picked.map(id=>ALL_QUESTIONS.find(q=>q.id===id)).filter(Boolean);}
}
let deck=[],idx=0,score=0,answered=0,selectedMulti=new Set(),currentAns=null;
function updateSeenBar(){const seen=getSeen(SEEN_KEY).length;document.getElementById('seenProgress').textContent=Math.min(seen,TOTAL)+' / '+TOTAL;}
function init(){deck=pickRound();idx=0;score=0;answered=0;updateSeenBar();renderQ();}
function renderQ(){
  const q=deck[idx];selectedMulti=new Set();
  document.getElementById('metaLecture').textContent=q.lecture;document.getElementById('metaTopic').textContent=q.topic;
  document.getElementById('qTypeBadge').textContent=q.label;document.getElementById('qHint').style.display=q.type==='ms'?'block':'none';
  document.getElementById('qText').textContent=q.q;
  const eqEl=document.getElementById('qEquation');if(q.equation){eqEl.textContent=q.equation;eqEl.style.display='block';}else{eqEl.style.display='none';}
  document.getElementById('explanation').classList.remove('show');document.getElementById('explanation').textContent='';
  document.getElementById('missedNotice').classList.remove('show');document.getElementById('btnNext').classList.remove('show');document.getElementById('btnSubmit').classList.remove('show');
  const{opts,ans}=shuffleOpts(q);currentAns=ans;
  const div=document.getElementById('optionsDiv');div.innerHTML='';
  opts.forEach((o,i)=>{
    const el=document.createElement('div');el.className='opt';
    const ind=document.createElement('span');ind.className='opt-indicator';ind.textContent=q.type==='ms'?'☐':LETTERS[i];
    if(q.optEquations&&q.optEquations[i]){
      const txt=document.createElement('div');txt.style.display='flex';txt.style.flexDirection='column';txt.style.gap='4px';
      const label=document.createElement('span');label.className='opt-text';label.textContent=o;
      txt.appendChild(label);
      el.appendChild(ind);el.appendChild(txt);
    }else{
      const txt=document.createElement('span');txt.className='opt-text';txt.textContent=o;
      el.appendChild(ind);el.appendChild(txt);
    }
    if(q.type==='ms'){el.onclick=()=>{if(el.classList.contains('disabled'))return;if(selectedMulti.has(i)){selectedMulti.delete(i);el.classList.remove('selected');ind.textContent='☐';}else{selectedMulti.add(i);el.classList.add('selected');ind.textContent='☑';}document.getElementById('btnSubmit').classList.toggle('show',selectedMulti.size>0);};}
    else{el.onclick=()=>resolveSingle(i);}
    div.appendChild(el);
  });
  document.getElementById('qCounter').textContent='Question '+(idx+1)+' of '+deck.length;
  document.getElementById('progressFill').style.width=Math.round((idx/deck.length)*100)+'%';
  document.getElementById('scoreDisplay').textContent=score+' / '+answered;
}
function resolveSingle(chosen){
  const correct=chosen===currentAns;const opts=document.getElementById('optionsDiv').children;
  for(let i=0;i<opts.length;i++){opts[i].classList.add('disabled');opts[i].onclick=null;const ind=opts[i].querySelector('.opt-indicator');if(i===currentAns){opts[i].classList.add(correct&&i===chosen?'correct':'reveal-correct');ind.textContent='✓';}else if(i===chosen){opts[i].classList.add('wrong');ind.textContent='✗';}}
  finalize(correct);
}
function submitMulti(){
  const correctSet=new Set(Array.isArray(currentAns)?currentAns:[currentAns]);const correct=selectedMulti.size===correctSet.size&&[...selectedMulti].every(i=>correctSet.has(i));
  const opts=document.getElementById('optionsDiv').children;
  for(let i=0;i<opts.length;i++){opts[i].classList.add('disabled');opts[i].onclick=null;const ind=opts[i].querySelector('.opt-indicator');if(correctSet.has(i)&&selectedMulti.has(i)){opts[i].classList.add('correct');ind.textContent='✓';}else if(!correctSet.has(i)&&selectedMulti.has(i)){opts[i].classList.add('wrong');ind.textContent='✗';}else if(correctSet.has(i)&&!selectedMulti.has(i)){opts[i].classList.add('reveal-correct');ind.textContent='✓';}}
  document.getElementById('btnSubmit').classList.remove('show');finalize(correct);
}
function finalize(correct){
  if(correct){score++;}else{recordMiss(deck[idx]);document.getElementById('missedNotice').classList.add('show');}
  answered++;document.getElementById('scoreDisplay').textContent=score+' / '+answered;
  const exp=document.getElementById('explanation');exp.textContent=(correct?'✓ Correct. ':'✗ Incorrect. ')+deck[idx].exp;exp.classList.add('show');document.getElementById('btnNext').classList.add('show');
}
function nextQ(){idx++;if(idx>=deck.length)showSummary();else renderQ();}
function showSummary(){
  document.getElementById('questionCard').style.display='none';document.getElementById('btnNext').style.display='none';document.getElementById('qCounter').style.display='none';document.getElementById('progressFill').style.width='100%';
  const pct=Math.round((score/deck.length)*100);document.getElementById('summaryScore').textContent=pct+'%';document.getElementById('summaryFrac').textContent=score+' out of '+deck.length+' correct';
  document.getElementById('summaryMsg').textContent=pct>=85?'Strong round — keep going!':pct>=65?'Good effort. Review your misses, then do another round.':'Keep drilling — do the missed deck, then come back for another round.';
  const seen=Math.min(getSeen(SEEN_KEY).length,TOTAL);document.getElementById('summarySeen').textContent='You have now seen '+seen+' of '+TOTAL+' total questions in this deck.';
  const mc=getMissedCount();if(mc>0){document.getElementById('summaryMissedBox').style.display='block';document.getElementById('summaryMissedBox').textContent=mc+' question'+(mc!==1?'s':'')+' in your missed deck.';document.getElementById('linkMissed').style.display='inline-block';}
  document.getElementById('summary').classList.add('show');
}
function newRound(){
  idx=0;score=0;answered=0;deck=pickRound();
  document.getElementById('questionCard').style.display='block';document.getElementById('btnNext').style.display='';document.getElementById('btnNext').classList.remove('show');document.getElementById('qCounter').style.display='block';
  document.getElementById('summary').classList.remove('show');document.getElementById('summaryMissedBox').style.display='none';document.getElementById('linkMissed').style.display='none';
  updateSeenBar();renderQ();
}
init();

</script>
</body>
</html>
